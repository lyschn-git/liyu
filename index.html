const koiReady = new Promise(resolve => {
  const img = new Image();
  img.onload = () => { koiImg = img; resolve(); };
  img.onerror = () => { console.log('koi base64 load fail'); resolve(); };
  img.src = KOI_SRC;

let W, H, dpr, ripples = [], lilyList = [], bubbles = [], isTransitioning = false, animId = null;

function resizeCanvas() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth;
  // iOS Safari: innerHeight includes URL bar; use CSS 100vh which is more stable
  H = window.innerHeight || document.documentElement.clientHeight;
  pondCanvas.width = W * dpr; pondCanvas.height = H * dpr;
  pondCanvas.style.width = W + 'px'; pondCanvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

class Koi {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.baseSpeed = 0.4;
    this.speed = this.baseSpeed;
    this.facingRight = true;
    this.vy = 0;
    this.targetVY = (Math.random() - 0.5) * 0.15;
    this.bodyTilt = 0;
    this.phase = Math.random() * Math.PI * 2;
    this.bobPhase = Math.random() * Math.PI * 2;
    this.sliceCount = 30;
    // Curve swimming: multiple overlapping sine waves for organic, non-repeating motion
    this.curvePhase1 = Math.random() * Math.PI * 2;
    this.curvePhase2 = Math.random() * Math.PI * 2;
    this.curvePhase3 = Math.random() * Math.PI * 2;
    this.curveFreq1 = 0.003 + Math.random() * 0.002;
    this.curveFreq2 = 0.007 + Math.random() * 0.004;
    this.curveFreq3 = 0.0013 + Math.random() * 0.001;
    this.curveAmp1 = 0.10 + Math.random() * 0.06;
    this.curveAmp2 = 0.05 + Math.random() * 0.04;
    this.curveAmp3 = 0.06 + Math.random() * 0.05;
    // Speed variation
    this.speedPhase = Math.random() * Math.PI * 2;
    this.speedFreq = 0.002 + Math.random() * 0.002;
    // Occasional mid-screen direction change
    this.turnCooldown = 0;
    this.nextSpontTurn = 400 + Math.random() * 600;
    this.spontTurnTimer = 0;
    // Touch feedback
    this.glowAlpha = 0;
    this.touchScale = 1;
  }
  update() {
    this.phase += 0.05;
    this.bobPhase += 0.015;
    if (this.turnCooldown > 0) this.turnCooldown--;
    // Curve swimming: 3 overlapping sine waves = never-repeating organic path
    this.curvePhase1 += this.curveFreq1;
    this.curvePhase2 += this.curveFreq2;
    this.curvePhase3 += this.curveFreq3;
    const curveVY = Math.sin(this.curvePhase1) * this.curveAmp1
                  + Math.sin(this.curvePhase2) * this.curveAmp2
                  + Math.sin(this.curvePhase3) * this.curveAmp3;
    this.targetVY = curveVY;
    // Occasional random nudge for organic feel
    if (Math.random() < 0.005) {
      this.targetVY += (Math.random() - 0.5) * 0.06;
    }
    // Speed variation: gentle sine wave
    this.speedPhase += this.speedFreq;
    this.speed = this.baseSpeed + Math.sin(this.speedPhase) * 0.12;

  }
  onTouch() {

    this.touchScale = 0.92;
  }
  _drawFallback(c) {

    c.translate(this.x, this.y);

    var dw = Math.min(W * 0.5, 220) * this.touchScale;
    var dh = dw * 0.41;

    bodyGrad.addColorStop(1, '#E85D1A');

    // Head bottom

    c.fill();
    // === Tail ===

    tailGrad.addColorStop(0, '#FF7B2E');
    tailGrad.addColorStop(1, 'rgba(255,123,46,0.3)');

    c.beginPath();
    c.moveTo(-dw*0.38, -dh*0.1);
    c.bezierCurveTo(-dw*0.5, -dh*0.2, -dw*0.6, -dh*0.45, -dw*0.7, -dh*0.5);
    c.bezierCurveTo(-dw*0.6, -dh*0.15, -dw*0.5, 0, -dw*0.5, 0);
    c.bezierCurveTo(-dw*0.5, 0, -dw*0.6, dh*0.15, -dw*0.7, dh*0.5);
    c.bezierCurveTo(-dw*0.6, dh*0.45, -dw*0.5, dh*0.2, -dw*0.38, dh*0.1);

    c.fillStyle = '#FFF5E0';
    c.beginPath();

    c.beginPath();

    c.fill();

    c.quadraticCurveTo(dw*0.0, -dh*0.65, -dw*0.15, -dh*0.42);
    c.lineTo(-dw*0.05, -dh*0.35);
    c.closePath();
    c.fill();
    // === Pectoral fin ===
    c.fillStyle = 'rgba(255,160,80,0.4)';
    c.beginPath();
    c.moveTo(dw*0.15, dh*0.15);
    c.quadraticCurveTo(dw*0.25, dh*0.5, dw*0.05, dh*0.45);
    c.closePath();
    c.fill();
    // === Eye ===
    c.fillStyle = '#2A1A0A';
    c.beginPath();
    c.arc(dw*0.3, -dh*0.08, Math.max(2, dw*0.02), 0, Math.PI*2);
    c.fill();
    // Eye highlight
    c.fillStyle = '#FFFFFF';
    c.beginPath();
    c.arc(dw*0.31, -dh*0.1, Math.max(1, dw*0.008), 0, Math.PI*2);
    c.fill();
    // === Whiskers (barbels) ===
    c.strokeStyle = 'rgba(180,120,60,0.5)';
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(dw*0.4, -dh*0.02);
    c.quadraticCurveTo(dw*0.52, -dh*0.15, dw*0.55, -dh*0.1);
    c.stroke();
    c.beginPath();
    c.moveTo(dw*0.4, dh*0.05);
    c.quadraticCurveTo(dw*0.52, dh*0.18, dw*0.55, dh*0.12);
    c.stroke();
    // === Touch glow ===
    if (this.glowAlpha > 0.01) {
      c.globalAlpha = this.glowAlpha * 0.35;
      var glowGrad = c.createRadialGradient(0, 0, dw*0.1, 0, 0, dw*0.5);
      glowGrad.addColorStop(0, 'rgba(255,215,0,0.6)');
      glowGrad.addColorStop(0.5, 'rgba(255,180,80,0.2)');
      glowGrad.addColorStop(1, 'rgba(255,215,0,0)');
      c.fillStyle = glowGrad;
      c.beginPath();
      c.ellipse(0, 0, dw*0.5, dh*0.55, 0, 0, Math.PI*2);
      c.fill();
    }
    c.restore();
  }
  draw(c) {
    if (!koiImg) { this._drawFallback(c); return; }
    const iw = koiImg.width, ih = koiImg.height;
    const dw = Math.min(W * 0.5, 220) * this.touchScale;
    const dh = dw * (ih / iw);
    const srcSliceW = iw / this.sliceCount;
    const dstSliceW = dw / this.sliceCount;
    const tailAmp = dh * 0.06;
    const waveFreq = 1.2;
    const overlap = 2;
    c.save();
    // Glow effect when touched
    if (this.glowAlpha > 0.01) {
      c.save();
      c.translate(this.x, this.y);
      const glowR = dw * 0.55;
      const glow = c.createRadialGradient(0, 0, dw * 0.15, 0, 0, glowR);
      glow.addColorStop(0, `rgba(255,215,0,${this.glowAlpha * 0.5})`);
      glow.addColorStop(0.5, `rgba(255,180,80,${this.glowAlpha * 0.2})`);
      glow.addColorStop(1, 'rgba(255,180,80,0)');
      c.fillStyle = glow;
      c.beginPath();
      c.arc(0, 0, glowR, 0, Math.PI * 2);
      c.fill();
      c.restore();
    }
    c.translate(this.x, this.y);
    c.rotate(this.facingRight ? this.bodyTilt : -this.bodyTilt);
    c.scale(this.facingRight ? 1 : -1, 1);
    for (let i = 0; i < this.sliceCount; i++) {
      const t = i / (this.sliceCount - 1);
      const amp = tailAmp * Math.pow(1 - t, 2.5);
      const slicePhase = this.phase - t * waveFreq * Math.PI * 2;
      const yOff = Math.sin(slicePhase) * amp;
      const sx = Math.max(0, Math.floor(i * srcSliceW) - (i > 0 ? 1 : 0));
      const sw = Math.ceil(srcSliceW) + (i > 0 && i < this.sliceCount - 1 ? 2 : 1);
      const dx = -dw / 2 + i * dstSliceW - (i > 0 ? overlap / 2 : 0);
      const dy = -dh / 2 + yOff;
      c.drawImage(koiImg, sx, 0, Math.min(sw, iw - sx), ih, dx, dy, dstSliceW + overlap, dh);
    }
    c.restore();
  }
  hitTest(px, py) { const dx = px - this.x, dy = py - this.y; return Math.sqrt(dx * dx + dy * dy) < 90; }
}

class Bubble {
  constructor(x, y) { this.x = x; this.y = y; this.r = 2 + Math.random() * 3; this.speedY = 0.3 + Math.random() * 0.4; this.speedX = (Math.random() - 0.5) * 0.2; this.alpha = 0.25 + Math.random() * 0.12; this.phase = Math.random() * Math.PI * 2; }
  update() { this.y -= this.speedY; this.x += this.speedX + Math.sin(this.phase) * 0.1; this.phase += 0.04; this.alpha -= 0.002; }
  draw(c) { if (this.alpha <= 0) return; c.beginPath(); c.arc(this.x, this.y, this.r, 0, Math.PI * 2); c.fillStyle = `rgba(123,196,184,${this.alpha})`; c.fill(); }
  isDead() { return this.alpha <= 0 || this.y < -10; }
}

class Ripple {
  constructor(x, y, maxR) { this.x = x; this.y = y; this.radius = 0; this.maxRadius = maxR || (70 + Math.random() * 40); this.alpha = 0.45; this.speed = 1.6; }
  update() { this.radius += this.speed; this.alpha -= 0.006; }
  draw(c) { if (this.alpha <= 0) return; c.beginPath(); c.arc(this.x, this.y, this.radius, 0, Math.PI * 2); c.strokeStyle = `rgba(123,196,184,${this.alpha})`; c.lineWidth = 1.5; c.stroke(); if (this.radius > 12) { c.beginPath(); c.arc(this.x, this.y, this.radius * 0.5, 0, Math.PI * 2); c.strokeStyle = `rgba(123,196,184,${this.alpha * 0.3})`; c.lineWidth = 1; c.stroke(); } }
  isDead() { return this.alpha <= 0; }
}

class LilyPad {
  constructor() { this.x = W * 0.08 + Math.random() * W * 0.84; this.y = H * 0.22 + Math.random() * H * 0.35; this.size = 8 + Math.random() * 8; this.rot = Math.random() * Math.PI * 2; this.phase = Math.random() * Math.PI * 2; }
  draw(c, t) { const bob = Math.sin(t * 0.004 + this.phase) * 1.2; c.save(); c.translate(this.x, this.y + bob); c.rotate(this.rot); c.beginPath(); c.arc(0, 0, this.size, 0.12, Math.PI * 2 - 0.12); c.lineTo(0, 0); c.closePath(); const lg = c.createRadialGradient(0, 0, 0, 0, 0, this.size); lg.addColorStop(0, 'rgba(100,180,160,0.1)'); lg.addColorStop(1, 'rgba(74,168,154,0.04)'); c.fillStyle = lg; c.fill(); c.restore(); }
}

function drawWater(t) {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#FFF8F0'); grad.addColorStop(0.2, '#F5FAF8');
  grad.addColorStop(0.45, '#EAF5F2'); grad.addColorStop(0.7, '#D6EFEB');
  grad.addColorStop(1, '#C0E2DD');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 6; i++) {
    ctx.beginPath(); const baseY = H * 0.18 + i * H * 0.09;
    ctx.strokeStyle = `rgba(123,196,184,${0.025 + i * 0.003})`; ctx.lineWidth = 0.7;
    for (let x = 0; x <= W; x += 3) { const y = baseY + Math.sin(x * 0.01 + t * 0.012 + i * 0.8) * 3.5 + Math.sin(x * 0.018 + t * 0.008) * 1.8; if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
    ctx.stroke();
  }
  for (let i = 0; i < 4; i++) {
    const lx = W * 0.12 + i * W * 0.24, ly = H * 0.25 + Math.sin(t * 0.004 + i * 1.5) * 12, lr = 8 + Math.sin(t * 0.003 + i) * 4;
    const glow = ctx.createRadialGradient(lx, ly, 0, lx, ly, lr);
    glow.addColorStop(0, 'rgba(255,215,0,0.08)'); glow.addColorStop(1, 'rgba(255,215,0,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(lx, ly, lr, 0, Math.PI * 2); ctx.fill();
  }
}

let koiList = [], frameCount = 0;

function animate() {
  if (isTransitioning) return; frameCount++;
  ctx.clearRect(0, 0, W, H); drawWater(frameCount);
  lilyList.forEach(l => l.draw(ctx, frameCount));
  koiList.forEach(k => { k.update(); k.draw(ctx); });
  if (frameCount % 30 === 0 && bubbles.length < 4) { const k = koiList[Math.floor(Math.random() * koiList.length)]; bubbles.push(new Bubble(k.x, k.y)); }
  bubbles.forEach(b => { b.update(); b.draw(ctx); }); bubbles = bubbles.filter(b => !b.isDead());
  ripples.forEach(r => { r.update(); r.draw(ctx); }); ripples = ripples.filter(r => !r.isDead());
  animId = requestAnimationFrame(animate);
}

function initPond() {
  resizeCanvas(); koiList = [new Koi(W * 0.5, H * 0.35)];
  lilyList = []; for (let i = 0; i < 2; i++) lilyList.push(new LilyPad());
  bubbles = []; ripples = []; isTransitioning = false; frameCount = 0; animate();
}

let longTimer = null, touchStartTime = 0, touchStartPos = null;

function _getTouchPos(e) {
  const rect = pondCanvas.getBoundingClientRect();
  if (e.changedTouches) { const t = e.changedTouches[0]; return { x: t.clientX - rect.left, y: t.clientY - rect.top }; }
  if (e.touches) { const t = e.touches[0]; return { x: t.clientX - rect.left, y: t.clientY - rect.top }; }
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function _handleHit(px, py) {
  ripples.push(new Ripple(px, py));
  for (const koi of koiList) { if (koi.hitTest(px, py)) { ripples.push(new Ripple(koi.x, koi.y, 90)); triggerReveal(); return true; } }
  return false;
}

pondCanvas.addEventListener('click', function(e) {
  if (isTransitioning) return;
  const pos = _getTouchPos(e);
  _handleHit(pos.x, pos.y);
});

pondCanvas.addEventListener('touchstart', function(e) {
  if (isTransitioning) return;
  e.preventDefault();
  const t = e.touches[0];
  touchStartPos = { x: t.clientX, y: t.clientY };
  touchStartTime = Date.now();
  const rect = pondCanvas.getBoundingClientRect();
  const px = t.clientX - rect.left, py = t.clientY - rect.top;
  // Haptic feedback on fish
  for (const koi of koiList) { if (koi.hitTest(px, py)) { koi.onTouch(); try { navigator.vibrate && navigator.vibrate(15); } catch(ex){} break; } }
  // Long press fallback (500ms)
  longTimer = setTimeout(() => {
    ripples.push(new Ripple(px, py, 80));
    let hit = false;
    for (const koi of koiList) { if (koi.hitTest(px, py)) { hit = true; break; } }
    if (!hit) ripples.push(new Ripple(W * 0.5, H * 0.4, 110));
    triggerReveal();
  }, 500);
}, { passive: false });

pondCanvas.addEventListener('touchend', function(e) {
  const wasLongPress = longTimer === null;
  clearTimeout(longTimer);
  longTimer = null;
  if (isTransitioning) return;
  // Short tap: directly trigger reveal (don't wait for click which iOS may swallow)
  const elapsed = Date.now() - touchStartTime;
  if (elapsed < 400 && touchStartPos) {
    const rect = pondCanvas.getBoundingClientRect();
    const px = touchStartPos.x - rect.left, py = touchStartPos.y - rect.top;
    _handleHit(px, py);
  }
});

pondCanvas.addEventListener('touchmove', function(e) {
  e.preventDefault(); clearTimeout(longTimer); longTimer = null;
  if (!isTransitioning && e.touches[0]) {
    const rect = pondCanvas.getBoundingClientRect();
    const px = e.touches[0].clientX - rect.left, py = e.touches[0].clientY - rect.top;
    for (const koi of koiList) { if (koi.hitTest(px, py) && koi.glowAlpha < 0.1) { koi.onTouch(); try { navigator.vibrate && navigator.vibrate(10); } catch(ex){} break; } }
  }
}, { passive: false });

function triggerReveal() {
  if (isTransitioning) return; isTransitioning = true;
  if (animId) cancelAnimationFrame(animId);
  setTimeout(() => { const cx = W / 2, cy = H * 0.4; ripples.push(new Ripple(cx, cy, 100)); setTimeout(() => ripples.push(new Ripple(cx, cy, 140)), 100); setTimeout(() => ripples.push(new Ripple(cx, cy, 180)), 200); }, 0);
  setTouchMoment();spawnPetals(4);
  setTimeout(() => { document.getElementById('scene-pond').classList.add('hide'); document.getElementById('scene-reveal').classList.add('show'); try{populateReveal();}catch(e){showDebug('显示错误:'+e.message);}  }, 800);
}

function spawnPetals(n) { const container = document.getElementById('scene-pond'); for (let i = 0; i < n; i++) { const p = document.createElement('div'); p.className = 'petal'; p.textContent = ['✦','✧','·','∘'][Math.floor(Math.random() * 4)]; p.style.cssText = `left:${10+Math.random()*80}%;top:-20px;font-size:${8+Math.random()*5}px;animation:petalFall ${3+Math.random()*2}s ease-out ${Math.random()*0.5}s forwards;`; container.appendChild(p); setTimeout(() => p.remove(), 4500); } }

function drawRevealKoi() {
  const kc = document.getElementById('rv-koi-canvas'), c = kc.getContext('2d');
  c.clearRect(0, 0, 88, 88);
  if (koiImg) { c.globalAlpha = 0.5; const dw = 50, dh = dw * koiImg.height / koiImg.width; c.drawImage(koiImg, (88 - dw) / 2, (88 - dh) / 2, dw, dh); c.globalAlpha = 1; }
  else { c.globalAlpha = 0.4; c.fillStyle = '#FFB347'; c.beginPath(); c.ellipse(44, 48, 18, 8, 0, 0, Math.PI*2); c.fill(); c.beginPath(); c.moveTo(28,48); c.lineTo(18,38); c.lineTo(18,58); c.closePath(); c.fill(); c.globalAlpha = 1; }
}

// 按第一个逗号分两行绘制（日签专用，保持换行匀称）
function drawSplitText(ctx,text,x,y,lh){
var ci=text.indexOf('，');
if(ci>0&&ci<text.length-1){
var line1=text.substring(0,ci+1);
var line2=text.substring(ci+1);
// 标点成组：第一行以逗号结尾，第二行须以句号结尾（若无其他结尾标点则补"。"）
var last=line2.charAt(line2.length-1);
if(!/[。！？…！?]/.test(last)){line2+='。';}
ctx.fillText(line1,x,y);
ctx.fillText(line2,x,y+lh);
return y+lh*2;
}else{
// 无逗号则整句不补标点
ctx.fillText(text,x,y);return y+lh;}
}
function wrapTextSafe(ctx,text,x,y,maxW,lh){
var line='',lines=[];
for(var i=0;i<text.length;i++){
var test=line+text[i];
if(ctx.measureText(test).width>maxW&&line){
// 如果剩余只有1个字，合并到上一行
if(text.length-i===1){line+=text[i];lines.push(line);line='';break;}
lines.push(line);line=text[i];
}else{line=test;}
}
if(line)lines.push(line);
for(var j=0;j<lines.length;j++){ctx.fillText(lines[j],x,y+j*lh);}
return y+lines.length*lh;
}

function closeShare(){document.getElementById('share-overlay').classList.remove('show');}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function wrapText(c,text,x,y,maxW,lh){let line='',curY=y;for(let i=0;i<text.length;i++){const test=line+text[i];if(c.measureText(test).width>maxW&&i>0){c.fillText(line,x,curY);line=text[i];curY+=lh;}else line=test;}c.fillText(line,x,curY);return curY;}

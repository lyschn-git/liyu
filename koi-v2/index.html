<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>锦鲤祈福池 · 接财纳福</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#FFD700;--gold-dim:rgba(255,215,0,.5);--gold-glow:rgba(255,200,0,.35);
  --red-deep:#8B0000;--red:#B91C1C;--red-bright:#DC2626;
  --bg-warm:#1a0a02;--bg-glow:rgba(120,40,0,.15);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-warm);font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}

/* ===== L0: WARM VIGNETTE ===== */
.vignette{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 35%,rgba(160,80,0,.12) 0%,rgba(80,20,0,.06) 35%,rgba(15,5,0,.92) 100%)}

/* ===== L1: VIDEO ===== */
#videoBg{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:1;opacity:.5;mix-blend-mode:screen}

/* ===== L2: WARM COLOR WASH ===== */
.warm-wash{position:fixed;inset:0;z-index:2;pointer-events:none;background:linear-gradient(175deg,rgba(255,180,40,.05) 0%,transparent 25%,transparent 65%,rgba(180,60,0,.04) 100%);mix-blend-mode:screen}

/* ===== L3: GOD RAYS ===== */
.god-rays{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.god-rays::before,.god-rays::after{content:'';position:absolute;top:-20%;left:50%;width:200%;height:140%;transform-origin:top center;background:linear-gradient(180deg,rgba(255,200,60,.06) 0%,rgba(255,160,0,.02) 40%,transparent 70%);animation:rayDrift 12s ease-in-out infinite alternate}
.god-rays::before{transform:translateX(-60%) rotate(-8deg)}
.god-rays::after{transform:translateX(-40%) rotate(8deg);animation-delay:-6s;opacity:.6}
@keyframes rayDrift{0%{opacity:.5;transform:translateX(-60%) rotate(-8deg)}100%{opacity:.8;transform:translateX(-55%) rotate(-5deg)}}

/* ===== L4: PARTICLE CANVAS ===== */
#particleCanvas{position:fixed;inset:0;z-index:4;pointer-events:none}

/* ===== L5: LIGHT ORBS ===== */
.orb-layer{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,220,80,.4) 0%,rgba(255,180,40,.15) 35%,transparent 65%);animation:orbFloat ease-in-out infinite alternate;will-change:transform,opacity}
@keyframes orbFloat{0%{opacity:.15;transform:scale(.8) translateY(0)}100%{opacity:.5;transform:scale(1.2) translateY(-15px)}}

/* ===== L6: TEXT LAYER ===== */
.text-layer{position:fixed;inset:0;z-index:6;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center}

/* Main hero text - calligraphy gold */
.hero-text{position:absolute;top:12%;font-family:'Ma Shan Zheng',serif;font-size:clamp(42px,12vw,72px);color:var(--gold);letter-spacing:8px;text-shadow:0 0 30px var(--gold-glow),0 0 60px rgba(255,160,0,.15),0 2px 4px rgba(80,30,0,.6);animation:heroBreathe 4s ease-in-out infinite,heroEntry 1.2s cubic-bezier(.22,1,.36,1) both;writing-mode:horizontal-tb}
.hero-text::after{content:'';position:absolute;inset:-10px -20px;border:1px solid rgba(255,215,0,.12);border-radius:4px;pointer-events:none}
@keyframes heroBreathe{0%,100%{transform:scale(1);text-shadow:0 0 30px var(--gold-glow),0 0 60px rgba(255,160,0,.15),0 2px 4px rgba(80,30,0,.6)}50%{transform:scale(1.015);text-shadow:0 0 40px var(--gold-glow),0 0 80px rgba(255,160,0,.2),0 2px 4px rgba(80,30,0,.6)}}
@keyframes heroEntry{0%{transform:translateY(30px) scale(.9);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}

/* Sub texts - refined, positioned like light watermarks */
.sub-text{position:absolute;font-family:'Ma Shan Zheng',serif;color:var(--gold);letter-spacing:4px;opacity:0;animation:subEntry 1s ease-out both,textFloat 6s ease-in-out infinite}
.st-1{bottom:32%;left:6%;font-size:clamp(16px,4.5vw,22px);text-shadow:0 0 15px var(--gold-glow);animation-delay:.4s,1.4s;text-shadow:0 0 15px var(--gold-glow),0 1px 3px rgba(80,30,0,.5)}
.st-2{bottom:24%;right:6%;font-size:clamp(15px,4.2vw,20px);text-shadow:0 0 15px var(--gold-glow),0 1px 3px rgba(80,30,0,.5);animation-delay:.7s,1.7s}
.st-3{top:30%;right:8%;font-size:clamp(13px,3.6vw,17px);text-shadow:0 0 12px var(--gold-glow),0 1px 2px rgba(80,30,0,.4);animation-delay:1s,2s;opacity:.7}
@keyframes subEntry{0%{transform:translateY(20px);opacity:0}100%{transform:translateY(0);opacity:.75}}
@keyframes textFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ===== L7: HINT TEXT (bottom) ===== */
.hint-text{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:7;pointer-events:none;font-size:12px;color:rgba(255,215,0,.3);letter-spacing:3px;animation:hintPulse 3s ease-in-out infinite}
@keyframes hintPulse{0%,100%{opacity:.2}50%{opacity:.5}}

/* ===== SOUND TOGGLE ===== */
.sound-btn{position:fixed;top:env(safe-area-inset-top,12px);left:12px;z-index:20;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,215,0,.2);background:rgba(60,15,0,.4);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;transition:all .3s;opacity:.5}
.sound-btn:hover,.sound-btn:active{opacity:.8}
.sound-btn.muted{opacity:.25}

/* ===== PRAYER TRIGGER (bottom) ===== */
.prayer-bar{position:fixed;bottom:0;left:0;width:100%;z-index:15;padding:12px 20px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;background:linear-gradient(0deg,rgba(40,8,0,.5) 0%,transparent 100%)}
.prayer-btn{font-family:'Ma Shan Zheng',serif;background:transparent;color:var(--gold);border:1.5px solid rgba(255,215,0,.35);border-radius:24px;padding:12px 36px;font-size:clamp(18px,5vw,22px);letter-spacing:6px;cursor:pointer;transition:all .3s;text-shadow:0 0 12px var(--gold-glow);position:relative;overflow:hidden}
.prayer-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.05) 50%,transparent 60%);opacity:0;transition:opacity .3s}
.prayer-btn:hover::after,.prayer-btn:active::after{opacity:1}
.prayer-btn:active{transform:scale(.95);border-color:var(--gold);background:rgba(255,200,0,.08)}
.prayer-btn .btn-glow{position:absolute;inset:-1px;border-radius:24px;box-shadow:0 0 15px var(--gold-glow),inset 0 0 15px rgba(255,200,0,.05);opacity:.5;animation:btnGlow 3s ease-in-out infinite}
@keyframes btnGlow{0%,100%{opacity:.3}50%{opacity:.6}}

/* ===== PRAYER PANEL ===== */
.prayer-panel{position:fixed;bottom:0;left:0;width:100%;z-index:25;transform:translateY(100%);transition:transform .5s cubic-bezier(.22,1,.36,1);padding:24px 16px calc(24px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;background:linear-gradient(180deg,rgba(60,10,0,.95) 0%,rgba(30,5,0,.98) 100%);backdrop-filter:blur(20px);border-top:1px solid rgba(255,215,0,.2);box-shadow:0 -8px 40px rgba(0,0,0,.5)}
.prayer-panel.open{transform:translateY(0)}
.panel-title{font-family:'Ma Shan Zheng',serif;text-align:center;font-size:clamp(20px,5.5vw,24px);color:var(--gold);letter-spacing:6px;margin-bottom:20px;text-shadow:0 0 10px var(--gold-glow)}
.blessing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.blessing-btn{font-family:'Ma Shan Zheng',serif;background:rgba(255,215,0,.04);border:1px solid rgba(255,215,0,.2);border-radius:12px;padding:16px 8px;text-align:center;color:var(--gold);font-size:clamp(16px,4.5vw,19px);letter-spacing:3px;cursor:pointer;transition:all .2s;text-shadow:0 0 8px rgba(255,200,0,.2)}
.blessing-btn:active{background:rgba(255,215,0,.12);border-color:rgba(255,215,0,.5);transform:scale(.94);box-shadow:0 0 15px var(--gold-glow)}
.panel-close{display:block;margin:0 auto;background:none;border:1px solid rgba(255,215,0,.15);border-radius:20px;color:rgba(255,215,0,.4);padding:8px 24px;font-size:13px;letter-spacing:2px;cursor:pointer;transition:all .2s}
.panel-close:active{background:rgba(255,215,0,.05);color:rgba(255,215,0,.6)}

/* ===== FORTUNE CARD ===== */
.fortune-overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:opacity .5s;backdrop-filter:blur(4px)}
.fortune-overlay.show{opacity:1;pointer-events:auto}
.fortune-card{width:min(280px,80vw);padding:32px 24px 24px;border-radius:12px;background:linear-gradient(170deg,rgba(100,10,0,.95) 0%,rgba(60,5,0,.98) 100%);border:1px solid rgba(255,215,0,.3);box-shadow:0 0 40px rgba(255,200,0,.2),0 12px 40px rgba(0,0,0,.6);text-align:center;transform:translateY(-60px) scale(.9);transition:transform .8s cubic-bezier(.22,1,.36,1),opacity .5s;opacity:0;position:relative}
.fortune-overlay.show .fortune-card{transform:translateY(0) scale(1);opacity:1}
/* Subtle inner border */
.fortune-card::before{content:'';position:absolute;inset:8px;border:1px solid rgba(255,215,0,.1);border-radius:8px;pointer-events:none}
/* Shine sweep */
.fortune-card::after{content:'';position:absolute;top:-60%;left:-60%;width:50%;height:220%;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.04) 48%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 52%,transparent 60%);transform:rotate(30deg);animation:fortuneShine 5s ease-in-out infinite 2s}
@keyframes fortuneShine{0%{transform:translateX(-100%) rotate(30deg)}35%{transform:translateX(250%) rotate(30deg)}100%{transform:translateX(250%) rotate(30deg)}}
.fortune-seal{font-size:28px;margin-bottom:8px;opacity:.8;filter:drop-shadow(0 2px 6px rgba(255,200,0,.3))}
.fortune-label{font-family:'Ma Shan Zheng',serif;font-size:12px;color:rgba(255,215,0,.35);letter-spacing:6px;margin-bottom:14px}
.fortune-text{font-family:'Ma Shan Zheng',serif;font-size:clamp(22px,6vw,28px);color:var(--gold);line-height:1.6;text-shadow:0 0 15px var(--gold-glow),0 2px 4px rgba(80,30,0,.5);letter-spacing:4px}
.fortune-footer{margin-top:16px;font-size:11px;color:rgba(255,215,0,.25);letter-spacing:3px}
.fortune-close{margin-top:20px;background:transparent;color:var(--gold);border:1px solid rgba(255,215,0,.3);border-radius:20px;padding:10px 28px;font-family:'Ma Shan Zheng',serif;font-size:16px;letter-spacing:4px;cursor:pointer;transition:all .2s;text-shadow:0 0 8px var(--gold-glow)}
.fortune-close:active{background:rgba(255,215,0,.08);border-color:var(--gold);transform:scale(.95)}

/* ===== DOUBLE-TAP EFFECTS ===== */
.tap-heart{position:fixed;z-index:10;pointer-events:none;animation:heartPop 1.2s ease-out forwards;will-change:transform,opacity}
@keyframes heartPop{0%{transform:scale(0) rotate(-15deg);opacity:1}20%{transform:scale(1.3) rotate(5deg);opacity:1}100%{transform:scale(.4) translateY(-150px) rotate(-5deg);opacity:0}}

.tap-text{position:fixed;z-index:10;pointer-events:none;font-family:'Ma Shan Zheng',serif;font-size:clamp(24px,6.5vw,32px);color:var(--gold);text-shadow:0 0 15px var(--gold-glow),0 0 30px rgba(255,150,0,.3),0 2px 4px rgba(80,30,0,.5);letter-spacing:2px;animation:textCombo 1s ease-out forwards;will-change:transform,opacity}
@keyframes textCombo{0%{transform:scale(0) rotate(-20deg) translateY(0);opacity:0}12%{transform:scale(1.4) rotate(5deg) translateY(-10px);opacity:1}30%{transform:scale(1) rotate(-3deg) translateY(-30px);opacity:1}100%{transform:scale(.3) rotate(8deg) translateY(-140px);opacity:0}}

.tap-ripple{position:fixed;z-index:8;pointer-events:none;border-radius:50%;border:1.5px solid rgba(255,215,0,.3);animation:rippleExpand .8s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes rippleExpand{0%{width:0;height:0;opacity:.6}100%{width:120px;height:120px;opacity:0}}

/* ===== FLOATING BLESSING ===== */
.float-blessing{position:fixed;z-index:12;pointer-events:none;font-family:'Ma Shan Zheng',serif;font-size:clamp(26px,7vw,36px);color:var(--gold);text-shadow:0 0 20px var(--gold-glow),0 0 40px rgba(255,150,0,.3),0 3px 6px rgba(80,30,0,.5);letter-spacing:4px;animation:blessingFloat 3s ease-out forwards;will-change:transform,opacity}
@keyframes blessingFloat{0%{transform:translateY(0) scale(0) rotate(-8deg);opacity:0}10%{transform:translateY(-10px) scale(1.2) rotate(2deg);opacity:1}20%{transform:translateY(-25px) scale(1) rotate(-1deg);opacity:1}100%{transform:translateY(-200px) scale(.5) rotate(3deg);opacity:0}}

/* ===== FIRST TOUCH OVERLAY ===== */
.first-touch{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(60,15,0,.92),rgba(10,2,0,.97));backdrop-filter:blur(6px);cursor:pointer;transition:opacity 1s}
.first-touch.hide{opacity:0;pointer-events:none}
.ft-glow{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,0,.2) 0%,transparent 65%);display:flex;align-items:center;justify-content:center;animation:ftPulse 3s ease-in-out infinite;margin-bottom:20px;position:relative}
.ft-glow::after{content:'';position:absolute;inset:-20px;border-radius:50%;border:1px solid rgba(255,215,0,.08);animation:ftRing 3s ease-in-out infinite .5s}
@keyframes ftPulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.08);opacity:1}}
@keyframes ftRing{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.15);opacity:.6}}
.ft-icon{font-size:48px;animation:ftSwim 4s ease-in-out infinite}
@keyframes ftSwim{0%,100%{transform:translateX(0) scaleX(1)}25%{transform:translateX(8px) scaleX(1)}50%{transform:translateX(0) scaleX(-1)}75%{transform:translateX(-8px) scaleX(-1)}}
.ft-title{font-family:'Ma Shan Zheng',serif;font-size:clamp(28px,8vw,40px);color:var(--gold);letter-spacing:6px;text-shadow:0 0 25px var(--gold-glow),0 3px 6px rgba(80,30,0,.4);margin-bottom:8px}
.ft-sub{font-family:'Ma Shan Zheng',serif;font-size:15px;color:rgba(255,215,0,.35);letter-spacing:5px}
.ft-hint{font-size:12px;color:rgba(255,215,0,.2);margin-top:36px;letter-spacing:3px;animation:ftHintPulse 2.5s ease-in-out infinite}
@keyframes ftHintPulse{0%,100%{opacity:.15}50%{opacity:.4}}

/* ===== RESPONSIVE ===== */
@media(max-width:375px){
  .hero-text{font-size:clamp(36px,10vw,52px);letter-spacing:6px}
  .blessing-grid{gap:8px}
  .blessing-btn{padding:12px 6px}
}
</style>
</head>
<body>

<!-- L0: WARM VIGNETTE -->
<div class="vignette"></div>

<!-- L1: VIDEO -->
<video id="videoBg" autoplay muted loop playsinline><source src="assets/koi_bg.mp4" type="video/mp4"></video>

<!-- L2: WARM WASH -->
<div class="warm-wash"></div>

<!-- L3: GOD RAYS -->
<div class="god-rays"></div>

<!-- L4: PARTICLE CANVAS -->
<canvas id="particleCanvas"></canvas>

<!-- L5: LIGHT ORBS -->
<div class="orb-layer" id="orbLayer"></div>

<!-- L6: TEXT LAYER -->
<div class="text-layer">
  <div class="hero-text">流水生财</div>
  <div class="sub-text st-1">见者有份 · 接财</div>
  <div class="sub-text st-2">今日宜 · 暴富</div>
  <div class="sub-text st-3">行运信号</div>
</div>

<!-- HINT -->
<div class="hint-text" id="hintText">双击 · 接好运</div>

<!-- SOUND -->
<div class="sound-btn" id="soundBtn" onclick="toggleSound()">🔊</div>

<!-- PRAYER BAR -->
<div class="prayer-bar">
  <div class="prayer-btn" id="prayerBtn" onclick="openPrayer()">
    <span class="btn-glow"></span>
    🙏 接财祈福
  </div>
</div>

<!-- PRAYER PANEL -->
<div class="prayer-panel" id="prayerPanel">
  <div class="panel-title">选一句祈福词</div>
  <div class="blessing-grid" id="blessingGrid"></div>
  <button class="panel-close" onclick="closePrayer()">收起</button>
</div>

<!-- FORTUNE CARD -->
<div class="fortune-overlay" id="fortuneOverlay" onclick="closeFortune(event)">
  <div class="fortune-card" id="fortuneCard">
    <div class="fortune-seal">🐟</div>
    <div class="fortune-label">—— 财神指引 ——</div>
    <div class="fortune-text" id="fortuneText"></div>
    <div class="fortune-footer">锦鲤祈福池</div>
    <button class="fortune-close" onclick="closeFortune(event,true)">🙏 接住了</button>
  </div>
</div>

<!-- FIRST TOUCH -->
<div class="first-touch" id="firstTouch">
  <div class="ft-glow"><div class="ft-icon">🐟</div></div>
  <div class="ft-title">锦鲤祈福池</div>
  <div class="ft-sub">流水生财 · 接财纳福</div>
  <div class="ft-hint">— 点触开启 —</div>
</div>

<script>
// ===== CONFIG =====
const FORTUNES=[
  '财运亨通，日进斗金','接财！大财小财滚滚来','金银满堂，富贵吉祥',
  '今日偏财运爆棚','财神爷在向你招手','钱从四面八方来',
  '钱包鼓鼓，好运连连','发财！暴富就在此刻','金元宝向你飞来',
  '今年注定发财年','财如春水滚滚来','一路发发发',
  '横财就手，正财稳固','聚宝盆里满是金','招财进宝，万事亨通',
  '你天生就是发财命','钱途无量，未来可期','黄金万两，好运连连',
  '锦鲤附体，财运大旺','今年暴富指日可待'
];
const BLESSINGS=['接财','财入我家','好运','旺自己','金银满堂','日进斗金','暴富','发大财','偏财旺'];
const TAP_WORDS=['发','旺','财','💰','发发发'];

// ===== STATE =====
let audioCtx=null,waterGain=null,isSoundOn=false,isStarted=false;
let lastTap=0,longPressTimer=null;
const dpr=Math.min(window.devicePixelRatio||1,2);

// ===== INIT ORBS =====
function initOrbs(){
  const c=document.getElementById('orbLayer');
  for(let i=0;i<12;i++){
    const s=document.createElement('div');s.className='orb';
    const sz=20+Math.random()*60;
    s.style.width=sz+'px';s.style.height=sz+'px';
    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
    s.style.animationDuration=(3+Math.random()*5)+'s';
    s.style.animationDelay=(-Math.random()*6)+'s';
    s.style.animationDirection=Math.random()>.5?'alternate':'alternate-reverse';
    c.appendChild(s);
  }
}

// ===== PARTICLE SYSTEM =====
const canvas=document.getElementById('particleCanvas');
const ctx=canvas.getContext('2d');
let particles=[],ambientP=[];

function resizeCanvas(){
  canvas.width=window.innerWidth*dpr;
  canvas.height=window.innerHeight*dpr;
  canvas.style.width=window.innerWidth+'px';
  canvas.style.height=window.innerHeight+'px';
}

class Particle{
  constructor(x,y,type){
    this.x=x;this.y=y;this.type=type;
    if(type==='burst'){
      this.vx=(Math.random()-.5)*4;this.vy=-(2+Math.random()*4);
      this.life=1;this.decay=.014+Math.random()*.016;
      this.size=2+Math.random()*3.5;
      this.hue=40+Math.random()*15;this.sat=100;this.lit=50+Math.random()*20;
    }else if(type==='rise'){
      this.vx=(Math.random()-.5)*.2;this.vy=-(0.3+Math.random()*.6);
      this.life=1;this.decay=.002+Math.random()*.003;
      this.size=1+Math.random()*2;
      this.hue=42+Math.random()*12;this.sat=100;this.lit=55+Math.random()*15;
    }else{// ambient
      this.vx=(Math.random()-.5)*.25;this.vy=-(0.1+Math.random()*.25);
      this.life=1;this.decay=.002+Math.random()*.002;
      this.size=.8+Math.random()*1.5;
      this.hue=40+Math.random()*10;this.sat=90;this.lit=50+Math.random()*15;
    }
  }
  update(){
    this.x+=this.vx;this.y+=this.vy;this.life-=this.decay;
    if(this.type==='burst')this.vy+=.05;
    if(this.type==='rise'){this.vx+=(Math.random()-.5)*.03;if(this.y<-10){this.y=window.innerHeight+10;this.life=.8}}
    if(this.type==='ambient'){
      this.vx+=((Math.random()-.5)*.01);
      if(this.y<-10||this.life<=0){this.y=window.innerHeight+5;this.x=Math.random()*window.innerWidth;this.life=1}
    }
  }
  draw(c){
    const a=Math.max(0,this.life)*.6;
    c.globalAlpha=a;
    c.fillStyle=`hsla(${this.hue},${this.sat}%,${this.lit}%,${a})`;
    c.beginPath();c.arc(this.x,this.y,this.size,0,Math.PI*2);c.fill();
    // glow
    if(this.size>1.5){
      c.globalAlpha=a*.2;
      c.fillStyle=`hsla(${this.hue},${this.sat}%,${this.lit}%,${a*.2})`;
      c.beginPath();c.arc(this.x,this.y,this.size*2.5,0,Math.PI*2);c.fill();
    }
  }
}

function initAmbient(){
  const w=window.innerWidth,h=window.innerHeight;
  for(let i=0;i<35;i++) ambientP.push(new Particle(Math.random()*w,Math.random()*h,'ambient'));
  for(let i=0;i<18;i++) ambientP.push(new Particle(Math.random()*w,Math.random()*h,'rise'));
}

function burst(x,y,n){for(let i=0;i<n;i++)particles.push(new Particle(x,y,'burst'))}

function animate(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
  ambientP.forEach(p=>{p.update();p.draw(ctx)});
  particles=particles.filter(p=>{p.update();p.draw(ctx);return p.life>0});
  ctx.globalAlpha=1;
  requestAnimationFrame(animate);
}

// ===== WEB AUDIO (warm water) =====
function initAudio(){
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  const len=audioCtx.sampleRate*4;
  const buf=audioCtx.createBuffer(2,len,audioCtx.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=buf.getChannelData(ch);let lo=0;
    for(let i=0;i<len;i++){
      const w=Math.random()*2-1;
      lo=(lo+.02*w)/1.02;
      d[i]=lo*3.5+Math.sin(i*.0008+Math.random()*.3)*.012;
    }
  }
  const src=audioCtx.createBufferSource();src.buffer=buf;src.loop=true;
  const lp=audioCtx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=800;lp.Q.value=.7;
  const bp=audioCtx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=400;bp.Q.value=.5;
  const lfo=audioCtx.createOscillator();const lg=audioCtx.createGain();
  lfo.frequency.value=.2;lg.gain.value=100;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
  waterGain=audioCtx.createGain();waterGain.gain.value=0;
  src.connect(lp);lp.connect(bp);bp.connect(waterGain);waterGain.connect(audioCtx.destination);src.start();
}

function startWater(){
  if(!audioCtx)initAudio();
  if(audioCtx.state==='suspended')audioCtx.resume();
  isSoundOn=true;
  waterGain.gain.cancelScheduledValues(audioCtx.currentTime);
  waterGain.gain.setTargetAtTime(.18,audioCtx.currentTime,.8);
  document.getElementById('soundBtn').classList.remove('muted');
  document.getElementById('soundBtn').textContent='🔊';
}
function stopWater(){
  isSoundOn=false;
  waterGain.gain.cancelScheduledValues(audioCtx.currentTime);
  waterGain.gain.setTargetAtTime(0,audioCtx.currentTime,.4);
  document.getElementById('soundBtn').classList.add('muted');
  document.getElementById('soundBtn').textContent='🔇';
}
function toggleSound(){if(!isStarted)return;isSoundOn?stopWater():startWater()}

// ===== DING =====
function playDing(){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='sine';o.frequency.setValueAtTime(1200,audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(800,audioCtx.currentTime+.15);
  g.gain.setValueAtTime(.1,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.3);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.3);
  const o2=audioCtx.createOscillator(),g2=audioCtx.createGain();
  o2.type='sine';o2.frequency.setValueAtTime(1800,audioCtx.currentTime+.06);
  o2.frequency.exponentialRampToValueAtTime(1300,audioCtx.currentTime+.18);
  g2.gain.setValueAtTime(.04,audioCtx.currentTime+.06);
  g2.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.22);
  o2.connect(g2);g2.connect(audioCtx.destination);o2.start();o2.stop(audioCtx.currentTime+.22);
}

// ===== FIRST TOUCH =====
document.getElementById('firstTouch').addEventListener('click',function(){
  if(isStarted)return;
  isStarted=true;
  this.classList.add('hide');
  setTimeout(()=>this.style.display='none',1000);
  startWater();
  initAmbient();
});

// ===== DOUBLE TAP =====
function doDoubleTap(x,y){
  const h=document.createElement('div');h.className='tap-heart';
  h.textContent='✨';h.style.left=(x-18)+'px';h.style.top=(y-18)+'px';
  h.style.fontSize=(32+Math.random()*14)+'px';
  document.body.appendChild(h);setTimeout(()=>h.remove(),1200);
  setTimeout(()=>{
    const h2=document.createElement('div');h2.className='tap-heart';
    h2.textContent='💛';h2.style.left=(x-12+Math.random()*24)+'px';h2.style.top=(y-25)+'px';
    h2.style.fontSize=(26+Math.random()*12)+'px';
    document.body.appendChild(h2);setTimeout(()=>h2.remove(),1200);
  },80);
  const words=TAP_WORDS.sort(()=>Math.random()-.5).slice(0,2);
  words.forEach((w,i)=>{
    const el=document.createElement('div');el.className='tap-text';
    el.textContent=w;
    el.style.left=(x-14+(Math.random()-.5)*40)+'px';
    el.style.top=(y-20-i*25)+'px';
    el.style.animationDelay=(i*.1)+'s';
    document.body.appendChild(el);setTimeout(()=>el.remove(),1000);
  });
  burst(x,y,18);
  playDing();
  if(navigator.vibrate)navigator.vibrate(25);
  const r=document.createElement('div');r.className='tap-ripple';
  r.style.left=x+'px';r.style.top=y+'px';
  document.body.appendChild(r);setTimeout(()=>r.remove(),800);
}

// ===== PRAYER =====
function initBlessingGrid(){
  const g=document.getElementById('blessingGrid');
  BLESSINGS.forEach(b=>{
    const btn=document.createElement('div');btn.className='blessing-btn';
    btn.textContent=b;btn.onclick=()=>selectBlessing(b);
    g.appendChild(btn);
  });
}
function openPrayer(){document.getElementById('prayerPanel').classList.add('open');if(navigator.vibrate)navigator.vibrate(20)}
function closePrayer(){document.getElementById('prayerPanel').classList.remove('open')}

function selectBlessing(text){
  closePrayer();
  const cx=window.innerWidth/2,cy=window.innerHeight*.4;
  const el=document.createElement('div');el.className='float-blessing';
  el.textContent=text;
  el.style.left=(cx-text.length*14)+'px';el.style.top=cy+'px';
  document.body.appendChild(el);setTimeout(()=>el.remove(),3000);
  burst(cx,cy,22);playDing();
  if(navigator.vibrate)navigator.vibrate(30);
  setTimeout(()=>showFortune(),1500);
}

function showFortune(){
  document.getElementById('fortuneText').textContent=FORTUNES[Math.floor(Math.random()*FORTUNES.length)];
  document.getElementById('fortuneOverlay').classList.add('show');
  if(navigator.vibrate)navigator.vibrate([30,15,30]);
}
function closeFortune(e,force){
  if(force||e.target===document.getElementById('fortuneOverlay')){
    document.getElementById('fortuneOverlay').classList.remove('show');
    burst(window.innerWidth/2,window.innerHeight/2,20);
    playDing();
  }
}

// ===== TOUCH EVENTS =====
document.addEventListener('touchstart',function(e){
  if(!isStarted)return;
  const t=e.touches[0],x=t.clientX,y=t.clientY,now=Date.now();
  longPressTimer=setTimeout(()=>{longPressTimer=null;openPrayer()},550);
  if(now-lastTap<350){clearTimeout(longPressTimer);doDoubleTap(x,y);lastTap=0}
  else lastTap=now;
},{passive:true});
document.addEventListener('touchend',()=>clearTimeout(longPressTimer));
document.addEventListener('touchmove',()=>clearTimeout(longPressTimer),{passive:true});
document.addEventListener('dblclick',function(e){if(isStarted)doDoubleTap(e.clientX,e.clientY)});

// ===== INIT =====
function init(){
  resizeCanvas();
  window.addEventListener('resize',resizeCanvas);
  initOrbs();initBlessingGrid();
  animate();
  document.getElementById('videoBg').play().catch(()=>{});
}
init();
</script>

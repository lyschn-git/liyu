<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>鲤伴 - 锦鲤合成好运来</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
body, html { width: 100%; height: 100%; overflow: hidden; touch-action: none; font-family: 'Noto Sans SC', sans-serif; background: #1a5f7a; }
#game-world { position: relative; width: 100%; height: 100%; }
#game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

.pond-title {
    position: absolute; top: max(env(safe-area-inset-top), 14px); left: 18px; z-index: 20;
    font-family: 'Noto Serif SC', serif; font-size: 17px; font-weight: 700;
    color: rgba(255,215,0,0.75); text-shadow: 0 1px 8px rgba(0,0,0,0.5), 0 0 12px rgba(255,215,0,0.15);
    pointer-events: none;
}
.fortune-btn {
    position: absolute; top: max(env(safe-area-inset-top), 14px); right: 18px; z-index: 20;
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: radial-gradient(circle at 40% 40%, rgba(139,92,246,0.5), rgba(249,115,22,0.35));
    box-shadow: 0 0 10px rgba(255,215,0,0.25), inset 0 0 6px rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.85); cursor: pointer;
}
.fortune-btn:active { transform: scale(0.9); }

.tap-hint {
    position: absolute; bottom: 58px; left: 50%; transform: translateX(-50%);
    font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.5);
    text-shadow: 0 1px 4px rgba(0,0,0,0.4);
    animation: hintPulse 3s ease-in-out infinite; pointer-events: none; z-index: 10;
    white-space: nowrap;
}
@keyframes hintPulse { 0%, 100% { opacity: .4; } 50% { opacity: .75; } }

.merge-entry {
    position: absolute; bottom: max(env(safe-area-inset-bottom), 12px); left: 50%; transform: translateX(-50%);
    z-index: 15; display: flex; gap: 28px;
}
.merge-btn {
    padding: 0; border: none; cursor: pointer; font-family: 'Noto Sans SC', sans-serif;
    font-size: 12px; font-weight: 400; color: rgba(255,255,255,0.45);
    text-shadow: 0 1px 3px rgba(0,0,0,0.3); background: none; transition: color 0.2s;
}
.merge-btn:active { color: rgba(255,255,255,0.8); }

.fortune-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5); display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s; z-index: 100;
}
.fortune-overlay.visible { opacity: 1; visibility: visible; }
.fortune-card-container {
    position: relative; width: min(320px, 78vw); aspect-ratio: 2/3;
    transform: scale(0.8) translateY(40px); opacity: 0;
    transition: transform 0.5s cubic-bezier(0.68,-0.6,0.32,1.6), opacity 0.3s;
}
.fortune-overlay.visible .fortune-card-container { transform: scale(1) translateY(0); opacity: 1; }
.fortune-card {
    width: 100%; height: 100%; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 44px 24px; border-radius: 14px; overflow: hidden;
}
.fortune-card-bg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; border-radius: 14px;
}
.fortune-chinese {
    font-family: 'Noto Serif SC', serif; font-size: 50px; font-weight: 700;
    color: #ffd700; text-shadow: 2px 2px 4px rgba(0,0,0,0.3), 0 0 16px rgba(255,215,0,0.4); margin-bottom: 8px;
}
.fortune-english { font-size: 16px; font-weight: 600; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); margin-bottom: 14px; }
.fortune-message { font-size: 14px; color: #ffe4b5; text-align: center; max-width: 240px; line-height: 1.6; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); }
.fortune-bonus {
    margin-top: 12px; padding: 5px 14px; border-radius: 14px;
    background: linear-gradient(135deg, rgba(139,92,246,0.75), rgba(249,115,22,0.75));
    color: #fff; font-size: 12px; font-weight: 700;
}
.fortune-buttons { display: flex; gap: 10px; margin-top: 18px; width: 100%; max-width: 280px; }
.fortune-btn-action {
    flex: 1; padding: 12px; font-family: 'Noto Sans SC', sans-serif;
    font-size: 14px; font-weight: 600; border: none; border-radius: 40px; cursor: pointer;
    min-height: 44px; display: flex; align-items: center; justify-content: center; transition: transform 0.15s;
}
.fortune-btn-action:active { transform: scale(0.95); }
.btn-share { background: linear-gradient(135deg, #ffd700, #ffb347); color: #8b4513; box-shadow: 0 3px 10px rgba(255,215,0,0.3); }
.btn-close { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.85); }

.toast {
    position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(12px);
    background: rgba(0,0,0,0.65); color: rgba(255,255,255,0.85); padding: 8px 18px; border-radius: 20px;
    font-size: 12px; opacity: 0; transition: opacity 0.3s, transform 0.3s; z-index: 200;
    pointer-events: none; text-align: center; max-width: 75%; white-space: nowrap;
}
.toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="game-world">
    <canvas id="game-canvas"></canvas>
    <div class="pond-title">鲤伴</div>
    <button class="fortune-btn" id="fortuneBtn">运</button>
    <div class="tap-hint" id="tap-hint">点一点锦鲤，看看今日运势</div>
    <div class="merge-entry">
        <button class="merge-btn" id="collectionBtn">图鉴</button>
        <button class="merge-btn" id="mergeBtn">合成</button>
    </div>
    <div class="fortune-overlay" id="fortune-overlay">
        <div class="fortune-card-container">
            <div class="fortune-card">
                <img class="fortune-card-bg" id="card-bg" src="" alt="">
                <div class="fortune-chinese" id="fortune-chinese"></div>
                <div class="fortune-english" id="fortune-english"></div>
                <div class="fortune-message" id="fortune-message"></div>
                <div class="fortune-bonus" id="fortune-bonus"></div>
            </div>
            <div class="fortune-buttons">
                <button class="fortune-btn-action btn-close" id="close-btn">收下好运</button>
                <button class="fortune-btn-action btn-share" id="share-btn">分享好友</button>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
</div>
<script>
const ASSETS = {
    koiSwim: 'https://d2oir5eh8rty2e.cloudfront.net/assets/images/koi_fish_swimming_b730338f-16f2-4e10-952c-d49e833035a4.webp',
    koiJump: 'https://d2oir5eh8rty2e.cloudfront.net/assets/images/koi_fish_jumping_36b4bb89-43f5-4a76-ba13-663ced1bafef.webp',
    lotusFlower: 'https://d2oir5eh8rty2e.cloudfront.net/assets/images/lotus_flower_pink_75073361-911b-4247-ab19-8f358c521944.webp',
    lotusPad: 'https://d2oir5eh8rty2e.cloudfront.net/assets/images/lotus_lily_pad_5e224d53-ef38-45f4-8aff-7f1b3af98ce0.webp',
    cardBg: 'https://d2oir5eh8rty2e.cloudfront.net/assets/images/fortune_card_background_3ddfc1b8-7027-4caf-bc4d-5021003097fa.webp',
    splash: 'https://d2oir5eh8rty2e.cloudfront.net/assets/images/water_splash_effect_09fad782-6e63-4c1b-acfd-a9751074f4d2.webp',
    sparkle: 'https://d2oir5eh8rty2e.cloudfront.net/assets/images/golden_sparkle_432d6936-cbaf-4b46-9d1a-012561ac346c.webp',
    splashSnd: 'https://d2oir5eh8rty2e.cloudfront.net/assets/sounds/effect/koi_splash_sound_0dfda165-f703-413a-925d-d8061c8fcc36.mp3',
    fortuneSnd: 'https://d2oir5eh8rty2e.cloudfront.net/assets/sounds/effect/fortune_appear_sound_b5d070a8-8ede-4f07-a0d0-5bae7f1e4647.mp3',
    tapSnd: 'https://d2oir5eh8rty2e.cloudfront.net/assets/sounds/effect/button_tap_sound_056d27df-4ac6-4250-9e46-fa806d3a70a2.mp3'
};

const FORTUNES = [
    { chinese: '大吉', english: 'Great Fortune', message: '今日诸事皆宜，好运如泉涌', bonus: '+30%暴击', bonusVal: 30 },
    { chinese: '中吉', english: 'Good Luck', message: '今日运势上佳，万事顺遂', bonus: '+20%暴击', bonusVal: 20 },
    { chinese: '小吉', english: 'Fair Luck', message: '今日小有福气，步步生莲', bonus: '+10%暴击', bonusVal: 10 },
    { chinese: '平', english: 'Neutral', message: '今日运势平常，稳中求进', bonus: '暴击率不变', bonusVal: 0 },
    { chinese: '小凶', english: 'Slight Misfortune', message: '今日略显波折，静待转机', bonus: '-5%暴击', bonusVal: -5 }
];

function getTodayFortune() {
    const today = new Date().toISOString().split('T')[0];
    const saved = localStorage.getItem('liban_fortune_date');
    if (saved === today && localStorage.getItem('liban_fortune')) return JSON.parse(localStorage.getItem('liban_fortune'));
    const userSeed = parseInt(localStorage.getItem('liban_user_seed') || (Date.now() % 100000));
    localStorage.setItem('liban_user_seed', userSeed.toString());
    const dateNum = parseInt(today.replace(/-/g, ''));
    const hash = ((userSeed * 2654435761) ^ dateNum) >>> 0;
    const roll = hash % 100;
    let idx = roll < 10 ? 0 : roll < 30 ? 1 : roll < 55 ? 2 : roll < 85 ? 3 : 4;
    const fortune = FORTUNES[idx];
    localStorage.setItem('liban_fortune_date', today);
    localStorage.setItem('liban_fortune', JSON.stringify(fortune));
    return fortune;
}

const images = {};
function loadImg(key, url) { return new Promise(r => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => { images[key] = i; r(); }; i.onerror = r; i.src = url; }); }
let audioCtx = null; const audioBufs = {};
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
async function loadAud(key, url) { try { const r = await fetch(url); const b = await r.arrayBuffer(); if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); audioBufs[key] = await audioCtx.decodeAudioData(b); } catch(e){} }
function playSnd(key, vol=0.5) { if (!audioCtx || !audioBufs[key]) return; if (audioCtx.state==='suspended') audioCtx.resume(); const s=audioCtx.createBufferSource(), g=audioCtx.createGain(); s.buffer=audioBufs[key]; g.gain.value=vol; s.connect(g); g.connect(audioCtx.destination); s.start(0); }

const S = { koiX:0, koiY:0, koiAngle:0, swimT:0, koiState:'swimming', jumpP:0, jx:0, jy:0, spA:0, spS:0, ripples:[], sparkles:[], lotus:[], showF:false, fortune:null, audioOn:false };
const canvas = document.getElementById('game-canvas'), ctx = canvas.getContext('2d');
const dpr = window.devicePixelRatio || 1;
let W = 0, H = 0;
function resize() { W = window.innerWidth; H = window.innerHeight; canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
resize(); addEventListener('resize', resize);

function initLotus() {
    S.lotus = [
        { x: 0.10, y: 0.18, t: 'f', s: 0.50 },
        { x: 0.90, y: 0.14, t: 'p', s: 0.55 },
        { x: 0.05, y: 0.45, t: 'p', s: 0.45 },
        { x: 0.93, y: 0.50, t: 'f', s: 0.50 },
        { x: 0.15, y: 0.82, t: 'p', s: 0.40 },
        { x: 0.85, y: 0.84, t: 'f', s: 0.45 }
    ];
}

function drawWater() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#57c5b6'); g.addColorStop(0.5, '#3a9eab'); g.addColorStop(1, '#1a5f7a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const t = S.swimT;
    for (let i = 0; i < 6; i++) {
        const cx = W * (0.15 + 0.7 * ((Math.sin(t * 0.3 + i * 1.7) + 1) / 2));
        const cy = H * (0.1 + 0.75 * ((Math.cos(t * 0.2 + i * 2.3) + 1) / 2));
        const r = 25 + 15 * Math.sin(t * 0.5 + i);
        ctx.globalAlpha = 0.035;
        const g2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        g2.addColorStop(0, '#ffffff'); g2.addColorStop(1, 'transparent');
        ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawRipples(dt) {
    if (Math.random() < 0.015 && S.koiState === 'swimming') {
        S.ripples.push({ x: S.koiX + (Math.random() - .5) * 35, y: S.koiY + (Math.random() - .5) * 20, r: 3, mr: 25 + Math.random() * 18, a: .25 });
    }
    for (let i = S.ripples.length - 1; i >= 0; i--) {
        const p = S.ripples[i]; p.r += dt * 30; p.a = .25 * (1 - p.r / p.mr);
        if (p.r >= p.mr) { S.ripples.splice(i, 1); continue; }
        ctx.beginPath(); ctx.strokeStyle = `rgba(255,255,255,${p.a})`; ctx.lineWidth = 1; ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke();
    }
}

function drawSparkles(dt) {
    if (Math.random() < 0.025) {
        S.sparkles.push({ x: Math.random() * W, y: Math.random() * H, sc: .15 + Math.random() * .3, a: 0, ph: 'in', l: 1.5 + Math.random() * 2 });
    }
    for (let i = S.sparkles.length - 1; i >= 0; i--) {
        const p = S.sparkles[i]; p.l -= dt;
        if (p.l <= 0) { S.sparkles.splice(i, 1); continue; }
        if (p.ph === 'in') { p.a += dt * 1.2; if (p.a >= 1) { p.a = 1; p.ph = 'out'; } } else { p.a -= dt * .35; }
        if (images.sparkle) {
            ctx.globalAlpha = Math.max(0, p.a) * 0.5; const sz = 20 * p.sc;
            ctx.drawImage(images.sparkle, p.x - sz / 2, p.y - sz / 2, sz, sz); ctx.globalAlpha = 1;
        }
    }
}

function drawLotus() {
    for (const l of S.lotus) {
        const x = l.x * W, y = l.y * H, img = l.t === 'f' ? images.lotusFlower : images.lotusPad;
        if (img) { const sz = 70 * l.s; ctx.drawImage(img, x - sz / 2, y - sz / 2, sz, sz); }
    }
}

function updateKoi(dt) {
    if (S.koiState === 'swimming') {
        S.swimT += dt * 0.55;
        const cx = W / 2, cy = H * 0.40, rx = W * 0.20, ry = H * 0.07, t = S.swimT;
        const nx = cx + Math.sin(t) * rx, ny = cy + Math.sin(t * 2) * ry;
        const dx = nx - S.koiX, dy = ny - S.koiY;
        if (Math.abs(dx) > .1 || Math.abs(dy) > .1) S.koiAngle = Math.atan2(dy, dx);
        S.koiX = nx; S.koiY = ny;
    } else if (S.koiState === 'jumping') {
        S.jumpP += dt * 1.4; S.spS += dt * 2; S.spA -= dt * 1.5;
        if (S.jumpP >= 1) {
            S.koiState = 'swimming'; S.koiX = S.jx; S.koiY = S.jy;
            for (let i = 0; i < 3; i++) S.ripples.push({ x: S.koiX + (Math.random() - .5) * 35, y: S.koiY + (Math.random() - .5) * 25, r: 3, mr: 35 + Math.random() * 18, a: .35 });
            setTimeout(showFortuneCard, 250);
        }
    }
}

function drawKoi() {
    const img = S.koiState === 'jumping' ? images.koiJump : images.koiSwim; if (!img) return;
    const bs = Math.min(160, W * 0.30), ar = img.width / img.height, w = bs, h = bs / ar;
    let x = S.koiX, y = S.koiY, rot = S.koiAngle, sc = 1;
    if (S.koiState === 'jumping') { const p = S.jumpP; y = S.jy - Math.sin(p * Math.PI) * 100; rot = -Math.PI / 4 + p * Math.PI / 2; sc = 1 + Math.sin(p * Math.PI) * .1; }
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc);
    if (S.koiState === 'swimming' && Math.cos(S.koiAngle) < 0) ctx.scale(1, -1);
    ctx.drawImage(img, -w / 2, -h / 2, w, h); ctx.restore();
}

function drawSplash() {
    if (S.spA <= 0 || !images.splash) return;
    ctx.globalAlpha = Math.max(0, S.spA) * 0.6; const sz = 120 * S.spS;
    ctx.drawImage(images.splash, S.jx - sz / 2, S.jy - sz / 2, sz, sz); ctx.globalAlpha = 1;
}

function isOnKoi(px, py) { const dx = px - S.koiX, dy = py - S.koiY; return Math.sqrt(dx * dx + dy * dy) < 90; }

function triggerJump() {
    if (S.koiState !== 'swimming' || S.showF) return;
    S.koiState = 'jumping'; S.jumpP = 0; S.jx = S.koiX; S.jy = S.koiY; S.spA = 1; S.spS = .5;
    for (let i = 0; i < 4; i++) S.ripples.push({ x: S.koiX + (Math.random() - .5) * 45, y: S.koiY + (Math.random() - .5) * 30, r: 6, mr: 45 + Math.random() * 25, a: .45 });
    playSnd('splash', .6);
}

function showFortuneCard() {
    S.fortune = getTodayFortune(); S.showF = true;
    document.getElementById('fortune-chinese').textContent = S.fortune.chinese;
    document.getElementById('fortune-english').textContent = S.fortune.english;
    document.getElementById('fortune-message').textContent = S.fortune.message;
    document.getElementById('fortune-bonus').textContent = S.fortune.bonus;
    document.getElementById('fortune-overlay').classList.add('visible');
    document.getElementById('tap-hint').style.display = 'none';
    playSnd('fortune', .5);
}
function hideFC() {
    S.showF = false;
    document.getElementById('fortune-overlay').classList.remove('visible');
    document.getElementById('tap-hint').style.display = 'block';
    playSnd('tap', .4);
}
function shareF() {
    const f = S.fortune; if (!f) return;
    const t = `鲤伴 · 今日运势\n\n${f.chinese} - ${f.english}\n"${f.message}"\n\n来抽你的锦鲤运势 →`;
    if (navigator.share) navigator.share({ text: t }).catch(() => cpTxt(t)); else cpTxt(t);
}
function cpTxt(t) { if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => showToast('已复制，分享给好友吧!')); else showToast('请截图分享'); }
function showToast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('visible'); setTimeout(() => t.classList.remove('visible'), 2000); }

canvas.addEventListener('pointerdown', e => { initAudio(); const r = canvas.getBoundingClientRect(); if (!S.showF && isOnKoi(e.clientX - r.left, e.clientY - r.top)) triggerJump(); });
document.getElementById('fortuneBtn').addEventListener('click', showFortuneCard);
document.getElementById('close-btn').addEventListener('click', hideFC);
document.getElementById('share-btn').addEventListener('click', shareF);
document.getElementById('fortune-overlay').addEventListener('click', e => { if (e.target.id === 'fortune-overlay') hideFC(); });
document.getElementById('mergeBtn').addEventListener('click', () => showToast('合成台开发中...'));
document.getElementById('collectionBtn').addEventListener('click', () => showToast('锦鲤图鉴开发中...'));

let lastT = 0;
function loop(ts) { const dt = Math.min((ts - lastT) / 1000, .1); lastT = ts; drawWater(); drawRipples(dt); drawLotus(); drawSparkles(dt); updateKoi(dt); drawSplash(); drawKoi(); requestAnimationFrame(loop); }

async function start() {
    initLotus(); S.koiX = W / 2; S.koiY = H * 0.40;
    await Promise.all([loadImg('koiSwim', ASSETS.koiSwim), loadImg('koiJump', ASSETS.koiJump), loadImg('lotusFlower', ASSETS.lotusFlower), loadImg('lotusPad', ASSETS.lotusPad), loadImg('sparkle', ASSETS.sparkle), loadImg('splash', ASSETS.splash)]);
    document.getElementById('card-bg').src = ASSETS.cardBg;
    loadAud('splash', ASSETS.splashSnd); loadAud('fortune', ASSETS.fortuneSnd); loadAud('tap', ASSETS.tapSnd);
    requestAnimationFrame(loop);
}
start();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/moyu/manifest.json">
<meta name="theme-color" content="#F97316">
<link rel="apple-touch-icon" href="/pwa-icons/moyu-192.png">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta property="og:title" content="摸鱼 · 打工人的小确幸">
<meta property="og:description" content="戳一下，让锦鲤替你翻个运">
<title>摸鱼 · 打工人的小确幸</title>
<link href="https://fonts.font.im/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null;">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#F5F0E8;position:fixed;top:0;left:0;touch-action:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<script>
// ═══════════════════════════════════════════════
// 摸鱼 · 打工人的小确幸
// 手绘Q萌锦鲤 - 零PNG，纯Canvas
// 视觉风格：圆滚滚 + 大眼 + 粉腮 + 慵懒痞气
// ═══════════════════════════════════════════════

var c=document.getElementById('gc');
var sc=c.getContext('2d');
var W,H,dpr;

function resize(){
  dpr=window.devicePixelRatio||1;
  W=window.innerWidth;H=window.innerHeight;
  c.width=W*dpr;c.height=H*dpr;
  sc.setTransform(dpr,0,0,dpr,0,0);
  initLayout();
}

// ── 颜色（暖米+青绿水面，与鲤遇/跃龙门统一色系）──
var CLR={
  bgTop:'#F5F0E8', bgMid:'#EDE6D8', bgBot:'#E0D5C5',
  water1:'rgba(123,196,184,0.18)', water2:'rgba(90,168,156,0.28)', waterDeep:'rgba(61,142,130,0.35)',
  koi:'#FF9A5C', koiLight:'#FFB87D', koiDark:'#E07030', koiBelly:'#FFD4B0',
  fin:'rgba(255,184,125,0.55)',
  blush:'rgba(255,120,120,0.30)',
  eyeWhite:'#FFFEF8', pupil:'#2A1A0A',
  gold:'#FFD700', orange:'#FF9A5C',
  text:'#3A2818', textLight:'#9A8878', white:'#FFFDF8'
};
var FC={'天命':'#FFD700','大吉':'#FF9A5C','中吉':'#7BC4B8','小吉':'#A8D5C8','平':'#C4B89A','小凶':'#C49A8A','凶':'#B87C6A'};

// ── 状态机 ──
var ST={IDLE:0,POKE1:1,POKE2:2,LEAP:3,FORTUNE:4};
var state=ST.IDLE, frame=0;

// ── 锦鲤 ──
var koi={x:0,y:0,baseY:0,w:0,h:0,breathPhase:0,
  eyeRoll:0,flipAngle:0,leapY:0,leapProgress:0,eyelidDroop:0.45};

// ── 交互 ──
var pokeCount=0, lastPokeTime=0, POKE_TIMEOUT=2000;

// ── 粒子 ──
var waterY=0, zzBubbles=[], ripples=[], floaters=[], splashP=[];
var fortuneShow=0, currentFortune=null, currentText='';

function initLayout(){
  var sz=Math.min(W,H);
  koi.w=sz*0.42; koi.h=koi.w*0.55;
  koi.x=W/2;
  waterY=H*0.44;
  koi.baseY=waterY+koi.h*0.25;
  koi.y=koi.baseY;
  floaters=[];
  for(var i=0;i<8;i++) floaters.push({x:Math.random()*W,y:waterY+Math.random()*(H-waterY),r:2+Math.random()*3,speed:0.12+Math.random()*0.25,phase:Math.random()*6.28});
}

// ── 缘分派 ──
function getUserSeed(){var s=localStorage.getItem('moyu_seed');if(!s){s=''+Date.now()+Math.random();localStorage.setItem('moyu_seed',s);}return s;}
function hashStr(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return h;}
function todayFortune(){var d=new Date(),k=getUserSeed()+'-'+d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(),r=Math.abs(hashStr(k))%1000;if(r<30)return'天命';if(r<100)return'大吉';if(r<280)return'中吉';if(r<500)return'小吉';if(r<700)return'平';if(r<880)return'小凶';return'凶';}
var FT={
  '大吉':['今日宜摸鱼，老板不在，天助你也','下午会有好事发生，先摸为敬','今天的你，连摸鱼都是天选','有贵人在帮你，你只管躺','锦鲤说：今天运气全给你了'],
  '中吉':['下午3点会有一杯咖啡主动走向你','今日适合假装很忙，实际效率翻倍','中午的饭不会难吃，信我','有个好消息正在路上，快递那种','今天开会不会被点名，放心坐后排'],
  '小吉':['今天的饭不会难吃','摸鱼不会被发现的概率很高','下班前能搞定手头的事','下午比上午顺，撑住','今天水逆绕着你走'],
  '平':['今日平平，但至少没开会','运气一般，但也没坏事','普通的一天，安稳就是福','不咸不淡，正好摸鱼','锦鲤翻了个身又睡过去了'],
  '小凶':['有人要找你开会，假装没看见','今天不宜做任何重要决定','外卖可能迟到，提前点','少说话多喝水，保平安','锦鲤说：今天低调点'],
  '凶':['今天不宜加班，宜早退','运势低迷，但摸鱼无罪','可能有锅飞来，注意闪避','锦鲤都替你发愁，但它也无能为力','今天适合装病，真的'],
  '天命':['命运说：这条鱼专门为你跃的','天命所归，今天的锦鲤只属于你','万年一遇的天命签，赶紧许愿','今天你被选中了，做什么都顺利','锦鲤化龙了——它说等你很久了']
};
function getFortuneText(lv){var a=FT[lv]||FT['平'],d=new Date();return a[Math.abs(hashStr(getUserSeed()+d.getDate()))%a.length];}

// ── 触摸 ──
function handlePoke(x,y){
  if(state===ST.FORTUNE){
    if(fortuneShow>=1){var cW=Math.min(W*0.82,320),cH=cW*1.15,cY=(H-cH)/2,bW=cW*0.35,bH=36,bX=W/2-bW/2,bY=cY+cH*0.72;if(x>=bX&&x<=bX+bW&&y>=bY&&y<=bY+bH){generateShareCard();return;}}
    resetToIdle();return;
  }
  var dx=x-koi.x,dy=y-(koi.y+koi.leapY);
  if(Math.abs(dx)<koi.w*0.5&&Math.abs(dy)<koi.h*0.7){
    var now=Date.now();if(now-lastPokeTime>POKE_TIMEOUT)pokeCount=0;lastPokeTime=now;pokeCount++;
    try{navigator.vibrate&&navigator.vibrate(25);}catch(e){}
    ripples.push({x:koi.x,y:koi.y,r:5,alpha:0.6});
    if(pokeCount===1){state=ST.POKE1;koi.eyeRoll=1;}
    else if(pokeCount===2){state=ST.POKE2;koi.flipAngle=1;}
    else{state=ST.LEAP;koi.leapProgress=0;currentFortune=todayFortune();currentText=getFortuneText(currentFortune);
      if(currentFortune==='天命')setTimeout(function(){try{navigator.vibrate([50,50,50]);}catch(e){}},800);
      else setTimeout(function(){try{navigator.vibrate(30);}catch(e){}},800);
      for(var i=0;i<12;i++){var a=-2.5+Math.random()*1.8;splashP.push({x:koi.x+Math.cos(a)*10,y:waterY,vx:Math.cos(a)*(2+Math.random()*3),vy:-3-Math.random()*4,r:2+Math.random()*3,life:40+Math.random()*20});}
    }
  }else if(y>waterY-10){ripples.push({x:x,y:y,r:5,alpha:0.5});}
}
c.addEventListener('touchstart',function(e){e.preventDefault();handlePoke(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
c.addEventListener('mousedown',function(e){handlePoke(e.clientX,e.clientY);});
function resetToIdle(){state=ST.IDLE;pokeCount=0;koi.eyeRoll=0;koi.flipAngle=0;koi.leapY=0;koi.leapProgress=0;fortuneShow=0;currentFortune=null;currentText='';}

// ── 更新 ──
function update(){
  frame++;koi.breathPhase+=0.03;
  if(state===ST.IDLE&&frame%40===0)zzBubbles.push({x:koi.x+koi.w*0.32,y:koi.y-koi.h*0.35,size:12+Math.random()*8,opacity:0.5,speed:0.4+Math.random()*0.3});
  for(var i=zzBubbles.length-1;i>=0;i--){var b=zzBubbles[i];b.y-=b.speed;b.x+=Math.sin(frame*0.04+i)*0.4;b.opacity-=0.006;b.size+=0.03;if(b.opacity<=0)zzBubbles.splice(i,1);}
  if(state===ST.POKE2){koi.flipAngle=Math.max(0,koi.flipAngle-0.015);if(koi.flipAngle<=0&&pokeCount<3)state=ST.IDLE;}
  if(state===ST.LEAP){koi.leapProgress+=0.018;if(koi.leapProgress>=1)koi.leapProgress=1;koi.leapY=-Math.sin(koi.leapProgress*Math.PI)*H*0.35;if(koi.leapProgress>=1&&state===ST.LEAP){state=ST.FORTUNE;fortuneShow=0;}}
  if(state===ST.FORTUNE)fortuneShow=Math.min(1,fortuneShow+0.018);
  if(state===ST.IDLE){koi.y=koi.baseY+Math.sin(koi.breathPhase)*3;koi.eyelidDroop=0.45+Math.sin(koi.breathPhase*0.5)*0.12;if(koi.eyeRoll>0)koi.eyeRoll=Math.max(0,koi.eyeRoll-0.02);}
  for(var i=ripples.length-1;i>=0;i--){ripples[i].r+=1.5;ripples[i].alpha-=0.012;if(ripples[i].alpha<=0)ripples.splice(i,1);}
  for(var i=splashP.length-1;i>=0;i--){var p=splashP[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--;if(p.life<=0||p.y>waterY+10)splashP.splice(i,1);}
  for(var i=0;i<floaters.length;i++){var f=floaters[i];f.y-=f.speed;f.x+=Math.sin(frame*0.01+f.phase)*0.3;if(f.y<waterY-20){f.y=H+10;f.x=Math.random()*W;}}
}

// ═══════════════════════════════════════════════
// 绘制
// ═══════════════════════════════════════════════
function draw(){sc.clearRect(0,0,W,H);drawBg();drawWater();drawFloaters();drawRipples();drawSplash();drawKoi();drawZZ();drawTitle();drawHint();if(state===ST.FORTUNE)drawFortune();}

function drawBg(){var g=sc.createLinearGradient(0,0,0,H);g.addColorStop(0,CLR.bgTop);g.addColorStop(0.4,CLR.bgMid);g.addColorStop(1,CLR.bgBot);sc.fillStyle=g;sc.fillRect(0,0,W,H);}
function drawWater(){
  var g=sc.createLinearGradient(0,waterY-10,0,H);g.addColorStop(0,CLR.water1);g.addColorStop(0.3,CLR.water2);g.addColorStop(1,CLR.waterDeep);sc.fillStyle=g;sc.fillRect(0,waterY-5,W,H-waterY+5);
  for(var i=0;i<3;i++){sc.beginPath();var by=waterY+i*8;sc.moveTo(0,by);for(var x=0;x<=W;x+=20)sc.lineTo(x,by+Math.sin(x*0.02+frame*0.03+i*1.5)*3);sc.strokeStyle='rgba(123,196,184,'+(0.25-i*0.06)+')';sc.lineWidth=1.5;sc.stroke();}
}
function drawFloaters(){for(var i=0;i<floaters.length;i++){var f=floaters[i];sc.beginPath();sc.arc(f.x,f.y,f.r,0,6.28);sc.fillStyle='rgba(180,220,210,0.25)';sc.fill();}}
function drawRipples(){for(var i=0;i<ripples.length;i++){var r=ripples[i];sc.beginPath();sc.arc(r.x,r.y,r.r,0,6.28);sc.strokeStyle='rgba(123,196,184,'+r.alpha+')';sc.lineWidth=1.5;sc.stroke();}}
function drawSplash(){for(var i=0;i<splashP.length;i++){var p=splashP[i];sc.beginPath();sc.arc(p.x,p.y,p.r,0,6.28);sc.fillStyle='rgba(180,220,210,'+(p.life/60*0.5)+')';sc.fill();}}

// ═══════════════════════════════════════════════
// ★ 手绘Q萌锦鲤 - 圆身子、大眼睛、粉腮红、痞气表情
// ═══════════════════════════════════════════════
function drawKoi(){
  sc.save();
  sc.translate(koi.x,koi.y+koi.leapY);
  if(koi.flipAngle>0)sc.rotate(Math.sin(koi.flipAngle*Math.PI*0.5)*0.3);
  if(state===ST.LEAP){sc.rotate(-koi.leapProgress*0.4);sc.shadowColor='rgba(255,180,100,0.3)';sc.shadowBlur=20;}
  if(state===ST.FORTUNE){sc.globalAlpha=Math.max(0,1-fortuneShow*2.5);sc.shadowColor='rgba(255,180,100,0.2)';sc.shadowBlur=15;}

  var w=koi.w, h=koi.h, t=frame*0.03;

  // 1) 尾巴（先画，在身体后面）
  var tw=Math.sin(t*1.2)*0.12;
  sc.save();sc.rotate(tw);
  sc.beginPath();
  sc.moveTo(-w*0.32,0);
  sc.bezierCurveTo(-w*0.48,-h*0.35,-w*0.58,-h*0.45,-w*0.68,-h*0.22);
  sc.bezierCurveTo(-w*0.58,0,-w*0.58,0,-w*0.68,h*0.22);
  sc.bezierCurveTo(-w*0.58,h*0.45,-w*0.48,h*0.35,-w*0.32,0);
  sc.closePath();
  var tg=sc.createLinearGradient(-w*0.32,0,-w*0.68,0);tg.addColorStop(0,CLR.koi);tg.addColorStop(1,CLR.koiLight);
  sc.fillStyle=tg;sc.fill();
  sc.strokeStyle='rgba(200,100,40,0.15)';sc.lineWidth=1;sc.stroke();
  sc.restore();

  // 2) 身体（圆滚滚，偏胖椭圆）
  sc.beginPath();sc.ellipse(0,0,w*0.38,h*0.46,0,0,6.28);sc.closePath();
  var bg=sc.createRadialGradient(w*0.06,-h*0.08,0,0,0,w*0.38);
  bg.addColorStop(0,CLR.koiLight);bg.addColorStop(0.5,CLR.koi);bg.addColorStop(1,CLR.koiDark);
  sc.fillStyle=bg;sc.fill();
  sc.strokeStyle='rgba(180,80,25,0.18)';sc.lineWidth=1.5;sc.stroke();

  // 3) 浅色肚皮
  sc.beginPath();sc.ellipse(w*0.02,h*0.1,w*0.26,h*0.22,0,0,6.28);
  sc.fillStyle=CLR.koiBelly;sc.globalAlpha=(sc.globalAlpha||1)*0.45;sc.fill();
  sc.globalAlpha=state===ST.FORTUNE?Math.max(0,1-fortuneShow*2.5):1;

  // 4) 鳞片暗示（几个半圆弧线）
  sc.strokeStyle='rgba(255,255,255,0.13)';sc.lineWidth=1;
  var scales=[[-w*0.1,-h*0.12,w*0.08],[w*0.04,-h*0.08,w*0.07],[-w*0.05,h*0.05,w*0.08],[w*0.12,0.02,w*0.06],[-w*0.16,0.02,w*0.06]];
  for(var i=0;i<scales.length;i++){var s=scales[i];sc.beginPath();sc.arc(s[0],s[1],s[2],-0.7,0.7);sc.stroke();}

  // 5) 背鳍
  var fw=Math.sin(t*0.8)*3;
  sc.beginPath();sc.moveTo(-w*0.06,-h*0.43);sc.quadraticCurveTo(w*0.04,-h*0.68+fw,w*0.18,-h*0.40);sc.lineTo(w*0.1,-h*0.38);
  sc.fillStyle=CLR.fin;sc.fill();sc.strokeStyle='rgba(200,100,40,0.12)';sc.lineWidth=1;sc.stroke();

  // 6) 胸鳍
  var pf=Math.sin(t)*4;
  sc.beginPath();sc.moveTo(w*0.08,h*0.22);sc.quadraticCurveTo(w*0.02,h*0.52+pf,-w*0.1,h*0.42+pf);sc.quadraticCurveTo(-w*0.02,h*0.28,w*0.08,h*0.22);
  sc.fillStyle=CLR.fin;sc.fill();sc.strokeStyle='rgba(200,100,40,0.1)';sc.lineWidth=1;sc.stroke();

  // 7) 腮红
  sc.beginPath();sc.ellipse(w*0.18,h*0.12,w*0.09,h*0.06,0.1,0,6.28);sc.fillStyle=CLR.blush;sc.fill();

  // 8) 眼睛（灵魂所在！大眼+白眼+半闭，全在这里）
  drawKoiEyes(w,h);

  // 9) 嘴巴
  drawKoiMouth(w,h);

  sc.shadowBlur=0;
  sc.restore();
}

function drawKoiEyes(w,h){
  var ex=w*0.17, ey=-h*0.06, er=Math.max(2,w*0.072); // 大眼睛！

  // ── 白眼（POKE1：翻白眼，不满）──
  if(koi.eyeRoll>0){
    // 大眼白
    sc.beginPath();sc.arc(ex,ey,er*1.08,0,6.28);sc.fillStyle=CLR.eyeWhite;sc.fill();sc.strokeStyle='rgba(60,35,15,0.35)';sc.lineWidth=1.5;sc.stroke();
    // 瞳孔上翻
    sc.beginPath();sc.arc(ex,ey-er*0.35*koi.eyeRoll,er*0.32,0,6.28);sc.fillStyle=CLR.pupil;sc.fill();
    // 高光
    sc.beginPath();sc.arc(ex+er*0.18,ey-er*0.5*koi.eyeRoll,er*0.1,0,6.28);sc.fillStyle='rgba(255,255,255,0.75)';sc.fill();
    // 不满的眉毛线
    sc.beginPath();sc.moveTo(ex-er*1.1,ey-er*0.8);sc.quadraticCurveTo(ex,ey-er*1.3*koi.eyeRoll,ex+er*1.1,ey-er*0.7);
    sc.strokeStyle='rgba(60,35,15,'+koi.eyeRoll*0.4+')';sc.lineWidth=2;sc.stroke();
    return;
  }

  // ── 正常眼睛 ──
  // 眼白
  sc.beginPath();sc.arc(ex,ey,er,0,6.28);sc.fillStyle=CLR.eyeWhite;sc.fill();sc.strokeStyle='rgba(60,35,15,0.3)';sc.lineWidth=1.5;sc.stroke();
  // 瞳孔
  sc.beginPath();sc.arc(ex+er*0.05,ey+er*0.05,er*0.45,0,6.28);sc.fillStyle=CLR.pupil;sc.fill();
  // 大高光
  sc.beginPath();sc.arc(ex+er*0.22,ey-er*0.2,er*0.17,0,6.28);sc.fillStyle='rgba(255,255,255,0.85)';sc.fill();
  // 小高光
  sc.beginPath();sc.arc(ex-er*0.12,ey+er*0.18,er*0.07,0,6.28);sc.fillStyle='rgba(255,255,255,0.5)';sc.fill();

  // ── 半闭眼皮（慵懒）──
  var droop=koi.eyelidDroop||0.45;
  if(state===ST.POKE1)droop=0;
  sc.beginPath();
  sc.moveTo(ex-er*1.15,ey-er*0.15);
  sc.quadraticCurveTo(ex,ey-er*droop*2.8,ex+er*1.15,ey-er*0.15);
  sc.lineTo(ex+er*1.15,ey-er*1.3);sc.lineTo(ex-er*1.15,ey-er*1.3);sc.closePath();
  sc.fillStyle=CLR.koi;sc.fill();
}

function drawKoiMouth(w,h){
  var mx=w*0.3, my=h*0.05;
  if(state===ST.POKE1||state===ST.POKE2){
    // 不满嘟嘴
    sc.beginPath();sc.ellipse(mx,my,w*0.04,h*0.03,0.15,0,6.28);sc.fillStyle='rgba(200,80,40,0.3)';sc.fill();
  }else{
    // 慵懒微张
    sc.beginPath();sc.ellipse(mx,my,w*0.025,h*0.015,0,0,6.28);sc.fillStyle='rgba(180,90,30,0.25)';sc.fill();
  }
}

function drawZZ(){
  if(state!==ST.IDLE)return;
  sc.save();sc.font='bold 16px "ZCOOL KuaiLe",sans-serif';
  for(var i=0;i<zzBubbles.length;i++){var b=zzBubbles[i];sc.globalAlpha=b.opacity*0.35;sc.fillStyle=CLR.textLight;sc.fillText('z',b.x,b.y);}
  sc.restore();
}

function drawTitle(){
  sc.save();
  var a=state===ST.FORTUNE?Math.max(0,1-fortuneShow*3):0.65;sc.globalAlpha=a;
  sc.font='600 30px "ZCOOL KuaiLe","PingFang SC",sans-serif';sc.fillStyle=CLR.text;sc.textAlign='center';
  sc.fillText('摸 鱼',W/2,H*0.09+18);
  sc.font='13px "ZCOOL KuaiLe","PingFang SC",sans-serif';sc.fillStyle=CLR.textLight;sc.globalAlpha=a*0.55;
  sc.fillText('打工人的小确幸',W/2,H*0.09+40);
  sc.restore();
}

function drawHint(){
  if(state===ST.IDLE&&pokeCount===0){sc.save();sc.globalAlpha=0.3+0.25*Math.sin(frame*0.04);sc.font='15px "ZCOOL KuaiLe","PingFang SC",sans-serif';sc.fillStyle=CLR.textLight;sc.textAlign='center';sc.fillText('戳戳锦鲤',W/2,H*0.78);sc.restore();}
  if(state===ST.POKE1||(state===ST.IDLE&&pokeCount===1)){sc.save();sc.globalAlpha=0.3+0.2*Math.sin(frame*0.05);sc.font='14px "ZCOOL KuaiLe","PingFang SC",sans-serif';sc.fillStyle=CLR.textLight;sc.textAlign='center';sc.fillText('再戳？',W/2,H*0.78);sc.restore();}
  if(state===ST.POKE2||(state===ST.IDLE&&pokeCount===2)){sc.save();sc.globalAlpha=0.4+0.2*Math.sin(frame*0.06);sc.font='14px "ZCOOL KuaiLe","PingFang SC",sans-serif';sc.fillStyle=CLR.orange;sc.textAlign='center';sc.fillText('再来一下！',W/2,H*0.78);sc.restore();}
}

function drawFortune(){
  sc.save();var cx=W/2,cy=H*0.44,cardW=Math.min(W*0.82,320),cardH=cardW*1.15;
  var isTM=currentFortune==='天命';
  if(isTM&&fortuneShow>0.1){sc.fillStyle='rgba(255,215,0,'+(0.25+Math.sin(frame*0.06)*0.12)+')';sc.beginPath();sc.arc(cx,cy,cardW*0.7,0,6.28);sc.fill();}
  sc.globalAlpha=Math.min(1,fortuneShow*1.8);
  sc.shadowColor='rgba(0,0,0,0.1)';sc.shadowBlur=20;sc.shadowOffsetY=6;sc.fillStyle=CLR.white;
  rrect(cx-cardW/2,cy-cardH/2,cardW,cardH,18);sc.fill();sc.shadowBlur=0;sc.shadowOffsetY=0;
  sc.strokeStyle=FC[currentFortune]||CLR.textLight;sc.lineWidth=isTM?3:2;rrect(cx-cardW/2,cy-cardH/2,cardW,cardH,18);sc.stroke();
  sc.globalAlpha=Math.max(0,(fortuneShow-0.2)/0.6);
  sc.font='bold 44px "ZCOOL KuaiLe","PingFang SC",sans-serif';sc.fillStyle=FC[currentFortune]||CLR.text;sc.textAlign='center';sc.textBaseline='middle';
  sc.fillText(currentFortune,cx,cy-cardH*0.2);
  var ma=Math.max(0,(fortuneShow-0.5)/0.5);
  if(ma>0){sc.globalAlpha=ma;sc.font='16px "ZCOOL KuaiLe","PingFang SC",sans-serif';sc.fillStyle=CLR.text;wrapText(currentText,cx,cy+cardH*0.06,cardW*0.75,24);}
  var ba=Math.max(0,(fortuneShow-0.7)/0.3);
  if(ba>0){sc.globalAlpha=ba*0.35;sc.font='11px "ZCOOL KuaiLe","PingFang SC",sans-serif';sc.fillStyle=CLR.textLight;sc.fillText('摸鱼 · 打工人的小确幸',cx,cy+cardH*0.35);}
  if(fortuneShow>=0.9){var bw=cardW*0.35,bh=36,bx=cx-bw/2,by=cy+cardH*0.72-bh/2;sc.globalAlpha=0.85;sc.fillStyle=FC[currentFortune]||CLR.orange;rrect(bx,by,bw,bh,bh/2);sc.fill();sc.globalAlpha=1;sc.font='bold 14px "ZCOOL KuaiLe","PingFang SC",sans-serif';sc.fillStyle='#fff';sc.textBaseline='middle';sc.fillText('分享',cx,by+bh/2+1);}
  if(fortuneShow>=1){sc.globalAlpha=0.4+0.15*Math.sin(frame*0.05);sc.font='13px "ZCOOL KuaiLe","PingFang SC",sans-serif';sc.fillStyle=CLR.textLight;sc.textBaseline='alphabetic';sc.fillText('再戳锦鲤 →',cx,cy+cardH*0.55);}
  sc.restore();
}
function wrapText(t,x,y,mw,lh){var ws=t.split(''),ln='',ty=y;for(var i=0;i<ws.length;i++){var tl=ln+ws[i];if(sc.measureText(tl).width>mw&&ln.length>0){sc.fillText(ln,x,ty);ln=ws[i];ty+=lh;}else ln=tl;}sc.fillText(ln,x,ty);}
function rrect(x,y,w,h,r){r=Math.min(r,w/2,h/2);sc.beginPath();sc.moveTo(x+r,y);sc.lineTo(x+w-r,y);sc.quadraticCurveTo(x+w,y,x+w,y+r);sc.lineTo(x+w,y+h-r);sc.quadraticCurveTo(x+w,y+h,x+w-r,y+h);sc.lineTo(x+r,y+h);sc.quadraticCurveTo(x,y+h,x,y+h-r);sc.lineTo(x,y+r);sc.quadraticCurveTo(x,y,x+r,y);sc.closePath();}

// ── 分享卡 ──
function generateShareCard(){
  var cv=document.createElement('canvas'),ctx=cv.getContext('2d');cv.width=1200;cv.height=630;
  var isTM=currentFortune==='天命',fc=FC[currentFortune]||CLR.textLight;
  if(isTM){var g=ctx.createLinearGradient(0,0,1200,630);g.addColorStop(0,'#FFD700');g.addColorStop(0.5,'#FFF8DC');g.addColorStop(1,'#FFD700');ctx.fillStyle=g;}
  else ctx.fillStyle=fc;
  ctx.fillRect(0,0,1200,630);
  ctx.globalAlpha=0.1;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(900,150,200,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(200,500,150,0,6.28);ctx.fill();ctx.globalAlpha=1;
  ctx.font='bold 160px "ZCOOL KuaiLe",sans-serif';ctx.fillStyle=isTM?'#8B6E4E':'rgba(255,255,255,0.95)';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,0.15)';ctx.shadowBlur=10;ctx.fillText(currentFortune,600,210);
  ctx.font='48px "ZCOOL KuaiLe",sans-serif';ctx.fillStyle=isTM?'#8B6E4E':'rgba(255,255,255,0.9)';ctx.shadowBlur=5;var txt=currentText,mw=960,ln='',ls=[];for(var i=0;i<txt.length;i++){var tl=ln+txt[i];if(ctx.measureText(tl).width>mw&&ln.length>0){ls.push(ln);ln=txt[i];}else ln=tl;}ls.push(ln);var sy=380-(ls.length-1)*35;for(var i=0;i<ls.length;i++)ctx.fillText(ls[i],600,sy+i*65);
  ctx.font='26px "ZCOOL KuaiLe",sans-serif';ctx.fillStyle=isTM?'rgba(139,110,78,0.6)':'rgba(255,255,255,0.6)';ctx.shadowBlur=0;ctx.fillText('摸鱼 · 打工人的小确幸',600,540);
  var du=cv.toDataURL('image/png'),lk=document.createElement('a');lk.download='摸鱼运势-'+new Date().toLocaleDateString('zh-CN')+'.png';lk.href=du;lk.click();
}

// ── 启动 ──
resize();window.addEventListener('resize',resize);
function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>

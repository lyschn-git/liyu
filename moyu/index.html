<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/moyu/manifest.json">
<meta name="theme-color" content="#F97316">
<link rel="apple-touch-icon" href="/pwa-icons/moyu-192.png">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta property="og:title" content="摸鱼 · 打工人的小确幸">
<meta property="og:description" content="戳一下，让锦鲤替你翻个运">
<title>摸鱼 · 打工人的小确幸</title>
<link href="https://fonts.font.im/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null;">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#F5F0E8;position:fixed;top:0;left:0;touch-action:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<script>
// ═══════════════════════════════════════════════════════
// 摸鱼 v7 — 鱼是灵魂
// 贝塞尔曲线鱼形 · 字鱼一体 · 减法留白 · 彩蛋故事
// ═══════════════════════════════════════════════════════

var c=document.getElementById('gc'),sc=c.getContext('2d'),W,H,dpr;
function resize(){
  dpr=window.devicePixelRatio||1;
  W=window.innerWidth;H=window.innerHeight;
  c.width=W*dpr;c.height=H*dpr;
  sc.setTransform(dpr,0,0,dpr,0,0);
  initLayout();
}

// ─── 色彩 ───
var CLR={
  bg:'#F5F0E8',
  koi:'#FF9A5C',koiLight:'#FFB87D',koiDark:'#E07030',koiBelly:'#FFD4B0',
  fin:'rgba(255,184,125,0.4)',
  blush:'rgba(255,120,120,0.22)',
  eyeWhite:'#FFFEF8',pupil:'#2A1A0A',
  orange:'#FF9A5C',
  text:'#3A2818',textLight:'#9A8878',white:'#FFFDF8'
};
var FC={'天命':'#FFD700','大吉':'#FF9A5C','中吉':'#7BC4B8','小吉':'#A8D5C8','平':'#C4B89A','小凶':'#C49A8A','凶':'#B87C6A'};

// ─── 状态 ───
var ST={IDLE:0,POKE1:1,POKE2:2,LEAP:3,FORTUNE:4,STORY:5};
var state=ST.IDLE,frame=0;
var prevState=ST.IDLE,storyShow=0;

var koi={x:0,y:0,baseY:0,w:0,h:0,breathPhase:0,
  flipAngle:0,leapY:0,leapProgress:0,currExpr:'idle'};
var pokeCount=0,lastPokeTime=0;
var POKE_TIMEOUT=5000;
var waterY=0,zzBubbles=[],ripples=[];
var fortuneShow=0,currentFortune=null,currentText='';

// 鱼说话
var fishSayText='',fishSayAlpha=0;
var FISH_SAY={
  poke1:['干嘛','嗯？','别闹','烦','...','你谁啊'],
  poke2:['还戳？','你有完没完','再戳试试','啧','行吧','最后一次啊']
};
function pickSay(g){return FISH_SAY[g][Math.floor(Math.random()*FISH_SAY[g].length)];}

// ─── 布局 ───
function initLayout(){
  var sz=Math.min(W,H);
  // ★ v7: 鱼占画面80%特写
  koi.w=sz*0.75; koi.h=koi.w*0.52;
  koi.x=W/2;
  koi.baseY=H*0.52;
  koi.y=koi.baseY;
  waterY=H*0.56;
}

// ─── 运势 ───
function getUserSeed(){var s=localStorage.getItem('moyu_seed');if(!s){s=''+Date.now()+Math.random();localStorage.setItem('moyu_seed',s);}return s;}
function hashStr(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return h;}
function todayFortune(){var d=new Date(),k=getUserSeed()+'-'+d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(),r=Math.abs(hashStr(k))%1000;if(r<30)return'天命';if(r<100)return'大吉';if(r<280)return'中吉';if(r<500)return'小吉';if(r<700)return'平';if(r<880)return'小凶';return'凶';}

var FT={
  '大吉':['你已经很努力了，今天允许自己偷个懒','有些好事正在路上，不是因为运气，是因为你值得','今天可以松一口气了，真的','锦鲤说：辛苦了，剩下的交给我','你比自己以为的要好，真的'],
  '中吉':['今天不会太糟，也不会太好，但你在','平平淡淡也是一种被保护着的好运气','没什么大事发生，就是最好的事','锦鲤翻了翻身：还行，稳住','不是每个好日子都轰轰烈烈'],
  '小吉':['小的善意也会积少成多','今天的你，值得一个不加班的傍晚','锦鲤说：别急，慢慢来也是一种快','有些运气是小声的，要安静才听得到','你注意到今天的晚风了吗'],
  '平':['今天没有波澜，本身就是一种庇护','不是每一天都要有意义的','锦鲤翻了个身又睡了，它觉得这样就挺好','普通的一天，但你撑过来了','活着就好，真的，活着就好'],
  '小凶':['今天不顺利不是你的错','累了就歇一会儿，没人会怪你','锦鲤说：今天帮你扛了，明天会好一点','有些日子就是用来熬的，熬过去就行','允许自己今天什么都不想干'],
  '凶':['今天的你很辛苦，但明天又是新的','最难的日子，往往也是快要过去的日子','锦鲤也替你发愁，但它不走，它陪你','撑不住就别硬撑，歇一天天不会塌','有些路只能慢慢走，但你不孤单'],
  '天命':['命运说：这条鱼一直在等你','不是你找到了锦鲤，是锦鲤找到了你','万般皆苦，但你被选中了','今天，宇宙站在你这边','锦鲤化龙了——它说，我等你好久了']
};
function getFortuneText(lv){var a=FT[lv]||FT['平'],d=new Date();return a[Math.abs(hashStr(getUserSeed()+d.getDate()))%a.length];}

// ─── 输入 ───
function handlePoke(x,y){
  // 故事overlay：任意点击关闭
  if(state===ST.STORY){
    state=prevState;storyShow=0;return;
  }
  if(state===ST.FORTUNE&&fortuneShow>=1){
    var cardW2=Math.min(W*0.82,320),cardH2=cardW2*1.15;
    var cy2=H*0.44,cx2=W/2;
    // 分享按钮
    var sbW=cardW2*0.33,sbH=34,sbX=cx2-sbW/2,sbY=cy2+cardH2*0.25;
    if(x>=sbX&&x<=sbX+sbW&&y>=sbY&&y<=sbY+sbH){doShare();return;}
    // 故事按钮
    var stY=sbY+sbH+18;
    if(x>=cx2-50&&x<=cx2+50&&y>=stY-12&&y<=stY+12){prevState=ST.FORTUNE;state=ST.STORY;storyShow=0;return;}
    // 卡片其他区域返回
    var cardX=cx2-cardW2/2,cardY=cy2-cardH2/2;
    if(x>=cardX&&x<=cardX+cardW2&&y>=cardY&&y<=cardY+cardH2){resetToIdle();return;}
    return;
  }
  // IDLE状态右下角⋯进入故事
  if(state===ST.IDLE&&x>=W-50&&y>=H-50){prevState=ST.IDLE;state=ST.STORY;storyShow=0;return;}
  if(state===ST.LEAP)return;
  // 戳鱼
  var dx=x-koi.x,dy=y-(koi.y+koi.leapY);
  if(Math.abs(dx)<koi.w*0.55&&Math.abs(dy)<koi.h*0.75){
    var now=Date.now();
    if(now-lastPokeTime>POKE_TIMEOUT)pokeCount=0;
    lastPokeTime=now;pokeCount++;
    try{navigator.vibrate&&navigator.vibrate(25);}catch(e){}
    ripples.push({x:koi.x,y:koi.y,r:5,alpha:0.25});
    if(pokeCount===1){
      state=ST.POKE1;koi.currExpr='bored';
      fishSayText=pickSay('poke1');fishSayAlpha=1;
    }else if(pokeCount===2){
      state=ST.POKE2;koi.currExpr='annoyed';koi.flipAngle=1;
      fishSayText=pickSay('poke2');fishSayAlpha=1;
    }else if(pokeCount>=3){
      state=ST.LEAP;koi.currExpr='tired';koi.leapProgress=0;
      currentFortune=todayFortune();currentText=getFortuneText(currentFortune);fishSayAlpha=0;
      try{setTimeout(function(){navigator.vibrate(currentFortune==='天命'?[50,50,50]:30);},800);}catch(e){}
    }
  }else if(y>waterY-20){ripples.push({x:x,y:y,r:5,alpha:0.18});}
}
c.addEventListener('touchstart',function(e){e.preventDefault();handlePoke(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
c.addEventListener('mousedown',function(e){handlePoke(e.clientX,e.clientY);});

function resetToIdle(){
  state=ST.IDLE;pokeCount=0;koi.flipAngle=0;koi.leapY=0;koi.leapProgress=0;
  koi.y=koi.baseY;fortuneShow=0;currentFortune=null;currentText='';koi.currExpr='idle';
}

// ─── 更新 ───
function update(){
  frame++;koi.breathPhase+=0.02;
  // Zz气泡 — 更稀更慢更禅
  if(state===ST.IDLE&&frame%150===0)
    zzBubbles.push({x:koi.x+koi.w*0.25,y:koi.y-koi.h*0.22,size:7+Math.random()*4,opacity:0.12,speed:0.12+Math.random()*0.08});
  for(var i=zzBubbles.length-1;i>=0;i--){
    var b=zzBubbles[i];b.y-=b.speed;b.x+=Math.sin(frame*0.015+i)*0.15;
    b.opacity-=0.0015;b.size+=0.008;if(b.opacity<=0)zzBubbles.splice(i,1);
  }
  if(fishSayAlpha>0)fishSayAlpha=Math.max(0,fishSayAlpha-0.006);
  // POKE2动画
  if(state===ST.POKE2){koi.flipAngle=Math.max(0,koi.flipAngle-0.012);if(koi.flipAngle<=0)state=ST.IDLE;}
  // 超时重置
  if((state===ST.POKE1||state===ST.POKE2)&&Date.now()-lastPokeTime>POKE_TIMEOUT){resetToIdle();}
  // 跃起
  if(state===ST.LEAP){
    koi.leapProgress+=0.014;if(koi.leapProgress>=1)koi.leapProgress=1;
    koi.leapY=-Math.sin(koi.leapProgress*Math.PI)*H*0.32;
    if(koi.leapProgress>=1&&state===ST.LEAP){state=ST.FORTUNE;fortuneShow=0;}
  }
  if(state===ST.FORTUNE)fortuneShow=Math.min(1,fortuneShow+0.018);
  if(state===ST.STORY)storyShow=Math.min(1,storyShow+0.03);
  // ★ 非跃起状态：鱼强制归位
  if(state!==ST.LEAP){
    koi.leapY=0;
    koi.y=koi.baseY+Math.sin(koi.breathPhase)*2.5;
  }
  // 涟漪 — 更慢更淡
  for(var i=ripples.length-1;i>=0;i--){ripples[i].r+=0.8;ripples[i].alpha-=0.004;if(ripples[i].alpha<=0)ripples.splice(i,1);}
}

// ─── 绘制 ───
function draw(){
  sc.clearRect(0,0,W,H);
  drawBg();drawWater();drawRipples();drawKoi();drawZZ();drawFishSay();drawTitle();
  if(state===ST.FORTUNE)drawFortune();
  if(state===ST.STORY)drawStoryOverlay();
  // 右下角故事入口
  if(state===ST.IDLE){
    sc.save();sc.globalAlpha=0.18+0.06*Math.sin(frame*0.02);
    sc.font='18px "ZCOOL KuaiLe",sans-serif';sc.fillStyle=CLR.textLight;
    sc.textAlign='right';sc.textBaseline='bottom';
    sc.fillText('⋯',W-22,H-22);sc.restore();
  }
}

function drawBg(){sc.fillStyle=CLR.bg;sc.fillRect(0,0,W,H);}

function drawWater(){
  sc.beginPath();sc.moveTo(0,waterY);
  for(var x=0;x<=W;x+=30)sc.lineTo(x,waterY+Math.sin(x*0.012+frame*0.015)*1.5);
  sc.lineTo(W,H);sc.lineTo(0,H);sc.closePath();
  var g=sc.createLinearGradient(0,waterY,0,H);
  g.addColorStop(0,'rgba(123,196,184,0.04)');g.addColorStop(1,'rgba(90,168,156,0.08)');
  sc.fillStyle=g;sc.fill();
}

function drawRipples(){
  for(var i=0;i<ripples.length;i++){
    var r=ripples[i];sc.beginPath();sc.arc(r.x,r.y,r.r,0,6.28);
    sc.strokeStyle='rgba(123,196,184,'+r.alpha+')';sc.lineWidth=0.8;sc.stroke();
  }
}

// ═══════════════════════════════════════════════════════
// ★★★ 锦鲤 — 贝塞尔曲线鱼形（不再是胡萝卜）
// 头圆吻钝身渐收尾柄细 · 两瓣飘逸尾 · 渐变背橙腹白
// ═══════════════════════════════════════════════════════
function drawKoi(){
  sc.save();
  sc.translate(koi.x,koi.y+koi.leapY);
  if(koi.flipAngle>0)sc.rotate(Math.sin(koi.flipAngle*Math.PI*0.5)*0.25);
  if(state===ST.LEAP){sc.rotate(-koi.leapProgress*0.35);sc.shadowColor='rgba(255,180,100,0.2)';sc.shadowBlur=12;}
  if(state===ST.FORTUNE){sc.globalAlpha=Math.max(0,1-fortuneShow*2.5);}
  if(state===ST.STORY){sc.globalAlpha=0.15;}

  var w=koi.w,h=koi.h;
  // hw/hh = 绘制用半宽/半高（鱼身占位范围）
  var hw=w*0.46,hh=h*0.5;
  var t=frame*0.025;

  // ─── 尾巴 — 两瓣飘逸 ───
  var tw=Math.sin(t*1.1)*0.12;
  sc.save();sc.rotate(tw);
  // 上瓣
  sc.beginPath();
  sc.moveTo(-hw*0.78,-hh*0.06);
  sc.bezierCurveTo(-hw*0.92,-hh*0.28,-hw*1.08,-hh*0.55,-hw*1.22,-hh*0.38);
  sc.bezierCurveTo(-hw*1.12,-hh*0.18,-hw*0.96,-hh*0.04,-hw*0.78,-hh*0.06);
  sc.closePath();
  var tg1=sc.createLinearGradient(-hw*0.78,0,-hw*1.22,0);
  tg1.addColorStop(0,CLR.koi);tg1.addColorStop(0.5,CLR.koiLight);tg1.addColorStop(1,'rgba(255,200,160,0.15)');
  sc.fillStyle=tg1;sc.fill();
  // 下瓣
  sc.beginPath();
  sc.moveTo(-hw*0.78,hh*0.06);
  sc.bezierCurveTo(-hw*0.92,hh*0.28,-hw*1.08,hh*0.55,-hw*1.22,hh*0.38);
  sc.bezierCurveTo(-hw*1.12,hh*0.18,-hw*0.96,hh*0.04,-hw*0.78,hh*0.06);
  sc.closePath();
  var tg2=sc.createLinearGradient(-hw*0.78,0,-hw*1.22,0);
  tg2.addColorStop(0,CLR.koi);tg2.addColorStop(0.5,CLR.koiLight);tg2.addColorStop(1,'rgba(255,200,160,0.15)');
  sc.fillStyle=tg2;sc.fill();
  sc.restore();

  // ─── 身体 — 贝塞尔曲线：头圆吻钝身渐收 ───
  sc.beginPath();
  sc.moveTo(hw*0.88,0); // 鼻尖
  // 上轮廓：圆头→背弧→收窄→尾柄
  sc.bezierCurveTo(hw*0.85,-hh*0.55, hw*0.4,-hh*0.95, hw*0.02,-hh*0.9);
  sc.bezierCurveTo(-hw*0.3,-hh*0.82, -hw*0.58,-hh*0.5, -hw*0.78,-hh*0.1);
  // 尾柄上→下
  sc.lineTo(-hw*0.78,hh*0.1);
  // 下轮廓：尾柄→腹圆→下巴→鼻尖
  sc.bezierCurveTo(-hw*0.58,hh*0.5, -hw*0.3,hh*0.82, hw*0.02,hh*0.9);
  sc.bezierCurveTo(hw*0.4,hh*0.95, hw*0.85,hh*0.55, hw*0.88,0);
  sc.closePath();

  // 渐变：背上橙→腹下白
  var bodyG=sc.createLinearGradient(0,-hh,0,hh);
  bodyG.addColorStop(0,CLR.koiDark);
  bodyG.addColorStop(0.3,CLR.koi);
  bodyG.addColorStop(0.55,CLR.koiLight);
  bodyG.addColorStop(0.8,CLR.koiBelly);
  bodyG.addColorStop(1,'#FFF0E0');
  sc.fillStyle=bodyG;sc.fill();

  // ─── 背脊深纹 ───
  sc.beginPath();
  sc.moveTo(hw*0.5,-hh*0.6);
  sc.bezierCurveTo(hw*0.2,-hh*0.82, -hw*0.1,-hh*0.78, -hw*0.4,-hh*0.5);
  sc.strokeStyle='rgba(180,90,30,0.15)';sc.lineWidth=3;sc.stroke();

  // ─── 侧线白斑 ───
  var ga=sc.globalAlpha||1;
  if(state===ST.FORTUNE)ga=Math.max(0,1-fortuneShow*2.5);
  if(state===ST.STORY)ga=0.15;
  // 白斑1
  sc.beginPath();sc.ellipse(hw*0.1,-hh*0.2,hw*0.22,hh*0.18,-0.1,0,6.28);
  var wg1=sc.createRadialGradient(hw*0.1,-hh*0.2,0,hw*0.1,-hh*0.2,hw*0.22);
  wg1.addColorStop(0,'rgba(255,252,245,'+ga*0.4+')');wg1.addColorStop(0.6,'rgba(255,248,235,'+ga*0.12+')');wg1.addColorStop(1,'rgba(255,248,235,0)');
  sc.fillStyle=wg1;sc.fill();
  // 白斑2
  sc.beginPath();sc.ellipse(-hw*0.25,hh*0.05,hw*0.14,hh*0.12,0.15,0,6.28);
  var wg2=sc.createRadialGradient(-hw*0.25,hh*0.05,0,-hw*0.25,hh*0.05,hw*0.14);
  wg2.addColorStop(0,'rgba(255,252,245,'+ga*0.3+')');wg2.addColorStop(1,'rgba(255,248,235,0)');
  sc.fillStyle=wg2;sc.fill();

  // ─── 背鳍 ───
  var fw=Math.sin(t*0.8)*1.5;
  sc.beginPath();
  sc.moveTo(-hw*0.02,-hh*0.82);
  sc.quadraticCurveTo(hw*0.08,-hh*1.1+fw, hw*0.22,-hh*0.78);
  sc.lineTo(hw*0.12,-hh*0.76);
  sc.fillStyle=CLR.fin;sc.fill();

  // ─── 胸鳍 ───
  var pf=Math.sin(t)*2;
  sc.beginPath();
  sc.moveTo(hw*0.12,hh*0.35);
  sc.quadraticCurveTo(hw*0.02,hh*0.65+pf, -hw*0.12,hh*0.55+pf);
  sc.quadraticCurveTo(-hw*0.02,hh*0.4, hw*0.12,hh*0.35);
  sc.fillStyle=CLR.fin;sc.fill();

  // ─── 腮红 ───
  sc.beginPath();sc.ellipse(hw*0.32,hh*0.22,hw*0.07,hh*0.05,0.1,0,6.28);
  sc.fillStyle=CLR.blush;sc.fill();

  // ─── 锦鲤须 ───
  var ww=Math.sin(t*0.7)*0.06;
  sc.lineWidth=1.5;sc.lineCap='round';
  sc.beginPath();sc.moveTo(hw*0.72,hh*0.08);
  sc.quadraticCurveTo(hw*0.82,hh*0.02+ww*hh,hw*0.9,-hh*0.04+ww*hh*1.2);
  sc.strokeStyle='rgba(200,120,60,0.25)';sc.stroke();
  sc.beginPath();sc.moveTo(hw*0.72,hh*0.14);
  sc.quadraticCurveTo(hw*0.82,hh*0.18-ww*hh*0.5,hw*0.88,hh*0.22-ww*hh);
  sc.strokeStyle='rgba(200,120,60,0.2)';sc.stroke();

  // ─── 表情 ───
  drawExpression(hw,hh);

  sc.shadowBlur=0;
  sc.restore();
}

// ═══════════════════════════════════════════════════════
// ★ 4种差异化表情（适配贝塞尔鱼形）
// ═══════════════════════════════════════════════════════
function drawExpression(hw,hh){
  var ex=hw*0.42,ey=-hh*0.1;
  var er=Math.max(5,hw*0.1);
  var expr=koi.currExpr||'idle';
  if(expr==='bored')drawBoredFace(ex,ey,er,hw,hh);
  else if(expr==='annoyed')drawAnnoyedFace(ex,ey,er,hw,hh);
  else if(expr==='tired')drawTiredFace(ex,ey,er,hw,hh);
  else drawIdleFace(ex,ey,er,hw,hh);
}

// 犯困打盹
function drawIdleFace(ex,ey,er,hw,hh){
  var droop=0.55+Math.sin(koi.breathPhase*0.4)*0.1;
  sc.beginPath();sc.moveTo(ex-er*0.9,ey-er*0.1);
  sc.quadraticCurveTo(ex,ey+er*0.4*droop,ex+er*0.9,ey-er*0.1);
  sc.strokeStyle='rgba(60,35,15,0.5)';sc.lineWidth=2.5;sc.lineCap='round';sc.stroke();
  sc.beginPath();sc.moveTo(ex-er*0.5,ey+er*0.05);
  sc.quadraticCurveTo(ex,ey+er*0.15,ex+er*0.5,ey+er*0.05);
  sc.strokeStyle='rgba(60,35,15,0.15)';sc.lineWidth=1;sc.stroke();
  // 嘴：小O吐泡

// ★ 标题 — 手写PNG + 字鱼一体（呼吸微晃）
// ═══════════════════════════════════════════════════════
var titleImg=new Image();titleImg.src='/moyu/moyu-title.png';var titleLoaded=false;
titleImg.onload=function(){
  var tc=document.createElement('canvas');tc.width=titleImg.naturalWidth;tc.height=titleImg.naturalHeight;
  var tctx=tc.getContext('2d');tctx.drawImage(titleImg,0,0);
  var id=tctx.getImageData(0,0,tc.width,tc.height),d=id.data;
  for(var i=0;i<d.length;i+=4){
    if(d[i]>230&&d[i+1]>230&&d[i+2]>230)d[i+3]=0;
    else if(d[i]>200&&d[i+1]>200&&d[i+2]>200)d[i+3]=Math.round((255-d[i])*2);
  }
  tctx.putImageData(id,0,0);
  titleImg.src=tc.toDataURL('image/png');titleLoaded=true;
};

function drawTitle(){
  if(state===ST.FORTUNE&&fortuneShow>0.3)return;
  if(state===ST.STORY)return;
  if(!titleLoaded)return;
  sc.save();
  var a=state===ST.FORTUNE?Math.max(0,1-fortuneShow*3):0.55;
  sc.globalAlpha=a;
  // ★ 字鱼一体：标题跟随鱼的呼吸微晃
  var breathRot=Math.sin(koi.breathPhase)*0.008;
  var breathY=Math.sin(koi.breathPhase)*1.5;
  var iw=titleImg.naturalWidth||1802,ih=titleImg.naturalHeight||1925;
  var ratio=iw/ih;
  var maxW=W*0.7,maxH=H*0.16;
  var dw,dh;
  if(maxW/maxH>ratio){dh=maxH;dw=dh*ratio;}else{dw=maxW;dh=dw/ratio;}
  var tx=W/2,ty=H*0.16;
  sc.translate(tx,ty+breathY);sc.rotate(breathRot);
  sc.drawImage(titleImg,-dw/2,-dh/2,dw,dh);
  sc.restore();
}

  bg2.addColorStop(0,'#FFB87D');bg2.addColorStop(0.6,'#FF9A5C');bg2.addColorStop(1,'#E07030');
  ctx2.fillStyle=bg2;ctx2.fill();
  ctx2.beginPath();ctx2.ellipse(0,-h*0.15,w*0.2,h*0.14,0,0,6.28);
  var wg2=ctx2.createRadialGradient(0,-h*0.15,0,0,-h*0.15,w*0.2);
  wg2.addColorStop(0,'rgba(255,252,245,0.4)');wg2.addColorStop(1,'rgba(255,248,235,0)');
  ctx2.fillStyle=wg2;ctx2.fill();
  ctx2.beginPath();ctx2.ellipse(w*0.2,h*0.15,w*0.07,h*0.05,0,0,6.28);ctx2.fillStyle='rgba(255,120,120,0.25)';ctx2.fill();
  var er2=Math.max(4,w*0.1),ex2=w*0.15,ey2=-h*0.02;
  var lv2=currentFortune;
  if(lv2==='天命'||lv2==='大吉'){
    ctx2.beginPath();ctx2.moveTo(ex2-er2,ey2+er2*0.2);ctx2.quadraticCurveTo(ex2,ey2-er2*0.6,ex2+er2,ey2+er2*0.2);
    ctx2.strokeStyle='rgba(255,255,255,0.6)';ctx2.lineWidth=2.5;ctx2.lineCap='round';ctx2.stroke();
  }else if(lv2==='小凶'||lv2==='凶'){
    ctx2.beginPath();ctx2.arc(ex2,ey2,er2*0.9,0,6.28);ctx2.fillStyle='#FFFEF8';ctx2.fill();
    ctx2.beginPath();ctx2.arc(ex2+er2*0.05,ey2+er2*0.15,er2*0.3,0,6.28);ctx2.fillStyle='#2A1A0A';ctx2.fill();
    ctx2.beginPath();ctx2.ellipse(ex2+er2*0.7,ey2+er2*0.5,er2*0.1,er2*0.15,0.1,0,6.28);ctx2.fillStyle='rgba(180,220,255,0.4)';ctx2.fill();
  }else{
    ctx2.beginPath();ctx2.moveTo(ex2-er2*0.9,ey2-er2*0.05);ctx2.quadraticCurveTo(ex2,ey2+er2*0.3,ex2+er2*0.9,ey2-er2*0.05);
    ctx2.strokeStyle='rgba(255,255,255,0.5)';ctx2.lineWidth=2.5;ctx2.lineCap='round';ctx2.stroke();
  }
  ctx2.restore();
}

function doShare(){
  var cv=document.createElement('canvas'),ctx=cv.getContext('2d');cv.width=1200;cv.height=630;
  var isTM=currentFortune==='天命',fc=FC[currentFortune]||CLR.textLight;
  if(isTM){var g=ctx.createLinearGradient(0,0,1200,630);g.addColorStop(0,'#FFD700');g.addColorStop(0.5,'#FFF8DC');g.addColorStop(1,'#FFD700');ctx.fillStyle=g;}
  else ctx.fillStyle=fc;
  ctx.fillRect(0,0,1200,630);
  ctx.globalAlpha=0.06;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(900,150,200,0,6.28);ctx.fill();
  ctx.beginPath();ctx.arc(200,500,150,0,6.28);ctx.fill();ctx.globalAlpha=1;
  ctx.font='bold 160px "ZCOOL KuaiLe",sans-serif';ctx.fillStyle=isTM?'#8B6E4E':'rgba(255,255,255,0.95)';
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,0.1)';ctx.shadowBlur=8;
  ctx.fillText(currentFortune,600,180);
  ctx.shadowBlur=0;drawShareFish(ctx,600,300,80,fc);
  ctx.font='44px "ZCOOL KuaiLe",sans-serif';ctx.fillStyle=isTM?'#8B6E4E':'rgba(255,255,255,0.88)';ctx.shadowBlur=4;
  var txt=currentText,mw=960,ln='',ls=[];
  for(var i=0;i<txt.length;i++){var tl=ln+txt[i];if(ctx.measureText(tl).width>mw&&ln.length>0){ls.push(ln);ln=txt[i];}else ln=tl;}
  ls.push(ln);var sy=410-(ls.length-1)*30;for(var i=0;i<ls.length;i++)ctx.fillText(ls[i],600,sy+i*60);
  ctx.font='24px "ZCOOL KuaiLe",sans-serif';ctx.fillStyle=isTM?'rgba(139,110,78,0.55)':'rgba(255,255,255,0.55)';ctx.shadowBlur=0;
  ctx.fillText('摸鱼 · 打工人的小确幸',600,540);
  var dataURL=cv.toDataURL('image/png');
  if(navigator.share&&navigator.canShare){
    try{cv.toBlob(function(blob){if(!blob)return;
      var file=new File([blob],'摸鱼运势.png',{type:'image/png'});
      if(navigator.canShare({files:[file]})){navigator.share({files:[file],title:'摸鱼运势',text:currentText}).catch(function(){});return;}
    },'image/png');}catch(e){}
  }
  var overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;';
  var img=document.createElement('img');img.src=dataURL;img.style.cssText='max-width:85%;max-height:60%;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,0.3);';
  var tip=document.createElement('div');tip.style.cssText='color:rgba(255,255,255,0.8);font-size:14px;margin-top:16px;font-family:"ZCOOL KuaiLe",sans-serif;';tip.textContent='长按图片保存';
  var close=document.createElement('div');close.style.cssText='color:rgba(255,255,255,0.5);font-size:13px;margin-top:12px;cursor:pointer;';close.textContent='点这里关闭';
  close.onclick=function(){document.body.removeChild(overlay);};
  overlay.onclick=function(e){if(e.target===overlay)document.body.removeChild(overlay);};
  overlay.appendChild(img);overlay.appendChild(tip);overlay.appendChild(close);document.body.appendChild(overlay);
}

// ─── 工具 ───
function rrect(x,y,w,h,r){r=Math.min(r,w/2,h/2);sc.beginPath();sc.moveTo(x+r,y);sc.lineTo(x+w-r,y);sc.quadraticCurveTo(x+w,y,x+w,y+r);sc.lineTo(x+w,y+h-r);sc.quadraticCurveTo(x+w,y+h,x+w-r,y+h);sc.lineTo(x+r,y+h);sc.quadraticCurveTo(x,y+h,x,y+h-r);sc.lineTo(x,y+r);sc.quadraticCurveTo(x,y,x+r,y);sc.closePath();}

// ─── 启动 ───
resize();window.addEventListener('resize',resize);
function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>

// ── 布局初始化 ──
function initLayout(){
  var sz=Math.min(W,H);
  koi.w=sz*0.48;
  koi.h=koi.w*0.542;
  koi.x=W/2;
  waterY=H*0.42;
  koi.baseY=waterY+koi.h*0.15;
  koi.y=koi.baseY;
  initFloaters();
}

function initFloaters(){
  floaters=[];
  for(var i=0;i<8;i++){
    floaters.push({
      x:Math.random()*W,
      y:waterY+Math.random()*(H-waterY),
      r:2+Math.random()*3,
      speed:0.12+Math.random()*0.25,
      phase:Math.random()*Math.PI*2
    });
  }
}

initLayout();

// ── 缘分派算法 ──
function getUserSeed(){
  var s=localStorage.getItem('moyu_seed');
  if(!s){s=''+Date.now()+Math.random();localStorage.setItem('moyu_seed',s);}
  return s;
}
function hashStr(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return h;}

function todayFortune(){
  var d=new Date();
  var key=getUserSeed()+'-'+d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  var h=Math.abs(hashStr(key));
  var r=h%1000;
  if(r<30) return '天命';
  if(r<100) return '大吉';
  if(r<280) return '中吉';
  if(r<500) return '小吉';
  if(r<700) return '平';
  if(r<880) return '小凶';
  return '凶';
}

  }

  // 戳锦鲤判定（宽松）
  var dx=x-koi.x,dy=y-(koi.y+koi.leapY);
  var hitW=koi.w*0.8,hitH=koi.h*1.2;
  var onKoi=Math.abs(dx)<hitW/2&&Math.abs(dy)<hitH/2;

  if(!onKoi){
    // 点水面产生涟漪
    if(y>waterY-10) ripples.push({x:x,y:y,r:5,alpha:0.5});
    return;
  }

  var now=Date.now();
  if(now-lastPokeTime>POKE_TIMEOUT) pokeCount=0;
  lastPokeTime=now;
  pokeCount++;

  // 触觉
  try{navigator.vibrate&&navigator.vibrate(25);}catch(e){}

  // 戳鱼涟漪
  ripples.push({x:koi.x,y:koi.y,r:5,alpha:0.6});

  if(pokeCount===1){
    state=STATE.POKE1;
    koi.eyeRoll=1;
  }else if(pokeCount===2){
    state=STATE.POKE2;
    koi.flipAngle=1;
  }else{
    state=STATE.LEAP;
    koi.leapProgress=0;
    currentFortune=todayFortune();
    currentText=getFortuneText(currentFortune);
    // 天命签双震
    if(currentFortune==='天命'){
      setTimeout(function(){try{navigator.vibrate([50,50,50]);}catch(e){}},800);
    }else{
      setTimeout(function(){try{navigator.vibrate(30);}catch(e){}},800);
    }
    // 生成水花
    for(var i=0;i<12;i++){
      var angle=-Math.PI*0.8+Math.random()*Math.PI*0.6;
      splashParticles.push({
        x:koi.x+Math.cos(angle)*10,
        y:waterY,
        vx:Math.cos(angle)*(2+Math.random()*3),
        vy:-3-Math.random()*4,
        r:2+Math.random()*3,
        life:40+Math.random()*20
      });
    }
  }
}

c.addEventListener('touchstart',function(e){
  e.preventDefault();handlePoke(e.touches[0].clientX,e.touches[0].clientY);
},{passive:false});

function resetToIdle(){
  state=STATE.IDLE;
  pokeCount=0;
  fortuneShow=0;
  koi.eyeRoll=0;koi.flipAngle=0;koi.leapY=0;koi.leapProgress=0;
}

// ── 更新 ──
function update(){
  frame++;
  koi.breathPhase+=0.03;

  // 呼噜z泡泡
  if(state===STATE.IDLE&&frame%40===0){
    zzBubbles.push({
      x:koi.x+koi.w*0.32,y:koi.y-koi.h*0.25,
      size:12+Math.random()*8,opacity:0.5,speed:0.4+Math.random()*0.3
    });
  }
  for(var i=zzBubbles.length-1;i>=0;i--){
    var b=zzBubbles[i];
    b.y-=b.speed;b.x+=Math.sin(frame*0.04+i)*0.4;
    b.opacity-=0.006;b.size+=0.03;
    if(b.opacity<=0) zzBubbles.splice(i,1);
  }

  // POKE1：白眼逐渐收回
  if(state===STATE.POKE1){
    // 白眼保持0.7秒后收回
  }

  // POKE2：翻身
  if(state===STATE.POKE2){
    koi.flipAngle=Math.max(0,koi.flipAngle-0.015);
    if(koi.flipAngle<=0&&pokeCount<3) state=STATE.IDLE;
  }

  // 跃起
  if(state===STATE.LEAP){
    koi.leapProgress+=0.018;
    if(koi.leapProgress>=1) koi.leapProgress=1;
    koi.leapY=-Math.sin(koi.leapProgress*Math.PI)*H*0.35;
    if(koi.leapProgress>=1&&state===STATE.LEAP){
      state=STATE.FORTUNE;fortuneShow=0;
    }
  }

  // 签卡显现
  if(state===STATE.FORTUNE){
    fortuneShow=Math.min(1,fortuneShow+0.018);
  }

  // IDLE呼吸
  if(state===STATE.IDLE){
    koi.y=koi.baseY+Math.sin(koi.breathPhase)*3;
    koi.eyelidDroop=0.35+Math.sin(koi.breathPhase*0.5)*0.1;
    // 白眼回收
    if(koi.eyeRoll>0) koi.eyeRoll=Math.max(0,koi.eyeRoll-0.02);
  }

  // 涟漪
  for(var i=ripples.length-1;i>=0;i--){
    ripples[i].r+=1.5;ripples[i].alpha-=0.012;
    if(ripples[i].alpha<=0) ripples.splice(i,1);
  }

  // 水花
  for(var i=splashParticles.length-1;i>=0;i--){
    var p=splashParticles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--;
    if(p.life<=0||p.y>waterY+10) splashParticles.splice(i,1);
  }

  // 装饰泡泡
  for(var i=0;i<floaters.length;i++){
    var f=floaters[i];
    f.y-=f.speed;f.x+=Math.sin(frame*0.01+f.phase)*0.3;
    if(f.y<waterY-20){f.y=H+10;f.x=Math.random()*W;}
  }
}

// ── 绘制 ──
function draw(){
  sc.clearRect(0,0,W,H);
  drawBg();drawWater();drawFloaters();drawRipples();drawSplash();
  drawKoi();drawZZBubbles();drawTitle();drawHint();
  if(state===STATE.FORTUNE) drawFortune();
}

function drawBg(){
  var g=sc.createLinearGradient(0,0,0,H);
  g.addColorStop(0,CLR.bgTop);g.addColorStop(0.4,CLR.bgMid);g.addColorStop(1,CLR.bgBot);
  sc.fillStyle=g;sc.fillRect(0,0,W,H);
}

function drawWater(){
  sc.save();
  var g=sc.createLinearGradient(0,waterY-10,0,H);
  g.addColorStop(0,'rgba(123,196,184,0.08)');
  g.addColorStop(0.3,'rgba(90,168,156,0.12)');
  g.addColorStop(1,'rgba(61,142,130,0.18)');
  sc.fillStyle=g;sc.fillRect(0,waterY-5,W,H-waterY+5);

  // 波纹
  sc.globalAlpha=0.18;sc.strokeStyle=CLR.water1;sc.lineWidth=1;
  var t=frame*0.02;
  for(var i=0;i<3;i++){
    sc.beginPath();var by=waterY+i*8;
    for(var x=0;x<=W;x+=3){
      var yy=by+Math.sin(x*0.015+t+i*1.5)*3;
      x===0?sc.moveTo(x,yy):sc.lineTo(x,yy);
    }
    sc.stroke();
  }

  // 光斑
  sc.globalAlpha=0.06;sc.fillStyle='#FFFFFF';
  for(var i=0;i<4;i++){
    var sx=W*0.2+i*W*0.2+Math.sin(t*0.5+i)*20;
    var sy=waterY+20+i*25+Math.cos(t*0.3+i)*10;
    sc.beginPath();sc.ellipse(sx,sy,15+i*3,4,0,0,Math.PI*2);sc.fill();
  }
  sc.globalAlpha=1;sc.restore();
}

function drawFloaters(){
  sc.save();
  for(var i=0;i<floaters.length;i++){
    var f=floaters[i];
    sc.globalAlpha=0.1;sc.strokeStyle='rgba(123,196,184,0.4)';sc.lineWidth=0.6;
    sc.beginPath();sc.arc(f.x,f.y,f.r,0,Math.PI*2);sc.stroke();
  }
  sc.restore();
}

function drawRipples(){
  sc.save();
  for(var i=0;i<ripples.length;i++){
    var r=ripples[i];
    sc.globalAlpha=r.alpha*0.5;sc.strokeStyle=CLR.water1;sc.lineWidth=1.2;
    sc.beginPath();sc.arc(r.x,r.y,r.r,0,Math.PI*2);sc.stroke();
  }
  sc.restore();
}

function drawSplash(){
  sc.save();
  for(var i=0;i<splashParticles.length;i++){
    var p=splashParticles[i];
    sc.globalAlpha=Math.min(1,p.life/30);
    sc.fillStyle='rgba(123,196,184,0.6)';
    sc.beginPath();sc.arc(p.x,p.y,p.r,0,Math.PI*2);sc.fill();
  }
  sc.restore();
}

function drawKoi(){
  sc.save();
  sc.translate(koi.x,koi.y+koi.leapY);

  // 翻身
  if(koi.flipAngle>0){
    sc.rotate(Math.sin(koi.flipAngle*Math.PI*0.5)*0.25);
  }

  // 跃起旋转
  if(state===STATE.LEAP){
    sc.rotate(-koi.leapProgress*0.4);
    // 光晕
    sc.shadowColor='rgba(255,180,100,0.3)';sc.shadowBlur=20;
  }
  if(state===STATE.FORTUNE){
    // 签卡出来后锦鲤渐隐
    sc.globalAlpha=Math.max(0,1-fortuneShow*2.5);
    sc.shadowColor='rgba(255,180,100,0.2)';sc.shadowBlur=15;
  }

  if(koiLoaded){
    sc.drawImage(koiImg,-koi.w/2,-koi.h/2,koi.w,koi.h);
  }else{
    drawFallbackKoi();
  }
  sc.shadowBlur=0;

  // 眼睛覆层（白眼 + 半闭眼）
  drawEyeOverlay();

  sc.restore();
}

// 手绘兜底锦鲤
function drawFallbackKoi(){
  var sz=Math.min(W,H)*0.12;
  // 身体
  var g=sc.createRadialGradient(-sz*0.5,-sz*0.3,0,0,0,sz*1.5);
  g.addColorStop(0,'#FFB87D');g.addColorStop(0.5,CLR.koi);g.addColorStop(1,CLR.koiDark);
  sc.fillStyle=g;
  sc.beginPath();sc.ellipse(0,0,sz*1.5,sz,0,0,Math.PI*2);sc.fill();
  // 鳞片光泽
  sc.globalAlpha=0.3;
  for(var i=0;i<5;i++){
    sc.beginPath();
    sc.arc(-sz+i*sz*0.5,Math.sin(i*0.8)*sz*0.3,sz*0.18,0,Math.PI*2);
    sc.fillStyle='rgba(255,255,255,0.5)';sc.fill();
  }
  sc.globalAlpha=1;
  // 腮红
  sc.beginPath();sc.ellipse(sz*0.3,sz*0.3,sz*0.2,sz*0.15,0,0,Math.PI*2);
  sc.fillStyle='rgba(255,150,150,0.4)';sc.fill();
  // 尾巴
  sc.beginPath();sc.moveTo(-sz*1.3,0);
  sc.quadraticCurveTo(-sz*2,-sz*0.8,-sz*2.2,-sz*0.3);
  sc.quadraticCurveTo(-sz*1.8,0,-sz*2.2,sz*0.3);
  sc.quadraticCurveTo(-sz*2,sz*0.8,-sz*1.3,0);
  sc.fillStyle=CLR.koi;sc.fill();
  // 背鳍
  sc.beginPath();sc.moveTo(-sz*0.3,-sz*0.8);
  sc.quadraticCurveTo(0,-sz*1.3,sz*0.5,-sz*0.9);
  sc.lineTo(sz*0.3,-sz*0.7);sc.fillStyle=CLR.koiLight;sc.fill();
  // 眼白
  var eyeX=sz*0.8,eyeY=-sz*0.1,eyeR=sz*0.22;
  sc.beginPath();sc.arc(eyeX,eyeY,eyeR,0,Math.PI*2);
  sc.fillStyle='white';sc.fill();sc.strokeStyle='#444';sc.lineWidth=0.8;sc.stroke();
  // 瞳孔
  sc.beginPath();sc.arc(eyeX,eyeY-eyeR*0.1,eyeR*0.45,0,Math.PI*2);
  sc.fillStyle='#333';sc.fill();
  // 高光
  sc.beginPath();sc.arc(eyeX+eyeR*0.2,eyeY-eyeR*0.3,eyeR*0.15,0,Math.PI*2);
  sc.fillStyle='white';sc.fill();
}

// 眼睛覆层：白眼 + 慵懒半闭
function drawEyeOverlay(){
  if(!koiLoaded&&state!==STATE.IDLE&&state!==STATE.POKE1) return;

  // 眼睛位置（基于锦鲤尺寸）
  var eyeX,eyeY,eyeR;
  if(koiLoaded){
    eyeX=koi.w*0.16;eyeY=-koi.h*0.06;eyeR=koi.w*0.055;
  }else{
    var sz=Math.min(W,H)*0.12;
    eyeX=sz*0.8;eyeY=-sz*0.1;eyeR=sz*0.22;
  }

  // 白眼效果（POKE1）
  if(koi.eyeRoll>0){
    sc.save();
    // 眼白上翻
    sc.fillStyle='rgba(255,255,255,'+koi.eyeRoll*0.9+')';
    sc.beginPath();
    sc.ellipse(eyeX,eyeY-eyeR*0.3*koi.eyeRoll,eyeR*1.1,eyeR*0.5*koi.eyeRoll,0,0,Math.PI*2);
    sc.fill();
    // 瞳孔上移
    sc.fillStyle='rgba(40,30,20,'+koi.eyeRoll*0.7+')';
    sc.beginPath();sc.arc(eyeX,eyeY-eyeR*0.6*koi.eyeRoll,eyeR*0.3,0,Math.PI*2);sc.fill();
    sc.restore();
  }

  // 半闭眼皮（IDLE慵懒）
  if(state===STATE.IDLE||state===STATE.POKE1){
    sc.save();
    var droop=koi.eyelidDroop||0.35;
    if(state===STATE.POKE1) droop=0; // 白眼时不闭
    sc.fillStyle=CLR.koi;
    sc.beginPath();
    sc.moveTo(eyeX-eyeR*1.2,eyeY-eyeR*0.3);
    sc.quadraticCurveTo(eyeX,eyeY-eyeR*droop*2,eyeX+eyeR*1.2,eyeY-eyeR*0.3);
    sc.lineTo(eyeX+eyeR*1.2,eyeY-eyeR*1.2);
    sc.lineTo(eyeX-eyeR*1.2,eyeY-eyeR*1.2);
    sc.closePath();sc.fill();
    sc.restore();
  }
}

function drawZZBubbles(){
  if(state!==STATE.IDLE) return;
  sc.save();
  sc.font='bold 16px "ZCOOL KuaiLe",sans-serif';
  for(var i=0;i<zzBubbles.length;i++){
    var b=zzBubbles[i];
    sc.globalAlpha=b.opacity*0.4;
    sc.fillStyle=CLR.textLight;
    sc.fillText('z',b.x,b.y);
  }
  sc.restore();
}

function drawTitle(){
  sc.save();
  var alpha=state===STATE.FORTUNE?Math.max(0,1-fortuneShow*3):0.7;
  sc.globalAlpha=alpha;
  sc.font='600 30px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  sc.fillStyle=CLR.text;sc.textAlign='center';
  sc.fillText('摸 鱼',W/2,H*0.09+18);
  sc.font='13px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  sc.fillStyle=CLR.textLight;sc.globalAlpha=alpha*0.6;
  sc.fillText('打工人的小确幸',W/2,H*0.09+40);

}

function drawHint(){
  if(state===STATE.IDLE&&pokeCount===0){
    var pulse=0.3+0.25*Math.sin(frame*0.04);
    sc.save();sc.globalAlpha=pulse;
    sc.font='15px "ZCOOL KuaiLe","PingFang SC",sans-serif';
    sc.fillStyle=CLR.textLight;sc.textAlign='center';
    sc.fillText('戳戳锦鲤',W/2,H*0.78);
    sc.restore();
  }
  // 第一戳后提示
  if(state===STATE.POKE1||(state===STATE.IDLE&&pokeCount===1)){
    var pulse2=0.3+0.2*Math.sin(frame*0.05);
    sc.save();sc.globalAlpha=pulse2;
    sc.font='14px "ZCOOL KuaiLe","PingFang SC",sans-serif';
    sc.fillStyle=CLR.textLight;sc.textAlign='center';
    sc.fillText('再戳？',W/2,H*0.78);
    sc.restore();
  }
  // 第二戳后提示
  if(state===STATE.POKE2||(state===STATE.IDLE&&pokeCount===2)){
    var pulse3=0.4+0.2*Math.sin(frame*0.06);
    sc.save();sc.globalAlpha=pulse3;
    sc.font='14px "ZCOOL KuaiLe","PingFang SC",sans-serif';
    sc.fillStyle=CLR.orange;sc.textAlign='center';
    sc.fillText('再来一下！',W/2,H*0.78);
    sc.restore();
  }
}

function drawFortune(){
  sc.save();
  var cx=W/2,cy=H*0.44;
  var cardW=Math.min(W*0.82,320);
  var cardH=cardW*1.15;

  // 天命签金光
  var isTianming=currentFortune==='天命';
  if(isTianming&&fortuneShow>0.1){
    var glow=0.25+Math.sin(frame*0.06)*0.12;
    sc.fillStyle='rgba(255,215,0,'+glow+')';
    sc.beginPath();sc.arc(cx,cy,cardW*0.7,0,Math.PI*2);sc.fill();
  }

  var fadeIn=Math.min(1,fortuneShow*1.8);
  sc.globalAlpha=fadeIn;

  // 签卡
  sc.shadowColor='rgba(0,0,0,0.1)';sc.shadowBlur=20;sc.shadowOffsetY=6;
  sc.fillStyle=CLR.white;
  rrect(cx-cardW/2,cy-cardH/2,cardW,cardH,18);sc.fill();
  sc.shadowBlur=0;sc.shadowOffsetY=0;

  // 边框
  sc.strokeStyle=FORTUNE_COLORS[currentFortune]||CLR.textLight;
  sc.lineWidth=isTianming?3:2;
  rrect(cx-cardW/2,cy-cardH/2,cardW,cardH,18);sc.stroke();

  // 顶部装饰线
  var decoAlpha=Math.max(0,(fortuneShow-0.15)/0.5);
  sc.globalAlpha=decoAlpha*0.2;
  sc.strokeStyle=FORTUNE_COLORS[currentFortune]||CLR.textLight;
  sc.lineWidth=1;
  sc.beginPath();
  sc.moveTo(cx-cardW*0.3,cy-cardH*0.38);
  sc.lineTo(cx+cardW*0.3,cy-cardH*0.38);
  sc.stroke();

  // 运势级别
  var textAlpha=Math.max(0,(fortuneShow-0.2)/0.6);
  sc.globalAlpha=textAlpha;
  sc.font='bold 44px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  sc.fillStyle=FORTUNE_COLORS[currentFortune]||CLR.text;
  sc.textAlign='center';sc.textBaseline='middle';
  sc.fillText(currentFortune,cx,cy-cardH*0.2);

  // 签文
  var msgAlpha=Math.max(0,(fortuneShow-0.5)/0.5);
  if(msgAlpha>0){
    sc.globalAlpha=msgAlpha;
    sc.font='16px "ZCOOL KuaiLe","PingFang SC",sans-serif';
    sc.fillStyle=CLR.text;
    wrapText(currentText,cx,cy+cardH*0.06,cardW*0.75,24);
  }

  // 品牌
  var brandAlpha=Math.max(0,(fortuneShow-0.7)/0.3);
  if(brandAlpha>0){
    sc.globalAlpha=brandAlpha*0.35;
    sc.font='11px "ZCOOL KuaiLe","PingFang SC",sans-serif';
    sc.fillStyle=CLR.textLight;
    sc.fillText('摸鱼 · 打工人的小确幸',cx,cy+cardH*0.35);
  }

  // 分享按钮
  if(fortuneShow>=0.9){
    var btnW=cardW*0.35,btnH=36;
    var btnX=cx-btnW/2,btnY=cy+cardH*0.72-btnH/2;
    sc.globalAlpha=0.85;
    sc.fillStyle=FORTUNE_COLORS[currentFortune]||CLR.orange;
    rrect(btnX,btnY,btnW,btnH,btnH/2);sc.fill();
    sc.globalAlpha=1;
    sc.font='bold 14px "ZCOOL KuaiLe","PingFang SC",sans-serif';
    sc.fillStyle='#fff';sc.textBaseline='middle';
    sc.fillText('分享',cx,btnY+btnH/2+1);
  }

  // 再来
  if(fortuneShow>=1){
    sc.globalAlpha=0.4+0.15*Math.sin(frame*0.05);
    sc.font='13px "ZCOOL KuaiLe","PingFang SC",sans-serif';
    sc.fillStyle=CLR.textLight;sc.textBaseline='alphabetic';
    sc.fillText('再戳锦鲤 →',cx,cy+cardH*0.55);
  }

  sc.restore();
}

function wrapText(text,x,y,maxW,lineH){
  var words=text.split('');var line='';var ty=y;
  for(var i=0;i<words.length;i++){
    var testLine=line+words[i];
    if(sc.measureText(testLine).width>maxW&&line.length>0){
      sc.fillText(line,x,ty);line=words[i];ty+=lineH;
    }else{line=testLine;}
  }
  sc.fillText(line,x,ty);
}

function rrect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  sc.beginPath();
  sc.moveTo(x+r,y);sc.lineTo(x+w-r,y);
  sc.quadraticCurveTo(x+w,y,x+w,y+r);
  sc.lineTo(x+w,y+h-r);
  sc.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  sc.lineTo(x+r,y+h);
  sc.quadraticCurveTo(x,y+h,x,y+h-r);
  sc.lineTo(x,y+r);
  sc.quadraticCurveTo(x,y,x+r,y);
  sc.closePath();
}

// ── 分享卡 ──
function generateShareCard(){
  var sCanvas=document.createElement('canvas');
  var sCtx=sCanvas.getContext('2d');
  sCanvas.width=1200;sCanvas.height=630;

  var isTianming=currentFortune==='天命';
  var fc=FORTUNE_COLORS[currentFortune]||CLR.textLight;

  // 背景
  if(isTianming){
    var g=sCtx.createLinearGradient(0,0,1200,630);
    g.addColorStop(0,'#FFD700');g.addColorStop(0.5,'#FFF8DC');g.addColorStop(1,'#FFD700');
    sCtx.fillStyle=g;
  }else{
    sCtx.fillStyle=fc;
  }
  sCtx.fillRect(0,0,1200,630);

  // 装饰圆
  sCtx.globalAlpha=0.1;sCtx.fillStyle='#fff';
  sCtx.beginPath();sCtx.arc(900,150,200,0,Math.PI*2);sCtx.fill();
  sCtx.beginPath();sCtx.arc(200,500,150,0,Math.PI*2);sCtx.fill();
  sCtx.globalAlpha=1;

  // 运势级别
  sCtx.font='bold 160px "ZCOOL KuaiLe",sans-serif';
  sCtx.fillStyle=isTianming?'#8B6E4E':'rgba(255,255,255,0.95)';
  sCtx.textAlign='center';sCtx.textBaseline='middle';
  sCtx.shadowColor='rgba(0,0,0,0.15)';sCtx.shadowBlur=10;
  sCtx.fillText(currentFortune,600,210);

  // 签文
  sCtx.font='48px "ZCOOL KuaiLe",sans-serif';
  sCtx.fillStyle=isTianming?'#8B6E4E':'rgba(255,255,255,0.9)';
  sCtx.shadowBlur=5;
  var txt=currentText;var maxW=960;var line='';var lines=[];
  for(var i=0;i<txt.length;i++){
    var tl=line+txt[i];
    if(sCtx.measureText(tl).width>maxW&&line.length>0){lines.push(line);line=txt[i];}
    else{line=tl;}
  }
  lines.push(line);
  var sy=380-(lines.length-1)*35;
  for(var i=0;i<lines.length;i++) sCtx.fillText(lines[i],600,sy+i*65);

  // 品牌
  sCtx.font='26px "ZCOOL KuaiLe",sans-serif';
  sCtx.fillStyle=isTianming?'rgba(139,110,78,0.6)':'rgba(255,255,255,0.6)';
  sCtx.shadowBlur=0;
  sCtx.fillText('摸鱼 · 打工人的小确幸',600,540);

  // 下载
  var dataUrl=sCanvas.toDataURL('image/png');
  var link=document.createElement('a');
  link.download='摸鱼运势-'+new Date().toLocaleDateString('zh-CN')+'.png';
  link.href=dataUrl;link.click();
}

// ── 主循环 ──
function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
<script>if('serviceWorker'in navigator){navigator.serviceWorker.register('/sw.js')}</script>

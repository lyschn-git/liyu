// ── 缘分派算法 ──
function getUserSeed(){
  var s=localStorage.getItem('moyu_seed');
  if(!s){s=''+Date.now()+Math.random();localStorage.setItem('moyu_seed',s);}
  return s;
}

function hashStr(s){
  var h=0;
  for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}
  return h;
}

function todayFortune(){
  var d=new Date();
  var key=getUserSeed()+'-'+d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  var h=hashStr(key);
  var r=Math.abs(h)%1000;
  // 天命签3%
  if(r<30) return {level:'tianming',name:'天命',color:'#FFD700'};
  if(r<100) return {level:'daji',name:'大吉',color:'#FF9A5C'};
  if(r<280) return {level:'zhongji',name:'中吉',color:'#7BC4B8'};
  if(r<500) return {level:'xiaoji',name:'小吉',color:'#A8D5C8'};
  if(r<700) return {level:'ping',name:'平',color:'#C4B89A'};
  if(r<880) return {level:'xiaoxiong',name:'小凶',color:'#C49A8A'};
  return {level:'xiong',name:'凶',color:'#B87C6A'};
}

function getFortuneText(level){
  var arr=FORTUNES[level]||FORTUNES.ping;

// ── 小装饰 ──
var floaters=[];

function initFloaters(){
  floaters=[];
  for(var i=0;i<8;i++){
    floaters.push({
      x:Math.random()*W,
      y:waterY+Math.random()*(H-waterY),
      r:2+Math.random()*3,
      speed:0.15+Math.random()*0.3,
      phase:Math.random()*Math.PI*2
    });
  }
}

// ── 涟漪 ──
var ripples=[];

function addRipple(x,y){
  ripples.push({x:x,y:y,r:5,maxR:40+Math.random()*20,alpha:0.6});
}

// ── 初始化 ──
function init(){
  var sz=Math.min(W,H);
  koi.w=sz*0.45;
  koi.h=koi.w*0.542;
  koi.x=W/2;
  waterY=H*0.42;
  koi.baseY=waterY;
  koi.y=waterY;
  initFloaters();
}

init();
window.addEventListener('resize',function(){resize();init();});

// ── 触摸 ──
function handlePoke(x,y){
  // 检查是否点在锦鲤身上（宽松判定）
  var dx=x-koi.x,dy=y-koi.y;
  var hitW=koi.w*0.7,hitH=koi.h*0.8;
  if(Math.abs(dx)>hitW/2||Math.abs(dy)>hitH/2) return;

  if(state===STATE.FORTUNE||state===STATE.SHARE) return;

  addRipple(x,y);

  if(state===STATE.IDLE){
    pokeCount++;
    pokeResetTimer=120; // 2秒内不戳就重置
    if(pokeCount===1){
      state=STATE.POKE1;
      pokeTimer=40;
      koi.eyeRoll=1;
    }else if(pokeCount===2){
      state=STATE.POKE2;
      pokeTimer=40;
      koi.flipAngle=1;
    }else{
      // 第三下或更多：直接跃起
      state=STATE.LEAP;
      leapProgress=0;
      currentFortune=todayFortune();
      currentText=getFortuneText(currentFortune.level);
    }
  }else if(state===STATE.POKE1){
    pokeCount++;
    if(pokeCount>=2){
      state=STATE.POKE2;
      pokeTimer=40;
      koi.flipAngle=1;
    }
  }else if(state===STATE.POKE2){
    pokeCount++;
    if(pokeCount>=3){
      state=STATE.LEAP;
      leapProgress=0;
      currentFortune=todayFortune();
      currentText=getFortuneText(currentFortune.level);
    }
  }
}

c.addEventListener('touchstart',function(e){
  e.preventDefault();
  handlePoke(e.touches[0].clientX,e.touches[0].clientY);
},{passive:false});
c.addEventListener('mousedown',function(e){handlePoke(e.clientX,e.clientY);});

// ── 更新 ──
var frame=0;

function update(){
  frame++;
  koi.breathPhase+=0.03;

  // 呼噜泡泡
  koi.snorePhase+=0.04;
  if(state===STATE.IDLE&&frame%30===0){
    snoreBubbles.push({
      x:koi.x+koi.w*0.3,
      y:koi.y-koi.h*0.2,
      r:3+Math.random()*4,
      life:60,
      maxLife:60
    });
  }
  for(var i=snoreBubbles.length-1;i>=0;i--){
    snoreBubbles[i].y-=0.4;
    snoreBubbles[i].x+=Math.sin(frame*0.05+i)*0.3;
    snoreBubbles[i].life--;
    snoreBubbles[i].r+=0.02;
    if(snoreBubbles[i].life<=0) snoreBubbles.splice(i,1);
  }

  // Poke状态计时
  if(state===STATE.POKE1||state===STATE.POKE2){
    pokeTimer--;
    if(pokeTimer<=0){
      if(pokeCount<3){
        state=STATE.IDLE;
        koi.eyeRoll=0;
        koi.flipAngle=0;
        // 2秒后重置戳击计数
        pokeResetTimer=120;
      }
    }
  }

  // 戳击重置
  if(state===STATE.IDLE&&pokeResetTimer>0){
    pokeResetTimer--;
    if(pokeResetTimer<=0) pokeCount=0;
  }

  // 跃起动画
  if(state===STATE.LEAP){
    leapProgress+=0.015;
    if(leapProgress>=1){
      state=STATE.FORTUNE;
      fortuneShow=0;
    }
    koi.leapY=-Math.sin(leapProgress*Math.PI)*H*0.35;
  }

  // 签文显现
  if(state===STATE.FORTUNE){
    fortuneShow=Math.min(1,fortuneShow+0.02);
  }

  // 锦鲤呼吸浮动
  if(state===STATE.IDLE){
    koi.y=koi.baseY+Math.sin(koi.breathPhase)*3;
  }

  // 涟漪
  for(var i=ripples.length-1;i>=0;i--){
    ripples[i].r+=1.5;
    ripples[i].alpha-=0.015;
    if(ripples[i].alpha<=0) ripples.splice(i,1);
  }

  // 装饰泡泡
  for(var i=0;i<floaters.length;i++){
    floaters[i].y-=floaters[i].speed;
    floaters[i].x+=Math.sin(frame*0.01+floaters[i].phase)*0.3;
    if(floaters[i].y<waterY-20){
      floaters[i].y=H+10;
      floaters[i].x=Math.random()*W;
    }
  }
}

// ── 绘制 ──
function draw(){
  sc.clearRect(0,0,W,H);

  // 背景
  drawBg();

  // 水面
  drawWater();

  // 装饰泡泡
  drawFloaters();

  // 涟漪
  drawRipples();

  // 锦鲤
  drawKoi();

  // 呼噜泡泡
  drawSnoreBubbles();

  // 签文
  if(state===STATE.FORTUNE||state===STATE.SHARE) drawFortune();

  // 提示
  if(state===STATE.IDLE&&pokeCount===0) drawHint();

  // 标题
  drawTitle();
}

function drawBg(){
  // 暖色背景渐变
  var g=sc.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#F5F0E8');
  g.addColorStop(0.4,'#EDE6D8');
  g.addColorStop(1,'#E0D5C5');
  sc.fillStyle=g;
  sc.fillRect(0,0,W,H);
}

function drawWater(){
  sc.save();
  // 水面渐变
  var g=sc.createLinearGradient(0,waterY-10,0,H);
  g.addColorStop(0,'rgba(123,196,184,0.08)');
  g.addColorStop(0.3,'rgba(90,168,156,0.12)');
  g.addColorStop(1,'rgba(61,142,130,0.15)');
  sc.fillStyle=g;
  sc.fillRect(0,waterY-5,W,H-waterY+5);

  // 水面波纹
  sc.globalAlpha=0.15;
  sc.strokeStyle=CLR.water1;
  sc.lineWidth=1;
  var t=frame*0.02;
  for(var i=0;i<3;i++){
    sc.beginPath();
    var by=waterY+i*8;
    for(var x=0;x<=W;x+=3){
      var yy=by+Math.sin(x*0.015+t+i*1.5)*3;
      x===0?sc.moveTo(x,yy):sc.lineTo(x,yy);
    }
    sc.stroke();
  }
  sc.globalAlpha=1;

  // 水面光斑
  sc.globalAlpha=0.06;
  sc.fillStyle='#FFFFFF';
  for(var i=0;i<4;i++){
    var sx=W*0.2+i*W*0.2+Math.sin(t*0.5+i)*20;
    var sy=waterY+20+i*25+Math.cos(t*0.3+i)*10;
    sc.beginPath();
    sc.ellipse(sx,sy,15+i*3,4,0,0,Math.PI*2);
    sc.fill();
  }
  sc.globalAlpha=1;
  sc.restore();
}

function drawFloaters(){
  sc.save();
  for(var i=0;i<floaters.length;i++){
    var f=floaters[i];
    sc.globalAlpha=0.12;
    sc.strokeStyle='rgba(123,196,184,0.5)';
    sc.lineWidth=0.6;
    sc.beginPath();sc.arc(f.x,f.y,f.r,0,Math.PI*2);sc.stroke();
  }
  sc.restore();
}

function drawRipples(){
  sc.save();
  for(var i=0;i<ripples.length;i++){
    var r=ripples[i];
    sc.globalAlpha=r.alpha*0.5;
    sc.strokeStyle=CLR.water1;
    sc.lineWidth=1;
    sc.beginPath();sc.arc(r.x,r.y,r.r,0,Math.PI*2);sc.stroke();
  }
  sc.restore();
}

function drawKoi(){
  if(!koiLoaded){
    sc.save();sc.translate(koi.x,koi.y+koi.leapY);
    sc.fillStyle='#FF9A5C';sc.beginPath();sc.ellipse(0,0,koi.w/2,koi.h/2,0,0,Math.PI*2);sc.fill();
    sc.restore();return;
  }

  sc.save();
  sc.translate(koi.x,koi.y+koi.leapY);

  // 翻身动画
  if(state===STATE.POKE2||koi.flipAngle>0){
    var flipAngle=Math.sin(koi.flipAngle*Math.PI*0.5)*0.3;
    sc.rotate(flipAngle);
    koi.flipAngle=Math.max(0,koi.flipAngle-0.03);
  }

  // 锦鲤光晕
  if(state===STATE.LEAP||state===STATE.FORTUNE){
    sc.shadowColor='rgba(255,180,100,0.3)';
    sc.shadowBlur=20;
  }

  var kw=koi.w,kh=koi.h;
  sc.drawImage(koiImg,-kw/2,-kh/2,kw,kh);
  sc.shadowBlur=0;

  // 白眼动画
  if(koi.eyeRoll>0){
    // 画半闭的白眼
    var eyeX=kw*0.15,eyeY=-kh*0.08;
    var eyeR=kw*0.06;
    sc.fillStyle='rgba(255,255,255,'+koi.eyeRoll*0.8+')';
    sc.beginPath();
    sc.ellipse(eyeX,eyeY-eyeR*0.3*koi.eyeRoll,eyeR,eyeR*0.4,0,0,Math.PI*2);
    sc.fill();
    // 小黑点瞳孔上移
    sc.fillStyle='rgba(40,30,20,'+koi.eyeRoll*0.6+')';
    sc.beginPath();
    sc.arc(eyeX,eyeY-eyeR*0.6*koi.eyeRoll,eyeR*0.25,0,Math.PI*2);
    sc.fill();
    // 逐渐恢复
    if(state!==STATE.POKE1) koi.eyeRoll=Math.max(0,koi.eyeRoll-0.02);
  }

  // 跃起时的水花效果
  if(state===STATE.LEAP&&leapProgress<0.3){
    var splash=1-leapProgress/0.3;
    sc.globalAlpha=splash*0.4;
    for(var i=0;i<5;i++){
      var angle=-Math.PI*0.3+i*Math.PI*0.15;
      var dist=20+splash*30;
      var sx=Math.cos(angle)*dist;
      var sy=Math.sin(angle)*dist+kh*0.3;
      sc.fillStyle='rgba(123,196,184,0.5)';
      sc.beginPath();sc.arc(sx,sy,2+splash*3,0,Math.PI*2);sc.fill();
    }
    sc.globalAlpha=1;
  }

  sc.restore();
}

function drawSnoreBubbles(){
  sc.save();
  for(var i=0;i<snoreBubbles.length;i++){
    var b=snoreBubbles[i];
    var alpha=b.life/b.maxLife;
    sc.globalAlpha=alpha*0.3;
    sc.strokeStyle='rgba(139,110,78,0.4)';
    sc.lineWidth=0.8;
    sc.beginPath();sc.arc(b.x,b.y,b.r,0,Math.PI*2);sc.stroke();
    // 小z
    if(b.r>4){
      sc.font='8px sans-serif';
      sc.fillStyle='rgba(139,110,78,'+alpha*0.3+')';
      sc.textAlign='center';
      sc.fillText('z',b.x,b.y);
    }
  }
  sc.restore();
}

function drawHint(){
  var pulse=0.4+0.3*Math.sin(frame*0.04);
  sc.save();
  sc.globalAlpha=pulse;
  sc.font='600 15px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  sc.fillStyle=CLR.textLight;
  sc.textAlign='center';
  sc.fillText('戳一下锦鲤',W/2,H*0.72);
  sc.restore();
}

function drawTitle(){
  sc.save();
  // "摸鱼"标题
  sc.font='600 28px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  sc.fillStyle=CLR.text;
  sc.textAlign='center';
  sc.globalAlpha=0.7;
  sc.fillText('摸鱼',W/2,H*0.08+20);
  // 副标题
  sc.font='13px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  sc.fillStyle=CLR.textLight;
  sc.globalAlpha=0.4;
  sc.fillText('打工人的小确幸',W/2,H*0.08+42);
  sc.restore();
}

function drawFortune(){
  sc.save();
  var cx=W/2,cy=H*0.38;
  var cardW=Math.min(W*0.82,320);
  var cardH=cardW*1.1;

  // 卡片背景
  var fadeIn=Math.min(1,fortuneShow*1.5);
  sc.globalAlpha=fadeIn;

  // 天命签金光
  if(currentFortune.level==='tianming'&&fadeIn>0.3){
    var glow=0.3+Math.sin(frame*0.05)*0.15;
    sc.fillStyle='rgba(255,215,0,'+glow+')';
    sc.beginPath();sc.arc(cx,cy,cardW*0.7,0,Math.PI*2);sc.fill();
  }

  // 签卡底色
  sc.fillStyle=CLR.white;
  sc.shadowColor='rgba(0,0,0,0.08)';
  sc.shadowBlur=15;
  sc.shadowOffsetY=4;
  roundRect(cx-cardW/2,cy-cardH/2,cardW,cardH,16);
  sc.fill();
  sc.shadowBlur=0;sc.shadowOffsetY=0;

  // 签卡边框
  sc.strokeStyle=currentFortune.color;
  sc.lineWidth=2;
  roundRect(cx-cardW/2,cy-cardH/2,cardW,cardH,16);
  sc.stroke();

  // 运势级别
  var textAlpha=Math.max(0,(fortuneShow-0.2)/0.8);
  sc.globalAlpha=textAlpha;

  sc.font='bold 42px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  sc.fillStyle=currentFortune.color;
  sc.textAlign='center';
  sc.textBaseline='middle';
  sc.fillText(currentFortune.name,cx,cy-cardH*0.2);

  // 签文（延迟出现）
  var msgAlpha=Math.max(0,(fortuneShow-0.5)/0.5);
  if(msgAlpha>0){
    sc.globalAlpha=msgAlpha;
    sc.font='16px "ZCOOL KuaiLe","PingFang SC",sans-serif';
    sc.fillStyle=CLR.text;
    // 自动换行
    wrapText(currentText,cx,cy+cardH*0.05,cardW*0.75,22);
  }

  // 底部品牌
  var brandAlpha=Math.max(0,(fortuneShow-0.7)/0.3);
  if(brandAlpha>0){
    sc.globalAlpha=brandAlpha*0.35;
    sc.font='11px "ZCOOL KuaiLe","PingFang SC",sans-serif';
    sc.fillStyle=CLR.textLight;
    sc.fillText('摸鱼 · 打工人的小确幸',cx,cy+cardH*0.38);
  }

  // 再来一签按钮
  if(fortuneShow>=1){
    sc.globalAlpha=0.6+0.2*Math.sin(frame*0.05);
    sc.font='14px "ZCOOL KuaiLe","PingFang SC",sans-serif';
    sc.fillStyle=CLR.orange;
    sc.fillText('再戳锦鲤 →',cx,cy+cardH*0.45);
  }

  sc.restore();
}

function wrapText(text,x,y,maxW,lineH){
  var words=text.split('');
  var line='';
  var ty=y;
  for(var i=0;i<words.length;i++){
    var testLine=line+words[i];
    if(sc.measureText(testLine).width>maxW&&line.length>0){
      sc.fillText(line,x,ty);
      line=words[i];
      ty+=lineH;
    }else{
      line=testLine;
    }
  }
  sc.fillText(line,x,ty);
}

function roundRect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  sc.beginPath();
  sc.moveTo(x+r,y);sc.lineTo(x+w-r,y);
  sc.quadraticCurveTo(x+w,y,x+w,y+r);
  sc.lineTo(x+w,y+h-r);
  sc.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  sc.lineTo(x+r,y+h);
  sc.quadraticCurveTo(x,y+h,x,y+h-r);
  sc.lineTo(x,y+r);
  sc.quadraticCurveTo(x,y,x+r,y);
  sc.closePath();
}

// ── 主循环 ──
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

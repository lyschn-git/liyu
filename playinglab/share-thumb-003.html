<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 300px;
  height: 300px;
  background: #f8f7f4;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  font-family: 'Noto Sans CJK SC', sans-serif;
  overflow: hidden;
}

.brand {
  font-size: 13px;
  color: #c75d52;
  letter-spacing: 4px;
  font-weight: 500;
  margin-bottom: 10px;
}

.title {
  font-family: 'Noto Serif CJK SC', serif;
  font-size: 28px;
  color: #2d3a35;
  font-weight: 700;
  margin-bottom: 14px;
  line-height: 1.4;
  text-align: center;
}

.subtitle {
  font-size: 11px;
  color: #7a8a82;
  text-align: center;
  line-height: 1.7;
}

.divider {
  width: 36px;
  height: 2px;
  background: #c75d52;
  margin-top: 14px;
  border-radius: 1px;
}
</style>
</head>
<body>
  <div class="brand">玩意儿Lab</div>
  <div class="title">小红书开始种AI</div>
  <div class="subtitle">你的笔记下方<br>长出了一个工具箱</div>
  <div class="divider"></div>
</body>
</html>

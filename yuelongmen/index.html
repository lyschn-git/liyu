// ── 初始化游戏参数 ──
function initGameParams(){
  koi.w=Math.min(W*0.18,72);
  koi.h=koi.w*0.517; // 2w-2比例 240:124
  koi.slices=12;
  koi.x=W*0.22;
  koi.y=H*0.4;
  koi.vy=0;
  koi.rotation=0;
  koi.alive=true;

  waterY=H*0.82;
  gateSpeed=W*0.0025;   // 降速
  gateGap=koi.h*4.5;    // 更大间隙，新手友好
  gateSpacing=W*0.4;    // 间距紧凑，节奏不停
  score=0;

  gates=[];
  nextGateX=W*1.5; // 第一根门柱推更远
  for(var i=0;i<4;i++){
    addGate();
  }

  floatingTexts=[];

  // 开局漂浮期
  graceFrames=GRACE_TOTAL;
  graceBaseY=koi.y;
}

function addGate(){
  var minTop=koi.h*1.5;
  var maxTop=waterY-gateGap-koi.h*1.5;
  var topH=minTop+Math.random()*(maxTop-minTop);
  gates.push({x:nextGateX,topH:topH,botY:topH+gateGap,passed:false,w:Math.min(W*0.14,50)});
  nextGateX+=gateSpacing;
}

// ── 触摸/点击 ──
function onTap(e){
  e.preventDefault();
  if(state===STATE.MENU){
    state=STATE.PLAY;
    initGameParams();
  }else if(state===STATE.PLAY&&koi.alive){
    if(graceFrames>0){
      // 漂浮期内点触：提前结束漂浮，开始游戏
      graceFrames=0;
      koi.vy=koi.flapPower*0.5; // 第一跳温和一点
    }else{
      koi.vy=koi.flapPower;
    }
  }else if(state===STATE.OVER){
    // 延迟防误触
    if(overTimer>30){
      state=STATE.MENU;
    }
  }
}

var overTimer=0;
c.addEventListener('touchstart',onTap,{passive:false});
c.addEventListener('mousedown',onTap);

// ── 游戏逻辑更新 ──
function update(){
  if(state!==STATE.PLAY)return;

  // ── 漂浮期逻辑 ──
  if(graceFrames>0){
    graceFrames--;
    // 鱼缓缓上下浮动，不受重力
    koi.y=graceBaseY+Math.sin((GRACE_TOTAL-graceFrames)*0.06)*6;
    koi.rotation=Math.sin((GRACE_TOTAL-graceFrames)*0.06)*0.05;
    koi.vy=0;
    // 门柱缓慢移入（半速），让玩家看到门柱在靠近
    for(var i=0;i<gates.length;i++){
      gates[i].x-=gateSpeed*0.5;
    }
    waveOffset+=gateSpeed*0.3;
    // 漂浮期结束，重置速度
    if(graceFrames===0){
      koi.vy=0;
      koi.y=graceBaseY;
    }
    return;
  }

  // 锦鲤物理
  koi.vy+=koi.gravity;
  koi.y+=koi.vy;
  koi.rotation=Math.max(-0.4,Math.min(0.5,koi.vy*0.06));

  // 水波滚动
  waveOffset+=gateSpeed*0.6;

  // 门柱移动
  for(var i=0;i<gates.length;i++){
    gates[i].x-=gateSpeed;
    // 过门判定
    if(!gates[i].passed&&gates[i].x+gates[i].w<koi.x){
      gates[i].passed=true;
      score++;
      // 飘字
      var ft='';
      if(score%10===0&&score>0) ft=FORTUNE_10[Math.floor(Math.random()*FORTUNE_10.length)];
      else if(score%5===0&&score>0) ft=FORTUNE_5[Math.floor(Math.random()*FORTUNE_5.length)];
      else ft=FORTUNE_1[Math.floor(Math.random()*FORTUNE_1.length)];
      floatingTexts.push({text:ft,x:koi.x+koi.w,y:koi.y-koi.h*0.5,life:60,alpha:1});
    }
  }

  // 移除过远的门柱，添加新的
  while(gates.length>0&&gates[0].x<-gates[0].w){
    gates.shift();
    addGate();
  }

  // 难度递增（更温和）
  if(score>8){gateGap=koi.h*4.0;gateSpacing=W*0.38;}
  if(score>20){gateGap=koi.h*3.5;gateSpacing=W*0.35;gateSpeed=W*0.0028;}
  if(score>35){gateGap=koi.h*3.0;gateSpacing=W*0.32;gateSpeed=W*0.003;}

  // 碰撞检测
  var kx=koi.x,ky=koi.y,kw=koi.w*0.6,kh=koi.h*0.6; // 碰撞体略小
  // 天花板
  if(ky-kh<0){die();return;}
  // 水面
  if(ky+kh>waterY){die();return;}
  // 门柱
  for(var i=0;i<gates.length;i++){
    var g=gates[i];
    var gw=g.w;
    // 上门柱
    if(kx+kw>g.x&&kx-kw<g.x+gw){
      if(ky-kh<g.topH){die();return;}
      if(ky+kh>g.botY){die();return;}
    }
  }

  // 飘字更新
  for(var i=floatingTexts.length-1;i>=0;i--){
    floatingTexts[i].y-=0.8;
    floatingTexts[i].life--;
    floatingTexts[i].alpha=Math.min(1,floatingTexts[i].life/20);
    if(floatingTexts[i].life<=0) floatingTexts.splice(i,1);
  }

  if(state===STATE.OVER) overTimer++;
}

function die(){
  koi.alive=false;
  state=STATE.OVER;
  overTimer=0;
  if(score>bestScore){
    bestScore=score;
    try{localStorage.setItem('ylm_best',bestScore);}catch(e){}
  }
}

// ── 绘制 ──
function draw(){
  sc.clearRect(0,0,W,H);

  // 背景
  sc.fillStyle=CLR.bg;
  sc.fillRect(0,0,W,H);

  // 远景山峦（极淡）
  drawMountains();

  // 水面
  drawWater();

  // 门柱
  for(var i=0;i<gates.length;i++){
    drawGate(gates[i]);
  }

  // 锦鲤
  if(state===STATE.PLAY||state===STATE.OVER){
    drawKoi();
  }

  // 飘字
  for(var i=0;i<floatingTexts.length;i++){
    var ft=floatingTexts[i];
    sc.save();
    sc.globalAlpha=ft.alpha;
    sc.font='bold 16px "ZCOOL KuaiLe","STSong",serif';
    sc.fillStyle=CLR.orange;
    sc.textAlign='center';
    sc.fillText(ft.text,ft.x,ft.y);
    sc.restore();
  }

  // HUD
  if(state===STATE.PLAY){
    if(graceFrames>0){
      // 漂浮期提示
      var gAlpha=0.5+0.3*Math.sin(Date.now()*0.006);
      sc.save();sc.globalAlpha=gAlpha;
      sc.font='16px "ZCOOL KuaiLe","STSong",serif';
      sc.fillStyle=CLR.orange;
      sc.textAlign='center';
      sc.fillText('轻触跃起',W/2,H*0.15);
      sc.restore();
    }else{
      sc.font='32px "ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif';
      sc.fillStyle=CLR.orange;
      sc.textAlign='center';
      sc.fillText(score,W/2,52);
    }
  }

  // 菜单
  if(state===STATE.MENU){
    drawMenu();
  }

  // 结算
  if(state===STATE.OVER){
    drawOver();
  }
}

// ── 远景山峦 ──
function drawMountains(){
  sc.save();
  sc.globalAlpha=0.04;
  sc.fillStyle=CLR.water;
  // 两层山
  sc.beginPath();
  sc.moveTo(0,H*0.55);
  sc.quadraticCurveTo(W*0.15,H*0.35,W*0.3,H*0.5);
  sc.quadraticCurveTo(W*0.45,H*0.3,W*0.6,H*0.48);
  sc.quadraticCurveTo(W*0.8,H*0.32,W,H*0.5);
  sc.lineTo(W,waterY);sc.lineTo(0,waterY);
  sc.closePath();sc.fill();

  sc.globalAlpha=0.025;
  sc.beginPath();
  sc.moveTo(0,H*0.6);
  sc.quadraticCurveTo(W*0.2,H*0.42,W*0.4,H*0.55);
  sc.quadraticCurveTo(W*0.6,H*0.38,W*0.8,H*0.52);
  sc.quadraticCurveTo(W*0.9,H*0.45,W,H*0.55);
  sc.lineTo(W,waterY);sc.lineTo(0,waterY);
  sc.closePath();sc.fill();
  sc.restore();
}

// ── 水面 ──
function drawWater(){
  sc.save();
  // 水面主体
  var wg=sc.createLinearGradient(0,waterY,0,H);
  wg.addColorStop(0,'rgba(123,196,184,0.08)');
  wg.addColorStop(0.3,'rgba(123,196,184,0.15)');
  wg.addColorStop(1,'rgba(123,196,184,0.25)');
  sc.fillStyle=wg;

  // 波浪顶边
  sc.beginPath();
  sc.moveTo(0,waterY);
  for(var x=0;x<=W;x+=3){
    var wy=waterY+Math.sin(x*0.012+waveOffset*0.03)*3+Math.sin(x*0.006+waveOffset*0.02)*2;
    sc.lineTo(x,wy);
  }
  sc.lineTo(W,H);sc.lineTo(0,H);
  sc.closePath();sc.fill();

  // 水纹线
  sc.strokeStyle='rgba(123,196,184,0.12)';
  sc.lineWidth=0.8;
  for(var row=0;row<3;row++){
    var ry=waterY+15+row*20;
    sc.beginPath();
    for(var x=0;x<=W;x+=3){
      var ryy=ry+Math.sin(x*0.01+row*1.5+waveOffset*0.02)*3;
      x===0?sc.moveTo(x,ryy):sc.lineTo(x,ryy);
    }
    sc.stroke();
  }
  sc.restore();
}

// ── 龙门门柱 ──
function drawGate(g){
  sc.save();
  var gw=g.w;
  // 上门柱
  drawPillar(g.x,0,gw,g.topH);
  // 下门柱
  drawPillar(g.x,g.botY,gw,waterY-g.botY);
  // 门楣装饰（上方门柱底部）
  drawCap(g.x-gw*0.1,g.topH-gw*0.25,gw*1.2,gw*0.25);
  // 下方门柱顶部
  drawCap(g.x-gw*0.1,g.botY,gw*1.2,gw*0.25);
  sc.restore();
}

function drawPillar(x,y,w,h){
  // 门柱主体
  sc.fillStyle=CLR.gateFill;
  sc.fillRect(x,y,w,h);
  // 边框
  sc.strokeStyle='rgba(255,154,92,0.25)';
  sc.lineWidth=1.5;
  sc.strokeRect(x,y,w,h);
  // 中式纹理：竖线
  sc.strokeStyle='rgba(255,154,92,0.08)';
  sc.lineWidth=0.5;
  var mid=x+w/2;
  sc.beginPath();sc.moveTo(mid,y);sc.lineTo(mid,y+h);sc.stroke();
}

function drawCap(x,y,w,h){
  // 门楣/门墩
  sc.fillStyle='rgba(255,154,92,0.1)';
  sc.fillRect(x,y,w,h);
  sc.strokeStyle='rgba(255,154,92,0.2)';
  sc.lineWidth=1;
  sc.strokeRect(x,y,w,h);
  // 小装饰线
  sc.fillStyle='rgba(255,154,92,0.15)';
  sc.fillRect(x+w*0.3,y+h*0.2,w*0.4,h*0.6);
}

// ── 锦鲤绘制 ──
function drawKoi(){
  if(!koiLoaded){
    // fallback：画个椭圆
    sc.save();sc.translate(koi.x,koi.y);sc.rotate(koi.rotation);
    sc.fillStyle='#FF9A5C';sc.beginPath();sc.ellipse(0,0,koi.w/2,koi.h/2,0,0,Math.PI*2);sc.fill();
    sc.restore();return;
  }

  sc.save();
  sc.translate(koi.x,koi.y);
  sc.rotate(koi.rotation);

  // 画鱼体
  var kw=koi.w,kh=koi.h;
  sc.drawImage(koiImg,-kw/2,-kh/2,kw,kh);

  sc.restore();
}

// ── 菜单画面 ──
function drawMenu(){
  // 半透明遮罩
  sc.save();
  sc.fillStyle='rgba(255,248,240,0.7)';
  sc.fillRect(0,0,W,H);

  // 标题（粉橙渐变外发光圆体，学豆包审美）
  sc.font='36px "ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif';
  sc.textAlign='center';
  // 外发光
  sc.shadowColor='rgba(255,140,80,0.5)';
  sc.shadowBlur=16;
  sc.shadowOffsetX=0;
  sc.shadowOffsetY=0;
  // 粉橙渐变填充
  var tg=sc.createLinearGradient(W/2-80,H*0.18,W/2+80,H*0.22);
  tg.addColorStop(0,'#FF7EB3');
  tg.addColorStop(0.5,'#FF9A5C');
  tg.addColorStop(1,'#FFB347');
  sc.fillStyle=tg;
  sc.fillText('锦鲤跃龙门',W/2,H*0.22);
  // 描边让字更立体
  sc.strokeStyle='rgba(200,80,30,0.3)';
  sc.lineWidth=1;
  sc.strokeText('锦鲤跃龙门',W/2,H*0.22);
  // 重置阴影
  sc.shadowColor='transparent';
  sc.shadowBlur=0;

  // 锦鲤图（下移，离标题远一些）
  if(koiLoaded){
    var showW=Math.min(W*0.45,180);
    var showH=showW*0.517;
    // 缓慢游动效果
    var bobY=Math.sin(Date.now()*0.003)*8;
    sc.drawImage(koiImg,W/2-showW/2,H*0.40+bobY-showH/2,showW,showH);
  }

  // 提示
  var pulse=0.6+0.4*Math.sin(Date.now()*0.004);
  sc.globalAlpha=pulse;
  sc.font='600 16px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  sc.fillStyle=CLR.orange;
  sc.fillText('轻触开始',W/2,H*0.62);
  sc.globalAlpha=1;

  // 最佳记录
  if(bestScore>0){
    sc.font='13px "ZCOOL KuaiLe","PingFang SC",sans-serif';
    sc.fillStyle='rgba(180,130,80,0.6)';
    sc.fillText('最佳: '+bestScore,W/2,H*0.68);
  }

  // 品牌
  sc.font='11px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  sc.fillStyle='rgba(160,120,70,0.4)';
  sc.fillText('鲤·遇出品',W/2,H*0.92);

  sc.restore();
}

// ── 结算画面 ──
function drawOver(){
  overTimer++;

  // 渐入遮罩
  var fadeIn=Math.min(1,overTimer/20);
  sc.save();
  sc.fillStyle='rgba(255,248,240,'+(fadeIn*0.85).toFixed(2)+')';
  sc.fillRect(0,0,W,H);

  if(fadeIn<0.5){sc.restore();return;}

  // 本次分数
  sc.font='48px "ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif';
  sc.fillStyle=CLR.brown;
  sc.textAlign='center';
  sc.fillText(score,W/2,H*0.28);

  sc.font='14px "ZCOOL KuaiLe","STSong",serif';
  sc.fillStyle='rgba(180,130,80,0.7)';
  sc.fillText('跃过龙门',W/2,H*0.28+24);

  // 口彩签语
  var signIdx=Math.abs(Math.floor(Date.now()/86400000+score*7))%SIGN_TEXTS.length;
  sc.font='16px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  sc.fillStyle=CLR.orange;
  sc.fillText(SIGN_TEXTS[signIdx],W/2,H*0.42);

  // 最佳
  sc.font='13px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  sc.fillStyle='rgba(180,130,80,0.6)';
  sc.fillText('最佳: '+bestScore,W/2,H*0.50);

  // 按钮位置定位给HTML层
  if(overTimer>30){
    var ob=document.getElementById('overBtns');
    var b1=document.getElementById('btn1');
    var b2=document.getElementById('btn2');
    ob.style.display='block';
    var b1Y=H*0.60-18;
    b1.style.left=(W/2-80)+'px';
    b1.style.top=b1Y+'px';
    var b2Y=H*0.68-16;
    b2.style.left=(W/2-80)+'px';
    b2.style.top=b2Y+'px';
  }

  // 品牌
  sc.font='11px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  sc.fillStyle='rgba(160,120,70,0.4)';
  sc.fillText('鲤·遇出品',W/2,H*0.92);

  sc.restore();
}

function roundRect(x,y,w,h,r){
  sc.beginPath();
  sc.moveTo(x+r,y);sc.lineTo(x+w-r,y);sc.quadraticCurveTo(x+w,y,x+w,y+r);
  sc.lineTo(x+w,y+h-r);sc.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  sc.lineTo(x+r,y+h);sc.quadraticCurveTo(x,y+h,x,y+h-r);
  sc.lineTo(x,y+r);sc.quadraticCurveTo(x,y,x+r,y);
  sc.closePath();
}

// ── 游戏主循环 ──
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

// 字体加载后启动
if(document.fonts&&document.fonts.ready){
  document.fonts.ready.then(function(){loop();});
}else{
  setTimeout(loop,500);
}

// ── 结算页按钮（HTML层）──
document.getElementById('btn1').addEventListener('click',function(){
  document.getElementById('overBtns').style.display='none';
  state=STATE.MENU;
});
document.getElementById('btn2').addEventListener('click',function(){
  window.location.href='https://liyu.yisan.run/';
});
document.getElementById('btn1').addEventListener('touchend',function(e){
  e.preventDefault();
  document.getElementById('overBtns').style.display='none';
  state=STATE.MENU;
});
document.getElementById('btn2').addEventListener('touchend',function(e){
  e.preventDefault();
  window.location.href='https://liyu.yisan.run/';
});
</script>

// ── 初始化 ──
function initGame(){
  waterY=H*0.82;
  koi.w=Math.min(W*0.22,90);
  koi.h=koi.w*0.542;
  koi.x=W*0.28;
  koi.y=waterY*0.5;
  koi.vy=0;koi.rotation=0;koi.alive=true;
  gates=[];floatingTexts=[];sparkles=[];
  gateSpeed=W*0.0020;
  gateGap=koi.h*5.5;    // 新手间隙
  gateSpacing=W*0.30;   // 更紧凑间距
  score=0;overTimer=0;
  resumeGraceLeft=0;
  invincibleFrames=0;
  nextGateX=W*1.5; // 第一根门柱推更远
  graceFrames=GRACE_TOTAL;
  graceBaseY=waterY*0.45;
  koi.y=graceBaseY;
  document.getElementById('overBtns').style.display='none';
  document.getElementById('pauseOverlay').style.display='none';
  document.getElementById('win-share-img').style.display='none';
  document.getElementById('win-share-img').src='';
  // 添加初始门柱
  for(var i=0;i<4;i++){
    addGate();
  }
  initBubbles();
  initClouds();
}

function addGate(){
  var gw=Math.max(28,W*0.07);
  var minTop=koi.h*1.5;
  var maxTop=waterY-gateGap-koi.h*1.5;
  var topH=minTop+Math.random()*(maxTop-minTop);
  var botY=topH+gateGap;
  gates.push({
    x:nextGateX,w:gw,topH:topH,botY:botY,passed:false
  });
  nextGateX+=gateSpacing;
}

// ── 触摸/点击 ──
function flap(){
  if(state===STATE.MENU){
    initGame();
    state=STATE.PLAY;
    koi.vy=koi.flapPower*0.5; // 第一跳温和一点
    return;
  }
  if(state===STATE.OVER||state===STATE.WIN||state===STATE.PAUSE){
    return;
  }
  if(state===STATE.PLAY&&koi.alive){
    // 恢复grace期间，首次点击取消grace开始游戏
    if(resumeGraceLeft>0){
      resumeGraceLeft=0;
      koi.vy=koi.flapPower;
      return;
    }
    if(graceFrames>0){
      graceFrames=0;
      koi.vy=koi.flapPower;
    }else{
      koi.vy=koi.flapPower;
    }
  }
}

c.addEventListener('touchstart',function(e){
  e.preventDefault();
  if(e.touches.length>=2&&state===STATE.PLAY){
    // 双指=暂停
    state=STATE.PAUSE;
    document.getElementById('pauseOverlay').style.display='flex';
    return;
  }
  flap();
},{passive:false});
c.addEventListener('mousedown',function(e){flap();});

// ── 更新 ──
var overTimer=0;

function update(){
  if(state===STATE.MENU)return;
  if(state===STATE.PAUSE)return;

  // 恢复grace倒计时
  if(resumeGraceLeft>0){
    resumeGraceLeft--;
    // 锦鲤悬停，不移动
    koi.vy=0;
    koi.rotation=0;
    // 仍然更新气泡/云朵让画面不死
    for(var i=0;i<bubbles.length;i++){
      var b=bubbles[i];b.y-=b.speed;b.wobble+=b.wobbleSpeed;b.x+=Math.sin(b.wobble)*0.3;
      if(b.y<waterY){b.y=H;b.x=Math.random()*W;}
    }
    for(var i=0;i<clouds.length;i++){clouds[i].x+=clouds[i].speed;if(clouds[i].x>W+60)clouds[i].x=-60;}
    // 更新闪光粒子
    for(var i=sparkles.length-1;i>=0;i--){var s=sparkles[i];s.x+=s.vx;s.y+=s.vy;s.life--;s.alpha=s.life/s.maxLife;if(s.life<=0)sparkles.splice(i,1);}
    // grace即将结束(最后10帧)，将鱼推到安全位置
    if(resumeGraceLeft<=10){
      var safeY=findSafeY();
      if(safeY!==null){
        koi.y+=(safeY-koi.y)*0.3; // 平滑过渡到安全区
      }
    }
    // grace结束瞬间给0.5秒无敌
    if(resumeGraceLeft===1){
      invincibleFrames=30;
    }
    return;
  }

  // 气泡
  for(var i=0;i<bubbles.length;i++){
    var b=bubbles[i];
    b.y-=b.speed;
    b.wobble+=b.wobbleSpeed;
    b.x+=Math.sin(b.wobble)*0.3;
    if(b.y<waterY){
      b.y=H;
      b.x=Math.random()*W;
    }
  }

  // 云朵
  for(var i=0;i<clouds.length;i++){
    clouds[i].x+=clouds[i].speed;
    if(clouds[i].x>W+clouds[i].w){
      clouds[i].x=-clouds[i].w;
    }
  }

  // 闪光粒子
  for(var i=sparkles.length-1;i>=0;i--){
    var s=sparkles[i];
    s.x+=s.vx;s.y+=s.vy;s.vy+=0.05;
    s.life--;s.alpha=s.life/s.maxLife;
    if(s.life<=0)sparkles.splice(i,1);
  }

  if(state===STATE.OVER||state===STATE.WIN)return;

  // 漂浮期
  if(graceFrames>0){
    graceFrames--;
    koi.y=graceBaseY+Math.sin((GRACE_TOTAL-graceFrames)*0.06)*6;
    koi.rotation=Math.sin((GRACE_TOTAL-graceFrames)*0.06)*0.05;
    koi.vy=0;
    for(var i=0;i<gates.length;i++){
      gates[i].x-=gateSpeed*0.5;
    }
    waveOffset+=gateSpeed*0.3;
    if(graceFrames===0){koi.vy=0;koi.y=graceBaseY;}
    return;
  }

  koi.vy+=koi.gravity;
  koi.y+=koi.vy;
  koi.rotation=Math.max(-0.4,Math.min(0.5,koi.vy*0.06));

  waveOffset+=gateSpeed*0.6;

  for(var i=0;i<gates.length;i++){
    gates[i].x-=gateSpeed;
    if(!gates[i].passed&&gates[i].x+gates[i].w<koi.x){
      gates[i].passed=true;
      score++;
      // 通关判定
      if(score>=WIN_SCORE){
        state=STATE.WIN;
        overTimer=0;
        winShareImg=null;
        if(score>bestScore){bestScore=score;try{localStorage.setItem('ylm_best',bestScore);}catch(e){}}
        generateWinShareImage();
        break;
      }
      // 飘字
      var ft='';
      if(score%10===0&&score>0) ft=FORTUNE_10[Math.floor(Math.random()*FORTUNE_10.length)];
      else if(score%5===0&&score>0) ft=FORTUNE_5[Math.floor(Math.random()*FORTUNE_5.length)];
      else ft=FORTUNE_1[Math.floor(Math.random()*FORTUNE_1.length)];
      var big=(score%10===0&&score>0)?1:(score%5===0&&score>0)?0.8:0;
      floatingTexts.push({text:ft,x:koi.x+koi.w,y:koi.y-koi.h*0.5,life:80,alpha:1,scale:2.0+big*0.5,big:big});
      // 过门闪光
      for(var j=0;j<6;j++){
        sparkles.push({
          x:koi.x,y:koi.y,
          vx:(Math.random()-0.5)*3,
          vy:(Math.random()-0.5)*3,
          r:2+Math.random()*3,
          life:25+Math.random()*15,
          maxLife:40,
          alpha:1,
          color:Math.random()>0.5?CLR.gold:CLR.orange
        });
      }
    }
  }

  while(gates.length>0&&gates[0].x<-gates[0].w){
    gates.shift();addGate();
  }

  if(score>4){gateGap=koi.h*5.0;gateSpacing=W*0.28;}
  if(score>8){gateGap=koi.h*4.6;gateSpacing=W*0.26;gateSpeed=W*0.0021;}
  if(score>14){gateGap=koi.h*4.2;gateSpacing=W*0.24;gateSpeed=W*0.0023;}
  if(score>20){gateGap=koi.h*3.8;gateSpacing=W*0.22;gateSpeed=W*0.0025;}
  if(score>30){gateGap=koi.h*3.4;gateSpacing=W*0.20;gateSpeed=W*0.0028;}

  // 无敌帧倒计时
  if(invincibleFrames>0) invincibleFrames--;

  var kx=koi.x,ky=koi.y,kw=koi.w*0.6,kh=koi.h*0.6;
  if(ky-kh<0){die();return;}
  if(ky+kh>waterY){die();return;}
  // 无敌期间跳过门柱碰撞
  if(invincibleFrames<=0){
  for(var i=0;i<gates.length;i++){
    var g=gates[i];
    if(kx+kw>g.x&&kx-kw<g.x+g.w){
      if(ky-kh<g.topH){die();return;}
      if(ky+kh>g.botY){die();return;}
    }
  }
  }

  for(var i=floatingTexts.length-1;i>=0;i--){
    floatingTexts[i].y-=0.8;
    floatingTexts[i].life--;
    floatingTexts[i].alpha=Math.min(1,floatingTexts[i].life/20);
    floatingTexts[i].scale=Math.max(1,floatingTexts[i].scale-0.025);
    if(floatingTexts[i].life<=0) floatingTexts.splice(i,1);
  }

  if(state===STATE.OVER) overTimer++;
}

// 找到鱼当前位置附近的安全Y坐标（门柱间隙中间）
function findSafeY(){
  var kx=koi.x,kw=koi.w*0.6;
  for(var i=0;i<gates.length;i++){
    var g=gates[i];
    if(kx+kw>g.x-5&&kx-kw<g.x+g.w+5){
      // 鱼在这根门柱附近，返回间隙中间
      return (g.topH+g.botY)/2;
    }
  }
  return null; // 不在门柱附近，无需调整
}

function die(){
  koi.alive=false;
  state=STATE.OVER;
  overTimer=0;
  if(score>bestScore){
    bestScore=score;
    try{localStorage.setItem('ylm_best',bestScore);}catch(e){}
  }
}

// ═══════════════════════════════════════════════
// 绘制 - Q萌风格
// ═══════════════════════════════════════════════

function draw(){
  sc.clearRect(0,0,W,H);

  // 暖色渐变背景
  var bgGrad=sc.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,'#FFF8F0');
  bgGrad.addColorStop(0.6,'#FFF3E8');
  bgGrad.addColorStop(1,'#FFEDD8');
  sc.fillStyle=bgGrad;
  sc.fillRect(0,0,W,H);

  // 云朵
  drawClouds();

  // 远景山峦
  drawMountains();

  // 水面
  drawWater();

  // 气泡
  drawBubbles();

  // 门柱
  for(var i=0;i<gates.length;i++){
    drawGate(gates[i]);
  }

  // 闪光粒子
  drawSparkles();

  // 锦鲤
  if(state===STATE.PLAY||state===STATE.OVER||state===STATE.WIN){
    drawKoi();
  }

  // 飘字
  for(var i=0;i<floatingTexts.length;i++){
    var ft=floatingTexts[i];
    sc.save();
    sc.globalAlpha=ft.alpha;
    sc.translate(ft.x,ft.y);
    sc.scale(ft.scale,ft.scale);
    // 文字光晕
    var fSize=ft.big>0.5?32:ft.big>0?28:24;
    sc.shadowColor='rgba(255,154,92,0.6)';
    sc.shadowBlur=ft.big>0?18:12;
    sc.font='bold '+fSize+'px "ZCOOL KuaiLe","STSong",serif';
    sc.fillStyle=ft.big>0?CLR.orange:CLR.orangeDark;
    sc.textAlign='center';
    sc.fillText(ft.text,0,0);
    sc.shadowBlur=0;
    sc.restore();
  }

  // HUD - 分数气泡
  if(state===STATE.PLAY){
    if(resumeGraceLeft>0){
      // 恢复grace提示
      var rAlpha=0.5+0.3*Math.sin(Date.now()*0.008);
      sc.save();sc.globalAlpha=rAlpha;
      sc.font='20px "ZCOOL KuaiLe","STSong",serif';
      sc.fillStyle=CLR.orange;
      sc.textAlign='center';
      sc.shadowColor='rgba(255,154,92,0.3)';sc.shadowBlur=6;
      sc.fillText('准备... ✨',W/2,H*0.15);
      sc.shadowBlur=0;sc.restore();
      // 仍然显示分数
      drawScoreBubble(score,W/2,48);
    }else if(graceFrames>0){
      var gAlpha=0.5+0.3*Math.sin(Date.now()*0.006);
      sc.save();sc.globalAlpha=gAlpha;
      sc.font='18px "ZCOOL KuaiLe","STSong",serif';
      sc.fillStyle=CLR.orange;
      sc.textAlign='center';
      sc.shadowColor='rgba(255,154,92,0.3)';sc.shadowBlur=6;
      sc.fillText('轻触跃起 ✨',W/2,H*0.13);
      sc.shadowBlur=0;
      sc.font='13px "ZCOOL KuaiLe","STSong",serif';
      sc.fillStyle='rgba(180,130,80,0.5)';
      sc.fillText('双指可暂停 ⏸',W/2,H*0.18);
      sc.restore();
    }else{
      drawScoreBubble(score,W/2,48);
    }
  }

  if(state===STATE.MENU) drawMenu();
  if(state===STATE.OVER) drawOver();
  if(state===STATE.WIN) drawWin();
}

// ── 云朵 ──
function drawClouds(){
  sc.save();
  for(var i=0;i<clouds.length;i++){
    var cl=clouds[i];
    sc.globalAlpha=cl.alpha;
    sc.fillStyle='#FFFCF8';
    var cx=cl.x,cy=cl.y,cw=cl.w;
    // 3个圆组成云朵
    sc.beginPath();
    sc.arc(cx,cy,cw*0.22,0,Math.PI*2);sc.fill();
    sc.beginPath();
    sc.arc(cx+cw*0.2,cy-cw*0.06,cw*0.28,0,Math.PI*2);sc.fill();
    sc.beginPath();
    sc.arc(cx+cw*0.45,cy,cw*0.2,0,Math.PI*2);sc.fill();
    // 底部填充
    sc.fillRect(cx-cw*0.22,cy,cw*0.67,cw*0.12);
  }
  sc.restore();
}

// ── 远景山峦（更Q更圆润）──
function drawMountains(){
  sc.save();
  // 远山
  sc.globalAlpha=0.06;
  sc.fillStyle=CLR.water;
  sc.beginPath();
  sc.moveTo(0,H*0.55);
  sc.quadraticCurveTo(W*0.1,H*0.38,W*0.25,H*0.48);
  sc.quadraticCurveTo(W*0.35,H*0.34,W*0.5,H*0.46);
  sc.quadraticCurveTo(W*0.65,H*0.32,W*0.8,H*0.44);
  sc.quadraticCurveTo(W*0.9,H*0.36,W,H*0.5);
  sc.lineTo(W,waterY);sc.lineTo(0,waterY);
  sc.closePath();sc.fill();
  sc.restore();
}

// ── 水面（更Q更活泼）──
function drawWater(){
  sc.save();
  // 水面渐变
  var wg=sc.createLinearGradient(0,waterY,0,H);
  wg.addColorStop(0,'rgba(123,196,184,0.12)');
  wg.addColorStop(0.2,'rgba(123,196,184,0.2)');
  wg.addColorStop(0.6,'rgba(90,173,160,0.28)');
  wg.addColorStop(1,'rgba(70,150,138,0.35)');
  sc.fillStyle=wg;

  // 波浪顶边（更大更Q的波浪）
  sc.beginPath();
  sc.moveTo(0,waterY);
  for(var x=0;x<=W;x+=2){
    var wy=waterY+Math.sin(x*0.015+waveOffset*0.035)*4+Math.sin(x*0.008+waveOffset*0.02)*3;
    sc.lineTo(x,wy);
  }
  sc.lineTo(W,H);sc.lineTo(0,H);
  sc.closePath();sc.fill();

  // 水纹线（3条更明显的波纹）
  for(var row=0;row<4;row++){
    var ry=waterY+12+row*18;
    sc.strokeStyle='rgba(123,196,184,'+(0.18-row*0.03)+')';
    sc.lineWidth=1-row*0.15;
    sc.beginPath();
    for(var x=0;x<=W;x+=2){
      var ryy=ry+Math.sin(x*0.012+row*1.8+waveOffset*0.025)*4+Math.sin(x*0.006+row*0.5+waveOffset*0.015)*2;
      x===0?sc.moveTo(x,ryy):sc.lineTo(x,ryy);
    }
    sc.stroke();
  }
  sc.restore();
}

// ── 气泡 ──
function drawBubbles(){
  sc.save();
  for(var i=0;i<bubbles.length;i++){
    var b=bubbles[i];
    sc.globalAlpha=0.15+Math.sin(b.wobble)*0.05;
    sc.strokeStyle='rgba(123,196,184,0.4)';
    sc.lineWidth=0.8;
    sc.beginPath();
    sc.arc(b.x,b.y,b.r,0,Math.PI*2);
    sc.stroke();
    // 高光
    sc.fillStyle='rgba(255,255,255,0.3)';
    sc.beginPath();
    sc.arc(b.x-b.r*0.3,b.y-b.r*0.3,b.r*0.25,0,Math.PI*2);
    sc.fill();
  }
  sc.restore();
}

// ── 闪光粒子 ──
function drawSparkles(){
  sc.save();
  for(var i=0;i<sparkles.length;i++){
    var s=sparkles[i];
    sc.globalAlpha=s.alpha;
    sc.fillStyle=s.color;
    sc.beginPath();
    sc.arc(s.x,s.y,s.r*s.alpha,0,Math.PI*2);
    sc.fill();
  }
  sc.restore();
}

// ═══════════════════════════════════════════════
// 龙门门柱 - 中式Q萌风格
// ═══════════════════════════════════════════════
function drawGate(g){
  sc.save();
  var gw=g.w;
  var capH=gw*0.5;   // 斗拱高度
  var capW=gw*1.6;   // 斗拱宽度
  var capOff=(capW-gw)/2;

  // ── 上门柱 ──
  // 柱身渐变
  var pGrad=sc.createLinearGradient(g.x,0,g.x+gw,0);
  pGrad.addColorStop(0,'rgba(199,84,80,0.15)');
  pGrad.addColorStop(0.5,'rgba(199,84,80,0.22)');
  pGrad.addColorStop(1,'rgba(199,84,80,0.12)');
  sc.fillStyle=pGrad;
  roundRect(g.x,0,gw,Math.max(0,g.topH-capH),gw*0.15);
  sc.fill();

  // 柱身描边
  sc.strokeStyle='rgba(199,84,80,0.25)';
  sc.lineWidth=1.5;
  roundRect(g.x,0,gw,Math.max(0,g.topH-capH),gw*0.15);
  sc.stroke();

  // 上门柱斗拱（底部）
  drawCapDecor(g.x-capOff,g.topH-capH,capW,capH);

  // ── 下门柱 ──
  var botPillarY=g.botY+capH;
  var botPillarH=Math.max(0,waterY-botPillarY);
  sc.fillStyle=pGrad;
  roundRect(g.x,botPillarY,gw,botPillarH,gw*0.15);
  sc.fill();
  sc.strokeStyle='rgba(199,84,80,0.25)';
  sc.lineWidth=1.5;
  roundRect(g.x,botPillarY,gw,botPillarH,gw*0.15);
  sc.stroke();

  // 下门柱斗拱（顶部）
  drawCapDecor(g.x-capOff,g.botY,capW,capH);

  sc.restore();
}

// 斗拱装饰 - Q萌中式
function drawCapDecor(x,y,w,h){
  sc.save();
  // 主体
  var capGrad=sc.createLinearGradient(x,y,x,y+h);
  capGrad.addColorStop(0,'rgba(199,84,80,0.28)');
  capGrad.addColorStop(1,'rgba(199,84,80,0.18)');
  sc.fillStyle=capGrad;
  // 梯形形状
  sc.beginPath();
  var indent=w*0.08;
  sc.moveTo(x+indent,y);
  sc.lineTo(x+w-indent,y);
  sc.quadraticCurveTo(x+w+indent*2,y+h*0.5,x+w-indent*0.5,y+h);
  sc.lineTo(x+indent*0.5,y+h);
  sc.quadraticCurveTo(x-indent*2,y+h*0.5,x+indent,y);
  sc.closePath();
  sc.fill();

  // 金色描边
  sc.strokeStyle='rgba(212,160,80,0.35)';
  sc.lineWidth=1.2;
  sc.stroke();

  // 中间金线装饰
  sc.strokeStyle='rgba(212,160,80,0.25)';
  sc.lineWidth=0.8;
  sc.beginPath();
  sc.moveTo(x+w*0.25,y+h*0.3);
  sc.lineTo(x+w*0.75,y+h*0.3);
  sc.stroke();
  sc.beginPath();
  sc.moveTo(x+w*0.2,y+h*0.65);
  sc.lineTo(x+w*0.8,y+h*0.65);
  sc.stroke();

  // 小金色圆点（Q萌）
  sc.fillStyle='rgba(212,160,80,0.3)';
  sc.beginPath();
  sc.arc(x+w*0.5,y+h*0.5,w*0.04,0,Math.PI*2);
  sc.fill();

  sc.restore();
}

// ── 分数气泡 ──
function drawScoreBubble(num,cx,cy){
  sc.save();
  var txt=''+num;
  sc.font='bold 28px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  var tw=sc.measureText(txt).width;
  var pw=tw+24;
  var ph=38;

  // 气泡背景
  sc.fillStyle='rgba(255,255,255,0.85)';
  sc.shadowColor='rgba(255,154,92,0.2)';
  sc.shadowBlur=8;
  sc.beginPath();
  sc.arc(cx,cy,ph*0.55,0,Math.PI*2);
  sc.fill();
  sc.shadowBlur=0;

  // 气泡描边
  sc.strokeStyle='rgba(255,154,92,0.3)';
  sc.lineWidth=1.5;
  sc.beginPath();
  sc.arc(cx,cy,ph*0.55,0,Math.PI*2);
  sc.stroke();

  // 数字
  sc.fillStyle=CLR.orangeDark;
  sc.textAlign='center';
  sc.textBaseline='middle';
  sc.fillText(txt,cx,cy+1);
  sc.restore();
}

// ── 锦鲤绘制 ──
function drawKoi(){
  if(!koiLoaded){
    sc.save();sc.translate(koi.x,koi.y);sc.rotate(koi.rotation);
    sc.fillStyle='#FF9A5C';sc.beginPath();sc.ellipse(0,0,koi.w/2,koi.h/2,0,0,Math.PI*2);sc.fill();
    sc.restore();return;
  }

  sc.save();
  sc.translate(koi.x,koi.y);
  sc.rotate(koi.rotation);

  // 锦鲤光晕（Q萌效果）

    sc.shadowBlur=12;
  }

  var kw=koi.w,kh=koi.h;
  sc.drawImage(koiImg,-kw/2,-kh/2,kw,kh);
  sc.shadowBlur=0;
  sc.restore();
}

// ═══════════════════════════════════════════════
// 菜单画面 - Q萌升级
// ═══════════════════════════════════════════════
function drawMenu(){
  sc.save();
  // 半透明遮罩
  sc.fillStyle='rgba(255,248,240,0.65)';
  sc.fillRect(0,0,W,H);

  // 装饰波浪（底部）
  sc.globalAlpha=0.12;
  sc.fillStyle=CLR.water;
  for(var i=0;i<3;i++){
    sc.beginPath();
    var by=H*0.78+i*15;
    for(var x=0;x<=W;x+=2){
      var yy=by+Math.sin(x*0.02+Date.now()*0.001+i*2)*8;
      x===0?sc.moveTo(x,yy):sc.lineTo(x,yy);
    }
    sc.lineTo(W,H);sc.lineTo(0,H);sc.closePath();sc.fill();
  }
  sc.globalAlpha=1;

  // 标题（手绘风格图片）
  if(titleLoaded){
    var tW=Math.min(W*0.85,300);
    var tH=tW*0.316;
    // 标题下方光晕
    sc.shadowColor='rgba(255,154,92,0.15)';
    sc.shadowBlur=20;
    sc.drawImage(titleImg,W/2-tW/2,H*0.13,tW,tH);
    sc.shadowBlur=0;
  }

  // 锦鲤图（更大更Q）
  if(koiLoaded){
    var showW=Math.min(W*0.55,220);
    var showH=showW*0.542;
    var bobY=Math.sin(Date.now()*0.003)*10;
    var bobR=Math.sin(Date.now()*0.002)*0.06;
    sc.save();
    sc.translate(W/2,H*0.42+bobY);
    sc.rotate(bobR);
    // 鱼周围光晕
    sc.shadowColor='rgba(255,180,100,0.2)';
    sc.shadowBlur=15;
    sc.drawImage(koiImg,-showW/2,-showH/2,showW,showH);
    sc.shadowBlur=0;
    sc.restore();
  }

  // 小装饰泡泡（鱼周围）
  sc.save();
  var t=Date.now()*0.001;
  for(var i=0;i<5;i++){
    var bx=W/2+Math.sin(t+i*1.3)*showW*0.6;
    var by=H*0.42+Math.cos(t*0.8+i*1.7)*25-10;
    var br=2+Math.sin(t+i)*1;
    sc.globalAlpha=0.15+Math.sin(t+i)*0.05;
    sc.strokeStyle='rgba(123,196,184,0.4)';
    sc.lineWidth=0.8;
    sc.beginPath();sc.arc(bx,by,br,0,Math.PI*2);sc.stroke();
  }
  sc.restore();

  // 提示（更Q萌）
  var pulse=0.6+0.4*Math.sin(Date.now()*0.004);
  sc.save();sc.globalAlpha=pulse;
  sc.font='600 17px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  sc.fillStyle=CLR.orange;
  sc.textAlign='center';
  sc.shadowColor='rgba(255,154,92,0.3)';sc.shadowBlur=6;
  sc.fillText('轻触开始 ✨',W/2,H*0.62);
  sc.shadowBlur=0;
  sc.globalAlpha=1;
  // 双指暂停提示
  sc.font='12px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  sc.fillStyle='rgba(180,130,80,0.45)';
  sc.fillText('双指可暂停 ⏸',W/2,H*0.67);
  sc.restore();

  // 最佳记录
  if(bestScore>0){
    sc.font='13px "ZCOOL KuaiLe","PingFang SC",sans-serif';
    sc.fillStyle='rgba(180,130,80,0.55)';
    sc.textAlign='center';
    sc.fillText('最佳: '+bestScore,W/2,H*0.72);
  }

  // 品牌（更温馨）
  sc.font='12px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  sc.fillStyle='rgba(180,130,80,0.4)';
  sc.textAlign='center';
  sc.fillText('鲤·遇出品',W/2,H*0.92);

  sc.restore();
}

// ═══════════════════════════════════════════════
// 通关画面 - 锦鲤化龙
// ═══════════════════════════════════════════════
function drawWin(){
  overTimer++;
  var fadeIn=Math.min(1,overTimer/30);
  sc.save();

  // 金色渐变遮罩
  var gAlpha=fadeIn*0.92;
  sc.fillStyle='rgba(255,248,240,'+gAlpha.toFixed(2)+')';
  sc.fillRect(0,0,W,H);

  if(fadeIn<0.3){sc.restore();return;}

  // 金色光效底色
  if(fadeIn>0.5){
    var glow=sc.createRadialGradient(W/2,H*0.38,0,W/2,H*0.38,W*0.5);
    glow.addColorStop(0,'rgba(255,200,80,'+((fadeIn-0.5)*0.15).toFixed(3)+')');
    glow.addColorStop(1,'rgba(255,200,80,0)');
    sc.fillStyle=glow;
    sc.fillRect(0,0,W,H);
  }

  // 化龙金光粒子
  if(overTimer%3===0&&overTimer<120){
    for(var p=0;p<3;p++){
      sparkles.push({
        x:W/2+(Math.random()-0.5)*W*0.6,
        y:H*0.35+(Math.random()-0.5)*80,
        vx:(Math.random()-0.5)*1.5,
        vy:-0.5-Math.random()*1.5,
        r:2+Math.random()*4,
        life:30+Math.random()*20,
        maxLife:50,
        alpha:1,
        color:'#FFD700'
      });
    }
  }
  drawSparkles();

  // "通关" 大字
  var titleScale=Math.min(1,overTimer/20);
  sc.save();
  sc.translate(W/2,H*0.16);
  sc.scale(titleScale,titleScale);
  sc.font='bold 36px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  sc.fillStyle='#FF9A5C';
  sc.textAlign='center';
  sc.shadowColor='rgba(255,154,92,0.4)';sc.shadowBlur=12;
  sc.fillText('🎉 通关 🎉',0,0);
  sc.shadowBlur=0;
  sc.restore();

  // 锦鲤化龙图（用锦鲤+金光光环代替）
  if(koiLoaded){
    var showW=Math.min(W*0.55,200);
    var showH=showW*0.542;
    var floatY=Math.sin(Date.now()*0.003)*8;
    // 金色光环
    sc.save();
    sc.translate(W/2,H*0.34+floatY);
    var aura=sc.createRadialGradient(0,0,showW*0.2,0,0,showW*0.55);
    aura.addColorStop(0,'rgba(255,215,0,0.25)');
    aura.addColorStop(0.6,'rgba(255,180,50,0.1)');
    aura.addColorStop(1,'rgba(255,180,50,0)');
    sc.fillStyle=aura;
    sc.fillRect(-showW*0.55,-showW*0.55,showW*1.1,showW*1.1);
    // 锦鲤
    sc.shadowColor='rgba(255,200,80,0.5)';sc.shadowBlur=20;
    sc.drawImage(koiImg,-showW/2,-showH/2,showW,showH);
    sc.shadowBlur=0;
    sc.restore();
  }

  // 龙的暗示：头顶角（两个金色三角）
  if(koiLoaded&&overTimer>30){
    var hornAlpha=Math.min(1,(overTimer-30)/30);
    var showW2=Math.min(W*0.55,200);
    sc.save();sc.globalAlpha=hornAlpha;
    sc.translate(W/2,H*0.34+Math.sin(Date.now()*0.003)*8);
    sc.fillStyle='#FFD700';
    sc.shadowColor='rgba(255,215,0,0.6)';sc.shadowBlur=8;
    // 左角
    sc.beginPath();sc.moveTo(-showW2*0.12,-showW2*0.28);sc.lineTo(-showW2*0.22,-showW2*0.52);sc.lineTo(-showW2*0.02,-showW2*0.3);sc.closePath();sc.fill();
    // 右角
    sc.beginPath();sc.moveTo(showW2*0.12,-showW2*0.28);sc.lineTo(showW2*0.22,-showW2*0.52);sc.lineTo(showW2*0.02,-showW2*0.3);sc.closePath();sc.fill();
    sc.shadowBlur=0;
    sc.restore();
  }

  // 三十六关
  sc.font='18px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  sc.fillStyle='#D4860A';
  sc.textAlign='center';
  sc.fillText('跃过 '+WIN_SCORE+' 关',W/2,H*0.52);

  // 通关口彩
  var winIdx=Math.abs(Math.floor(Date.now()/86400000))%WIN_FORTUNES.length;
  sc.save();
  sc.font='600 17px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  sc.fillStyle=CLR.orangeDark;
  sc.textAlign='center';
  sc.shadowColor='rgba(255,154,92,0.3)';sc.shadowBlur=8;
  sc.fillText(WIN_FORTUNES[winIdx],W/2,H*0.59);
  sc.shadowBlur=0;
  sc.restore();

  // 最佳记录
  sc.font='13px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  sc.fillStyle='rgba(180,130,80,0.55)';
  sc.textAlign='center';
  sc.fillText('最佳: '+bestScore,W/2,H*0.65);

  // 提示长按保存
  if(overTimer>50){
    // 显示分享图（长按保存）
    if(winShareImg&&!document.getElementById('win-share-img').src){
      var simg=document.getElementById('win-share-img');
      simg.src=winShareImg;
      simg.style.display='block';
    }
    var pAlpha=0.5+0.3*Math.sin(Date.now()*0.004);
    sc.save();sc.globalAlpha=pAlpha;
    sc.font='13px "ZCOOL KuaiLe","PingFang SC",sans-serif';
    sc.fillStyle='rgba(180,130,80,0.6)';
    sc.textAlign='center';
    sc.fillText('长按图片保存分享 ✨',W/2,H*0.72);
    sc.globalAlpha=1;sc.restore();
  }

  // 再来按钮
  if(overTimer>40){
    var ob=document.getElementById('overBtns');
    var b1=document.getElementById('btn1');
    var b2=document.getElementById('btn2');
    ob.style.display='block';
    b1.style.left=(W/2-80)+'px';
    b1.style.top=(H*0.78-20)+'px';
    b1.textContent='再来一局';
    b2.style.left=(W/2-80)+'px';
    b2.style.top=(H*0.86-18)+'px';
    b2.textContent='看看今日卦象';
  }

  sc.restore();
}

// ── 通关分享图生成 ──
function generateWinShareImage(){
  var sw=600,sh=800;
  var cv=document.createElement('canvas');
  cv.width=sw;cv.height=sh;
  var c=cv.getContext('2d');

  // 背景渐变
  var bg=c.createLinearGradient(0,0,0,sh);
  bg.addColorStop(0,'#FFF8F0');bg.addColorStop(0.5,'#FFF3E8');bg.addColorStop(1,'#FFECD2');
  c.fillStyle=bg;c.fillRect(0,0,sw,sh);

  // 金色光晕
  var g2=c.createRadialGradient(sw/2,sh*0.32,0,sw/2,sh*0.32,sw*0.45);
  g2.addColorStop(0,'rgba(255,200,80,0.18)');g2.addColorStop(1,'rgba(255,200,80,0)');
  c.fillStyle=g2;c.fillRect(0,0,sw,sh);

  // 底部水波
  c.save();c.globalAlpha=0.15;
  for(var w=0;w<3;w++){
    c.fillStyle=w===0?'#7BC4B8':w===1?'#FFD700':'#FF9A5C';
    c.beginPath();
    var wby=sh*0.82+w*8;
    for(var x=0;x<=sw;x+=2){
      var yy=wby+Math.sin(x*0.015+w*1.5)*8;
      x===0?c.moveTo(x,yy):c.lineTo(x,yy);
    }
    c.lineTo(sw,sh);c.lineTo(0,sh);c.closePath();c.fill();
  }
  c.restore();

  // 锦鲤图
  if(koiLoaded){
    var kw=220,kh=kw*0.542;
    c.save();
    c.shadowColor='rgba(255,200,80,0.4)';c.shadowBlur=20;
    c.drawImage(koiImg,sw/2-kw/2,sh*0.28-kh/2,kw,kh);
    c.shadowBlur=0;
    // 龙角
    c.fillStyle='#FFD700';
    c.shadowColor='rgba(255,215,0,0.6)';c.shadowBlur=8;
    c.beginPath();c.moveTo(sw/2-kw*0.12,sh*0.28-kh*0.55);c.lineTo(sw/2-kw*0.22,sh*0.28-kh*0.95);c.lineTo(sw/2-kw*0.02,sh*0.28-kh*0.58);c.closePath();c.fill();
    c.beginPath();c.moveTo(sw/2+kw*0.12,sh*0.28-kh*0.55);c.lineTo(sw/2+kw*0.22,sh*0.28-kh*0.95);c.lineTo(sw/2+kw*0.02,sh*0.28-kh*0.58);c.closePath();c.fill();
    c.shadowBlur=0;
    c.restore();
  }

  // 通关标题
  c.font='bold 40px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  c.fillStyle='#FF9A5C';
  c.textAlign='center';
  c.shadowColor='rgba(255,154,92,0.3)';c.shadowBlur=10;
  c.fillText('🎉 通关 🎉',sw/2,sh*0.08);
  c.shadowBlur=0;

  // 跃过36关
  c.font='22px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  c.fillStyle='#D4860A';
  c.fillText('跃过 '+WIN_SCORE+' 关',sw/2,sh*0.49);

  // 通关口彩
  var winIdx=Math.abs(Math.floor(Date.now()/86400000))%WIN_FORTUNES.length;
  c.font='600 20px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  c.fillStyle='#8B5E3C';
  c.shadowColor='rgba(255,154,92,0.2)';c.shadowBlur=6;
  c.fillText(WIN_FORTUNES[winIdx],sw/2,sh*0.55);
  c.shadowBlur=0;

  // 分割线
  c.strokeStyle='rgba(255,154,92,0.2)';c.lineWidth=1;
  c.beginPath();c.moveTo(sw*0.2,sh*0.60);c.lineTo(sw*0.8,sh*0.60);c.stroke();

  // 品牌
  c.font='14px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  c.fillStyle='rgba(180,130,80,0.5)';
  c.fillText('锦鲤跃龙门 · 鲤·遇出品',sw/2,sh*0.66);

  // 底部口号
  c.font='12px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  c.fillStyle='rgba(180,130,80,0.35)';
  c.fillText('跃过去，就是龙门',sw/2,sh*0.70);

  // 圆角裁剪（深色底兼容微信）
  var cr=30;
  var finalCv=document.createElement('canvas');
  finalCv.width=sw;finalCv.height=sh;
  var fc=finalCv.getContext('2d');
  // 深色底
  fc.fillStyle='#1C1C1E';
  fc.fillRect(0,0,sw,sh);
  // 圆角裁剪
  fc.save();
  fc.beginPath();
  fc.moveTo(cr,0);fc.lineTo(sw-cr,0);fc.quadraticCurveTo(sw,0,sw,cr);
  fc.lineTo(sw,sh-cr);fc.quadraticCurveTo(sw,sh,sw-cr,sh);
  fc.lineTo(cr,sh);fc.quadraticCurveTo(0,sh,0,sh-cr);
  fc.lineTo(0,cr);fc.quadraticCurveTo(0,0,cr,0);
  fc.closePath();fc.clip();
  fc.drawImage(cv,0,0);
  fc.restore();

  winShareImg=finalCv.toDataURL('image/jpeg',0.92);
}

// ═══════════════════════════════════════════════
// 结算画面 - Q萌升级
// ═══════════════════════════════════════════════
function drawOver(){
  overTimer++;
  var fadeIn=Math.min(1,overTimer/20);
  sc.save();

  // 渐入遮罩（更柔和）
  sc.fillStyle='rgba(255,248,240,'+(fadeIn*0.88).toFixed(2)+')';
  sc.fillRect(0,0,W,H);

  if(fadeIn<0.5){sc.restore();return;}

  // 分数（大号Q萌气泡）
  drawScoreBubble(score,W/2,H*0.24);

  // "跃过龙门" 标签
  sc.font='15px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  sc.fillStyle='rgba(180,130,80,0.7)';
  sc.textAlign='center';
  sc.fillText('跃过龙门',W/2,H*0.30);

  // 口彩签语（加光晕）
  var signIdx=Math.abs(Math.floor(Date.now()/86400000+score*7))%SIGN_TEXTS.length;
  sc.save();
  sc.font='16px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  sc.fillStyle=CLR.orangeDark;
  sc.textAlign='center';
  sc.shadowColor='rgba(255,154,92,0.25)';sc.shadowBlur=8;
  sc.fillText(SIGN_TEXTS[signIdx],W/2,H*0.43);
  sc.shadowBlur=0;
  sc.restore();

  // 最佳
  sc.font='13px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  sc.fillStyle='rgba(180,130,80,0.55)';
  sc.textAlign='center';
  sc.fillText('最佳: '+bestScore,W/2,H*0.52);

  // 按钮位置
  if(overTimer>30){
    var ob=document.getElementById('overBtns');
    var b1=document.getElementById('btn1');
    var b2=document.getElementById('btn2');
    ob.style.display='block';
    b1.style.left=(W/2-80)+'px';
    b1.style.top=(H*0.58-20)+'px';
    b2.style.left=(W/2-80)+'px';
    b2.style.top=(H*0.66-18)+'px';
  }

  // 品牌
  sc.font='12px "ZCOOL KuaiLe","PingFang SC",sans-serif';
  sc.fillStyle='rgba(180,130,80,0.4)';
  sc.textAlign='center';
  sc.fillText('鲤·遇出品',W/2,H*0.92);

  sc.restore();
}

function roundRect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  sc.beginPath();
  sc.moveTo(x+r,y);sc.lineTo(x+w-r,y);sc.quadraticCurveTo(x+w,y,x+w,y+r);
  sc.lineTo(x+w,y+h-r);sc.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  sc.lineTo(x+r,y+h);sc.quadraticCurveTo(x,y+h,x,y+h-r);
  sc.lineTo(x,y+r);sc.quadraticCurveTo(x,y,x+r,y);
  sc.closePath();
}

// ── 游戏主循环 ──
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

try{loop();}catch(e){document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#FFF8F0;color:#4A3828;font-size:14px;padding:20px;font-family:sans-serif">启动错误: <br><small style="color:#B8A898;word-break:break-all">'+(e.stack||e.message)+'</small></div>';}

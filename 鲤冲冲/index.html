var offCanvas, offCtx;

koiImg.onload = function() {
  koiLoaded = true;

  offCanvas.height = koiImg.height;

};

// ── 初始化装饰 ──
function initDecorations() {
  anim.bubbles = [];
  for (var i = 0; i < 12; i++) {
    anim.bubbles.push({
      x: Math.random() * W,
      y: H * 0.5 + Math.random() * H * 0.45,
      r: 3 + Math.random() * 5,
      speed: 0.3 + Math.random() * 0.4,
      wobble: Math.random() * Math.PI * 2,
      alpha: 0.15 + Math.random() * 0.1
    });
  }
  
  anim.lotusPos = [];
  for (var i = 0; i < 3; i++) {
    anim.lotusPos.push({
      x: Math.random() * W,
      y: H * 0.55 + Math.random() * H * 0.3,
      size: 30 + Math.random() * 20,
      phase: Math.random() * Math.PI * 2
    });
  }
  
  anim.ripple = [];
}

// ── 加载数据 ──
function loadData() {
  try {
    var saved = localStorage.getItem('lichong_data_v2');
    if (saved) {
      userData = JSON.parse(saved);
    }
  } catch (e) {}
  
  if (userData.fish.length === 0) {
    userData.fish.push(createRandomFish('红鲤', 'common'));
  }
}

// ── 保存数据 ──
function saveData() {
  try {
    localStorage.setItem('lichong_data_v2', JSON.stringify(userData));
  } catch (e) {}
}

// ── 创建锦鲤 ──
function createRandomFish(name, rarity) {
  var colors = {
    'common': { main: '#EF4444', light: '#FCA5A5', tint: null },
    'rare': { main: '#FBBF24', light: '#FDE68A', tint: 'rgba(255,215,0,0.35)' },
    'epic': { main: '#1F2937', light: '#6B7280', tint: 'rgba(20,30,80,0.5)' },
    'legend': { main: '#8B5CF6', light: '#C4B5FD', tint: 'rgba(128,0,255,0.35)' }
  };
  
  var c = colors[rarity] || colors['common'];
  
  var total = 10;
  var spd = Math.floor(Math.random() * (total - 2)) + 1;
  var luk = Math.floor(Math.random() * (total - spd - 1)) + 1;
  var sta = total - spd - luk;
  
  return {
    name: name || FISH_TYPES[0].name,
    rarity: rarity || 'common',
    mainColor: c.main,
    lightColor: c.light,
    tintColor: c.tint,
    speed: spd,
    luck: luk,
    stamina: sta,
    level: 1,
    exp: 0,
    expToNext: 10
  };
}

// ── 创建AI对手 ──
function createOpponent() {
  var rand = Math.random();
  var cumulative = 0;
  var opponent = null;
  
  for (var i = 0; i < FISH_TYPES.length; i++) {
    cumulative += FISH_TYPES[i].prob;
    if (rand < cumulative) {
      opponent = createRandomFish(FISH_TYPES[i].name, FISH_TYPES[i].rarity);
      break;
    }
  }
  if (!opponent) opponent = createRandomFish('红鲤', 'common');
  
  var aiType = Math.random();
  if (aiType < 0.33) opponent.speed += 2;
  else if (aiType < 0.66) opponent.stamina += 2;
  else opponent.luck += 2;
  
  var total = opponent.speed + opponent.luck + opponent.stamina;
  if (total > 15) {
    var scale = 15 / total;
    opponent.speed = Math.floor(opponent.speed * scale);
    opponent.luck = Math.floor(opponent.luck * scale);
    opponent.stamina = 15 - opponent.speed - opponent.luck;
  }
  
  opponent.isAI = true;
  opponent.tintColor = "rgba(255,80,20,0.4)";
  opponent.aiType = aiType < 0.33 ? 'aggressive' : (aiType < 0.66 ? 'endurance' : 'gambler');
  
  return opponent;
}

// ── 抽鱼 ──
function drawFish() {

    return;
  }
  
  userData.fishScales -= 10;
  
  var rand = Math.random();
  var cumulative = 0;
  var newFish = null;
  
  for (var i = 0; i < FISH_TYPES.length; i++) {
    cumulative += FISH_TYPES[i].prob;
    if (rand < cumulative) {
      newFish = createRandomFish(FISH_TYPES[i].name, FISH_TYPES[i].rarity);
      break;
    }
  }
  if (!newFish) newFish = createRandomFish('红鲤', 'common');
  
  userData.fish.push(newFish);
  saveData();
  
  anim.drawResult = newFish;
  anim.drawAnimFrame = 0;
  anim.drawPhase = 0;
  state = STATE.DRAW;
}

// ── 绘制锦鲤（PNG+Canvas调色）──
function drawKoi(x, y, size, fish, dir, frame) {
  dir = dir || 1;
  frame = frame || 0;
  
  if (!koiLoaded) return;
  
  sc.save();
  sc.translate(x, y);
  if (dir < 0) sc.scale(-1, 1);
  
  var scale = size / 240;
  var kw = koiImg.width * scale;
  var kh = koiImg.height * scale;
  
  var bob = Math.sin(frame * 0.05) * 3;
  
  if (fish && fish.tintColor) {
    offCtx.clearRect(0, 0, offCanvas.width, offCanvas.height);
    offCtx.drawImage(koiImg, 0, 0);
    offCtx.globalCompositeOperation = 'source-atop';
    offCtx.fillStyle = fish.tintColor;
    offCtx.fillRect(0, 0, offCanvas.width, offCanvas.height);
    offCtx.globalCompositeOperation = 'source-over';
    sc.drawImage(offCanvas, -kw/2, -kh/2 + bob, kw, kh);
  } else {
    sc.drawImage(koiImg, -kw/2, -kh/2 + bob, kw, kh);
  }
  
  sc.restore();
}

// ── 绘制锦鲤图标 ──
function drawKoiIcon(x, y, size, color, lightColor, tintColor) {
  if (!koiLoaded) {
    sc.save();
    sc.translate(x, y);
    var s = size / 50;
    sc.beginPath();
    sc.ellipse(0, 0, 25*s, 15*s, 0, 0, Math.PI * 2);
    var grad = sc.createRadialGradient(-5*s, -5*s, 0, 0, 0, 25*s);
    grad.addColorStop(0, lightColor || '#FFB74D');
    grad.addColorStop(1, color || '#F97316');
    sc.fillStyle = grad;
    sc.fill();
    sc.beginPath();
    sc.arc(10*s, -2*s, 5*s, 0, Math.PI * 2);
    sc.fillStyle = '#FFF';
    sc.fill();
    sc.beginPath();
    sc.arc(11*s, -2*s, 2*s, 0, Math.PI * 2);
    sc.fillStyle = '#1F2937';
    sc.fill();
    sc.restore();
    return;
  }
  
  sc.save();
  sc.translate(x, y);
  
  var scale = size / 240;
  var kw = koiImg.width * scale;
  var kh = koiImg.height * scale;
  
  if (tintColor) {
    offCtx.clearRect(0, 0, offCanvas.width, offCanvas.height);
    offCtx.drawImage(koiImg, 0, 0);
    offCtx.globalCompositeOperation = 'source-atop';
    offCtx.fillStyle = tintColor;
    offCtx.fillRect(0, 0, offCanvas.width, offCanvas.height);
    offCtx.globalCompositeOperation = 'source-over';
    sc.drawImage(offCanvas, -kw/2, -kh/2, kw, kh);
  } else {
    sc.drawImage(koiImg, -kw/2, -kh/2, kw, kh);
  }
  
  sc.restore();
}

// ── 绘制水波背景（温暖小世界）──
function drawWaterBg() {
  var waterY = H * 0.42;
  
  sc.fillStyle = CLR.water;
  sc.globalAlpha = 0.35;
  sc.fillRect(0, waterY, W, H - waterY);
  sc.globalAlpha = 1;
  
  sc.strokeStyle = CLR.waterDeep;
  sc.lineWidth = 1.5;
  sc.globalAlpha = 0.2;
  for (var i = 0; i < 6; i++) {
    sc.beginPath();
    for (var x = 0; x <= W; x += 5) {
      var y = waterY + 20 + i * 35 + Math.sin((x + anim.waveOffset + i * 25) * 0.015) * 6;
      if (x === 0) sc.moveTo(x, y);
      else sc.lineTo(x, y);
    }
    sc.stroke();
  }
  sc.globalAlpha = 1;
  
  for (var b of anim.bubbles) {
    sc.beginPath();
    sc.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    sc.fillStyle = CLR.waterLight;
    sc.globalAlpha = b.alpha;
    sc.fill();
  }
  sc.globalAlpha = 1;
}

// ── 绘制荷叶装饰 ──
function drawLotus() {
  for (var lotus of anim.lotusPos) {
    var sway = Math.sin(Date.now() * 0.001 + lotus.phase) * 3;
    
    sc.save();
    sc.translate(lotus.x + sway, lotus.y);
    sc.globalAlpha = 0.25;
    
    sc.beginPath();
    sc.ellipse(0, 0, lotus.size, lotus.size * 0.6, 0, 0, Math.PI * 2);
    sc.fillStyle = '#4CAF50';
    sc.fill();
    
    sc.beginPath();
    sc.ellipse(-lotus.size * 0.3, -lotus.size * 0.1, lotus.size * 0.4, lotus.size * 0.25, -0.3, 0, Math.PI * 2);
    sc.fill();
    
    sc.globalAlpha = 1;
    sc.restore();
  }
}

// ── 添加飘字 ──
function addFloatingText(text, x, y, color) {
  anim.floatingTexts.push({
    text: text,
    x: x,
    y: y,
    color: color || CLR.orange,
    alpha: 1,
    vy: -2.5,
    scale: 1.2
  });
}

// ── 更新飘字 ──
function updateFloatingTexts() {
  for (var i = anim.floatingTexts.length - 1; i >= 0; i--) {
    var ft = anim.floatingTexts[i];
    ft.y += ft.vy;
    ft.alpha -= 0.02;
    ft.scale *= 0.98;
    if (ft.alpha <= 0) {
      anim.floatingTexts.splice(i, 1);
    }
  }
}

// ── 绘制飘字 ──
function drawFloatingTexts() {
  for (var ft of anim.floatingTexts) {
    sc.globalAlpha = ft.alpha;
    sc.fillStyle = ft.color;
    sc.font = 'bold ' + (20 * ft.scale) + 'px ' + FONT_ZK;
    sc.textAlign = 'center';
    sc.fillText(ft.text, ft.x + anim.shakeX, ft.y);
  }
  sc.globalAlpha = 1;
}

// ── 绘制卡片（圆角规范）──
function drawCard(x, y, w, h, radius, shadow) {
  radius = radius || RADIUS.lg;
  shadow = shadow !== false;
  
  if (shadow) {
    sc.fillStyle = CLR.shadow;
    sc.beginPath();
    sc.roundRect(x + 2, y + 2, w, h, radius);
    sc.fill();
  }
  
  sc.fillStyle = CLR.card;
  sc.beginPath();
  sc.roundRect(x, y, w, h, radius);
  sc.fill();
}

// ── 绘制按钮 ──
function drawBtn(x, y, w, h, text, color, shadow) {
  shadow = shadow !== false;
  
  if (shadow) {
    sc.fillStyle = CLR.shadowBrand;
    sc.beginPath();
    sc.roundRect(x + 2, y + 2, w, h, RADIUS.md);
    sc.fill();
  }
  
  sc.fillStyle = color || CLR.orange;
  sc.beginPath();
  sc.roundRect(x, y, w, h, RADIUS.md);
  sc.fill();
  
  sc.fillStyle = '#FFF';
  sc.font = 'bold 16px ' + FONT_ZK;
  sc.textAlign = 'center';
  sc.textBaseline = 'middle';
  sc.fillText(text, x + w/2, y + h/2);
  sc.textBaseline = 'alphabetic';
}

// ── 绘制稀有度标签 ──
function drawRarityTag(x, y, rarity) {
  var cfg = RARITY_COLORS[rarity] || RARITY_COLORS.common;
  var text = RARITY_LABELS[rarity] || '普通';
  
  sc.font = '11px ' + FONT_ZK;
  var tw = sc.measureText(text).width;
  
  sc.fillStyle = cfg.bg;
  sc.beginPath();
  sc.roundRect(x, y, tw + 12, 22, 11);
  sc.fill();
  
  sc.fillStyle = cfg.text;
  sc.textAlign = 'center';
  sc.fillText(text, x + (tw + 12)/2, y + 15);
}

// ── 绘制属性弧形 ──
function drawAttrArc(x, y, r, value, maxVal, color, label) {
  var startAngle = Math.PI * 0.75;
  var endAngle = Math.PI * 2.25;
  var progress = Math.min(value / maxVal, 1);
  
  sc.beginPath();
  sc.arc(x, y, r, startAngle, endAngle);
  sc.strokeStyle = '#E5E7EB';
  sc.lineWidth = 6;
  sc.lineCap = 'round';
  sc.stroke();
  
  sc.beginPath();
  sc.arc(x, y, r, startAngle, startAngle + (endAngle - startAngle) * progress);
  sc.strokeStyle = color;
  sc.lineWidth = 6;
  sc.stroke();
  
  sc.fillStyle = CLR.text;
  sc.font = 'bold 14px ' + FONT_ZK;
  sc.textAlign = 'center';
  sc.fillText(value, x, y + 5);
  
  sc.fillStyle = CLR.textMuted;
  sc.font = '10px ' + FONT_ZK;
  sc.fillText(label, x, y + r + 14);
}

  sc.fillStyle = '#FFF';
  sc.font = 'bold 22px ' + FONT_ZK;
  sc.textAlign = 'center';
  sc.fillText('锦鲤赐福', W/2, 36);
  
  sc.fillStyle = 'rgba(255,255,255,0.3)';
  sc.beginPath();
  sc.arc(24, 28, 18, 0, Math.PI * 2);
  sc.fill();
  sc.fillStyle = '#FFF';
  sc.font = '18px sans-serif';
  sc.fillText('←', 24, 34);
  
  buttons = [{ x: 6, y: 10, w: 36, h: 36, action: 'back' }];
  
  var cardY = headerH + 24;
  var cardH = H - cardY - 140;
  
  drawCard(20, cardY, W - 40, cardH, RADIUS.xl);
  
  var phase = anim.drawPhase;
  var frame = anim.drawAnimFrame;
  
  if (phase === 0) {
    sc.fillStyle = CLR.text;
    sc.font = '16px ' + FONT_ZK;
    sc.textAlign = 'center';
    sc.fillText('锦鲤正在赐福中...', W/2, cardY + cardH/2);
    
    var lightAlpha = 0.3 + Math.sin(frame * 0.1) * 0.2;
    sc.fillStyle = 'rgba(139,92,246,' + lightAlpha + ')';
    sc.beginPath();
    sc.arc(W/2, cardY + cardH/2 - 40, 80 + Math.sin(frame * 0.05) * 10, 0, Math.PI * 2);
    sc.fill();
    
    anim.drawAnimFrame++;
    if (anim.drawAnimFrame > 60) {
      anim.drawPhase = 1;
      anim.drawAnimFrame = 0;
    }
  } else if (phase === 1) {
    var fish = anim.drawResult;
    
    sc.fillStyle = 'rgba(139,92,246,0.15)';
    sc.beginPath();
    sc.arc(W/2, cardY + cardH/2 - 30, 90, 0, Math.PI * 2);
    sc.fill();
    
    var fishSize = 100 + anim.drawAnimFrame * 0.5;
    fishSize = Math.min(fishSize, 120);
    
    var jumpY = cardY + cardH/2 - 30 - (anim.drawAnimFrame * 2);
    jumpY = Math.max(jumpY, cardY + cardH/2 - 80);
    
    drawKoi(W/2, jumpY, fishSize, fish, 1, anim.drawAnimFrame);
    
    anim.drawAnimFrame++;
    if (anim.drawAnimFrame > 40) {
      anim.drawPhase = 2;
      anim.drawAnimFrame = 0;
    }
  } else {
    var fish = anim.drawResult;
    
    sc.fillStyle = 'rgba(139,92,246,0.1)';
    sc.beginPath();
    sc.arc(W/2, cardY + cardH/2 - 50, 100, 0, Math.PI * 2);
    sc.fill();
    
    drawKoi(W/2, cardY + cardH/2 - 50, 120, fish, 1, Date.now() * 0.1);
    
    sc.fillStyle = CLR.text;
    sc.font = 'bold 20px ' + FONT_ZK;
    sc.textAlign = 'center';
    sc.fillText(fish.name, W/2, cardY + cardH/2 + 50);
    
    drawRarityTag(W/2 - 30, cardY + cardH/2 + 58, fish.rarity);
    
    var attrY = cardY + cardH/2 + 90;
    var attrGap = 70;
    
    sc.fillStyle = '#EF4444';
    sc.font = 'bold 14px ' + FONT_ZK;
    sc.fillText('速:' + fish.speed, W/2 - attrGap, attrY);
    
    sc.fillStyle = '#8B5CF6';
    sc.fillText('运:' + fish.luck, W/2, attrY);
    
    sc.fillStyle = '#3B82F6';
    sc.fillText('耐:' + fish.stamina, W/2 + attrGap, attrY);
  }
  
  if (phase === 2) {
    var btnY = H - 90;
    var btnW = Math.min(180, W - 48);
    var btnX = (W - btnW) / 2;
    
    drawBtn(btnX, btnY, btnW, 52, '太好了！', CLR.purple);
    buttons.push({ x: btnX, y: btnY, w: btnW, h: 52, action: 'confirmDraw' });
  }
  
  drawFloatingTexts();
}

  sc.globalAlpha = 0.95;
  sc.fillRect(0, 0, W, headerH);
  sc.globalAlpha = 1;
  
  sc.fillStyle = '#FFF';
  sc.font = 'bold 22px ' + FONT_ZK;
  sc.textAlign = 'center';
  sc.fillText('锦鲤谱', W/2, 36);
  
  sc.fillStyle = 'rgba(255,255,255,0.3)';
  sc.beginPath();
  sc.arc(24, 28, 18, 0, Math.PI * 2);
  sc.fill();
  sc.fillStyle = '#FFF';
  sc.font = '18px sans-serif';
  sc.fillText('←', 24, 34);
  
  buttons = [{ x: 6, y: 10, w: 36, h: 36, action: 'back' }];
  
  var collected = userData.fish.length;
  var total = 4;
  
  var progressY = headerH + 16;
  var progressW = W - 40;
  
  drawCard(20, progressY, progressW, 50, RADIUS.lg);
  
  sc.fillStyle = CLR.text;
  sc.font = '14px ' + FONT_ZK;
  sc.textAlign = 'left';
  sc.fillText('收集进度', 32, progressY + 22);
  
  sc.fillStyle = '#E5E7EB';
  sc.beginPath();
  sc.roundRect(32, progressY + 32, progressW - 64, 8, 4);
  sc.fill();
  
  sc.fillStyle = CLR.success;
  sc.beginPath();
  sc.roundRect(32, progressY + 32, (progressW - 64) * (collected / total), 8, 4);

  sc.fillStyle = CLR.text;
  sc.font = 'bold 14px ' + FONT_ZK;
  sc.textAlign = 'right';

  var gridY = progressY + 70;
  var cardW = (W - 56) / 2;
  var cardH = 140;
  var cardGap = 12;

  for (var i = 0; i < FISH_TYPES.length; i++) {
    var ft = FISH_TYPES[i];

  drawWaterBg();
  
  var headerH = 56;

  sc.globalAlpha = 1;
  
  sc.fillStyle = '#FFF';
  sc.font = 'bold 22px ' + FONT_ZK;
  sc.textAlign = 'center';

  var cardH = H - cardY - 120;

  sc.textAlign = 'center';
  sc.fillText(fortune, W/2, cardY + 50);
  
  drawKoi(W/2, cardY + 130, 100, currentFish, 1, Date.now() * 0.1);
  
  sc.fillStyle = CLR.text;
  sc.font = '16px ' + FONT_ZK;
  sc.textAlign = 'center';
  sc.fillText(currentFish.name + ' vs ' + opponentFish.name, W/2, cardY + 200);
  
  sc.fillStyle = CLR.textLight;
  sc.font = '14px ' + FONT_ZK;
  sc.fillText('你的进度: ' + Math.round(race.playerProgress * 100) + '%', W/2, cardY + 230);
  sc.fillText('对手进度: ' + Math.round(race.opponentProgress * 100) + '%', W/2, cardY + 252);
  
  var reward = anim._resultReward;
  sc.fillStyle = CLR.warning;
  sc.font = 'bold 18px ' + FONT_ZK;

  var btnW = Math.min(160, W - 48);
  var btnX = (W - btnW) / 2;

}

// ── 更新赛跑逻辑 ──
function updateRace(dt) {
  if (race.finished || race.paused) return;
  
  race.raceTime += dt;
  
  var baseSpeed = currentFish.speed * 0.001;
  var opponentBaseSpeed = opponentFish.speed * 0.0009;
  
  race.playerDist += baseSpeed * dt;
  race.opponentDist += opponentBaseSpeed * dt;
  
  race.playerProgress = Math.min(race.playerDist / race.TRACK_LEN, 1);
  race.opponentProgress = Math.min(race.opponentDist / race.TRACK_LEN, 1);
  
  if (race.playerProgress >= 1 && race.opponentProgress >= 1) {
    race.finished = true;
    race.winner = race.playerProgress > race.opponentProgress ? 'player' : 'opponent';
    state = STATE.RESULT;
  } else if (race.playerProgress >= 1) {
    race.finished = true;
    race.winner = 'player';
    state = STATE.RESULT;
  } else if (race.opponentProgress >= 1) {
    race.finished = true;
    race.winner = 'opponent';
    state = STATE.RESULT;
  }
}

// ── 执行策略 ──
function executeStrategy(type, cost) {
  if (race.playerStamina < cost) {
    addFloatingText('耐力不足！', W/2, H/2, CLR.danger);
    return;
  }
  
  race.playerStamina -= cost;
  
  var boost = 0;
  var particleColor = CLR.orange;
  
  switch(type) {
    case 'sprint':
      boost = currentFish.speed * 0.015;
      race.playerBoost += boost;
      particleColor = CLR.orange;
      addFloatingText('冲！', W/2, H/2 - 50, CLR.orange);
      break;
    case 'steady':
      boost = currentFish.speed * 0.008;
      race.playerBoost += boost;
      particleColor = CLR.waterDeep;
      addFloatingText('稳', W/2, H/2 - 50, CLR.waterDeep);
      break;
    case 'burst':
      boost = currentFish.luck * 0.02 * (Math.random() + 0.5);
      race.playerBoost += boost;
      particleColor = CLR.purple;
      addFloatingText('爆！', W/2, H/2 - 50, CLR.purple);
      break;
  }
  
  race.playerDist += boost;
  
  race.nextStrategyIdx++;
}

// ── 点击处理 ──
function handleClick(x, y) {
  for (var btn of buttons) {
    if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
      handleAction(btn.action, btn);
      return;
    }
  }
}

function handleAction(action, btn) {
  switch(action) {
    case 'select':
      prevState = STATE.MENU;
      state = STATE.SELECT_FISH;
      selectedFishIndex = userData.fish.length > 0 ? 0 : -1;
      break;
    case 'feed':
      prevState = STATE.MENU;
      state = STATE.FEED;
      break;
    case 'draw':
      prevState = STATE.MENU;
      drawFish();
      break;
    case 'guide':
      prevState = STATE.MENU;
      state = STATE.GUIDE;
      break;
    case 'back':
      state = prevState;
      break;
    case 'startRace':
      if (selectedFishIndex >= 0) {
        currentFish = userData.fish[selectedFishIndex];
        opponentFish = createOpponent();
        race.playerDist = 0;
        race.opponentDist = 0;
        race.playerProgress = 0;
        race.opponentProgress = 0;
        race.playerStamina = 100;
        race.finished = false;
        race.winner = null;
        race.nextStrategyIdx = 0;
        anim._resultFortune = null;
        state = STATE.RACE;
      }
      break;
    case 'quitRace':
      state = STATE.SELECT_FISH;
      break;
    case 'strategy':
      if (btn.cost <= race.playerStamina) {
        executeStrategy(btn.strategy, btn.cost);
      }
      break;
    case 'feedFish':
      if (userData.feed >= 1) {
        userData.feed -= 1;
        userData.fish[0].exp += 5;
        if (userData.fish[0].exp >= userData.fish[0].expToNext) {
          userData.fish[0].level++;
          userData.fish[0].exp = 0;
          userData.fish[0].expToNext = Math.floor(userData.fish[0].expToNext * 1.5);
          userData.fish[0].speed += 1;
          userData.fish[0].luck += 1;
          userData.fish[0].stamina += 1;
          addFloatingText('升级！', W/2, H/2, CLR.success);
        } else {
          addFloatingText('+5经验', W/2, H/2, CLR.success);
        }
        saveData();
      }
      break;
    case 'buyFeed':
      if (userData.fishScales >= 5) {
        userData.fishScales -= 5;
        userData.feed += 3;
        saveData();
        addFloatingText('+3饲料', W/2, H/2, CLR.warning);
      } else {
        addFloatingText('鱼鳞不足！', W/2, H/2, CLR.danger);
      }
      break;
    case 'confirmDraw':
      state = STATE.MENU;
      break;
    case 'toMenu':
      state = STATE.MENU;
      break;
  }
}

// ── 触摸事件 ──
function getTouchPos(e) {
  var touch = e.touches ? e.touches[0] : e;
  var rect = c.getBoundingClientRect();
  return {
    x: touch.clientX - rect.left,
    y: touch.clientY - rect.top
  };
}

c.addEventListener('click', function(e) {
  var pos = getTouchPos(e);
  handleClick(pos.x, pos.y);
});

c.addEventListener('touchstart', function(e) {
  e.preventDefault();
  var pos = getTouchPos(e);
  handleClick(pos.x, pos.y);
});

// ── 主循环 ──
var lastTime = 0;

function loop(time) {
  var dt = time - lastTime;
  lastTime = time;
  
  anim.waveOffset += 0.5;
  
  for (var b of anim.bubbles) {
    b.y -= b.speed;
    b.x += Math.sin(b.wobble + time * 0.001) * 0.3;
    if (b.y < H * 0.4) {
      b.y = H * 0.9;
      b.x = Math.random() * W;
    }
  }
  
  updateFloatingTexts();
  
  if (state === STATE.RACE) {
    updateRace(dt);
  }
  
  switch(state) {
    case STATE.MENU:
      drawMenu();
      break;
    case STATE.SELECT_FISH:
      drawSelectFish();
      break;
    case STATE.RACE:
      drawRace();
      break;
    case STATE.DRAW:
      drawGacha();
      break;
    case STATE.FEED:
      drawFeed();
      break;
    case STATE.GUIDE:
      drawGuide();
      break;
    case STATE.RESULT:
      drawResult();
      break;
  }
  
  requestAnimationFrame(loop);
}

// ── 初始化 ──
initDecorations();
loadData();
requestAnimationFrame(loop);
</script>

// ── 初始化气泡 ──
function initBubbles() {
  anim.bubbles = [];
  for (var i = 0; i < 15; i++) {
    anim.bubbles.push({
      x: Math.random() * W,
      y: H * 0.5 + Math.random() * H * 0.4,
      r: 3 + Math.random() * 6,
      speed: 0.3 + Math.random() * 0.5,
      wobble: Math.random() * Math.PI * 2
    });
  }
}

// ── 加载数据 ──
function loadData() {
  try {
    var saved = localStorage.getItem('lichong_data');
    if (saved) {
      userData = JSON.parse(saved);
    }
  } catch (e) {}
  
  // 初始赠送一条红鲤
  if (userData.fish.length === 0) {
    userData.fish.push(createRandomFish('红鲤', 'common'));
  }
}

// ── 保存数据 ──
function saveData() {
  try {
    localStorage.setItem('lichong_data', JSON.stringify(userData));
  } catch (e) {}
}

// ── 创建锦鲤 ──
function createRandomFish(name, rarity) {
  var colors = {
    'common': { main: '#EF4444', light: '#FCA5A5', tint: null },
    'rare': { main: '#FBBF24', light: '#FDE68A', tint: 'rgba(255,215,0,0.35)' },
    'epic': { main: '#1F2937', light: '#6B7280', tint: 'rgba(20,30,80,0.5)' },
    'legend': { main: '#8B5CF6', light: '#C4B5FD', tint: 'rgba(128,0,255,0.35)' }
  };
  
  var c = colors[rarity] || colors['common'];
  
  // 随机分配属性，总和10点
  var total = 10;
  var spd = Math.floor(Math.random() * (total - 2)) + 1;
  var luk = Math.floor(Math.random() * (total - spd - 1)) + 1;
  var sta = total - spd - luk;
  
  return {
    name: name,
    rarity: rarity,
    mainColor: c.main,
    lightColor: c.light,
    tintColor: c.tint,
    speed: spd,
    luck: luk,
    stamina: sta,
    level: 1,
    exp: 0,
    expToNext: 10
  };
}

// ── 创建AI对手 ──
function createOpponent() {
  var rand = Math.random();
  var cumulative = 0;
  var opponent = null;
  
  for (var i = 0; i < FISH_TYPES.length; i++) {
    cumulative += FISH_TYPES[i].prob;
    if (rand < cumulative) {
      opponent = createRandomFish(FISH_TYPES[i].name, FISH_TYPES[i].rarity);
      break;
    }
  }
  if (!opponent) {
    opponent = createRandomFish('红鲤', 'common');
  }
  
  // AI性格加成
  var aiType = Math.random();
  if (aiType < 0.33) {
    // 激进型：速度+2
    opponent.speed += 2;
  } else if (aiType < 0.66) {
    // 持久型：耐力+2
    opponent.stamina += 2;
  } else {
    // 赌狗型：运气+2
    opponent.luck += 2;
  }
  
  // 限制属性总和，防止太强
  var total = opponent.speed + opponent.luck + opponent.stamina;
  if (total > 15) {
    var scale = 15 / total;
    opponent.speed = Math.floor(opponent.speed * scale);
    opponent.luck = Math.floor(opponent.luck * scale);
    opponent.stamina = 15 - opponent.speed - opponent.luck;
  }
  
  opponent.isAI = true;
  opponent.aiType = aiType < 0.33 ? 'aggressive' : (aiType < 0.66 ? 'endurance' : 'gambler');
  
  return opponent;
}

// ── 抽鱼 ──
function drawFish() {
  if (userData.fishScales < 10) {
    addFloatingText('鱼鳞不足！需要10鱼鳞', W/2, H/2, '#EF4444');
    return;
  }
  
  userData.fishScales -= 10;
  
  var rand = Math.random();
  var cumulative = 0;
  var newFish = null;
  
  for (var i = 0; i < FISH_TYPES.length; i++) {
    cumulative += FISH_TYPES[i].prob;
    if (rand < cumulative) {
      newFish = createRandomFish(FISH_TYPES[i].name, FISH_TYPES[i].rarity);
      break;
    }
  }
  if (!newFish) {
    newFish = createRandomFish('红鲤', 'common');
  }
  
  userData.fish.push(newFish);
  saveData();
  
  anim.drawResult = newFish;
  anim.drawAnimFrame = 0;
  state = STATE.DRAW;
}

function drawKoi(x, y, size, fish, dir, frame) {
  dir = dir || 1;
  frame = frame || 0;
  
  if (!koiLoaded) return;
  
  sc.save();
  sc.translate(x, y);
  if (dir < 0) sc.scale(-1, 1);
  
  var scale = size / 100;
  var kw = koiImg.width * scale;
  var kh = koiImg.height * scale;
  
  if (fish.tintColor) {
    offCtx.clearRect(0, 0, offCanvas.width, offCanvas.height);
    offCtx.drawImage(koiImg, 0, 0);
    offCtx.globalCompositeOperation = 'source-atop';
    offCtx.fillStyle = fish.tintColor;
    offCtx.fillRect(0, 0, offCanvas.width, offCanvas.height);
    offCtx.globalCompositeOperation = 'source-over';
    sc.drawImage(offCanvas, -kw/2, -kh/2, kw, kh);
  } else {
    sc.drawImage(koiImg, -kw/2, -kh/2, kw, kh);
  }
  
  sc.restore();
}

// ── 绘制小锦鲤图标 ──
function drawKoiIcon(x, y, size, color, lightColor, tintColor) {
  if (!koiLoaded) {
    // 降级到手绘风格
    sc.save();
    sc.translate(x, y);
    var s = size / 30;
    sc.beginPath();
    sc.ellipse(0, 0, 25*s, 15*s, 0, 0, Math.PI * 2);
    var grad = sc.createRadialGradient(-5*s, -5*s, 0, 0, 0, 25*s);
    grad.addColorStop(0, lightColor);
    grad.addColorStop(1, color);
    sc.fillStyle = grad;
    sc.fill();
    sc.beginPath();
    sc.arc(10*s, -2*s, 5*s, 0, Math.PI * 2);
    sc.fillStyle = '#FFF';
    sc.fill();
    sc.beginPath();
    sc.arc(11*s, -2*s, 2*s, 0, Math.PI * 2);
    sc.fillStyle = '#1F2937';
    sc.fill();
    sc.beginPath();
    sc.ellipse(3*s, 4*s, 5*s, 3*s, 0, 0, Math.PI * 2);
    sc.fillStyle = 'rgba(255,150,150,0.5)';
    sc.fill();
    sc.restore();
    return;
  }
  
  sc.save();
  sc.translate(x, y);
  
  var scale = size / 60;
  var kw = koiImg.width * scale;
  var kh = koiImg.height * scale;
  
  if (tintColor) {
    offCtx.clearRect(0, 0, offCanvas.width, offCanvas.height);
    offCtx.drawImage(koiImg, 0, 0);
    offCtx.globalCompositeOperation = 'source-atop';
    offCtx.fillStyle = tintColor;
    offCtx.fillRect(0, 0, offCanvas.width, offCanvas.height);
    offCtx.globalCompositeOperation = 'source-over';
    sc.drawImage(offCanvas, -kw/2, -kh/2, kw, kh);
  } else {
    sc.drawImage(koiImg, -kw/2, -kh/2, kw, kh);
  }
  
  sc.restore();
}

// ── 绘制水波背景 ──
function drawWaterBg() {
  // 水域
  sc.fillStyle = CLR.waterLight;
  sc.fillRect(0, H * 0.35, W, H * 0.65);
  
  // 水波纹
  sc.strokeStyle = 'rgba(123,196,184,0.3)';
  sc.lineWidth = 2;
  for (var i = 0; i < 5; i++) {
    sc.beginPath();
    for (var x = 0; x <= W; x += 10) {
      var y = H * 0.38 + i * 30 + Math.sin((x + anim.waveOffset + i * 20) * 0.02) * 5;
      if (x === 0) sc.moveTo(x, y);
      else sc.lineTo(x, y);
    }
    sc.stroke();
  }
  
  // 气泡
  sc.fillStyle = 'rgba(123,196,184,0.2)';
  for (var b of anim.bubbles) {
    sc.beginPath();
    sc.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    sc.fill();
  }
}

// ── 添加飘字 ──
function addFloatingText(text, x, y, color) {
  anim.floatingTexts.push({
    text: text,
    x: x,
    y: y,
    color: color || CLR.orange,
    alpha: 1,
    vy: -2
  });
}

// ── 更新飘字 ──
function updateFloatingTexts() {
  for (var i = anim.floatingTexts.length - 1; i >= 0; i--) {
    var ft = anim.floatingTexts[i];
    ft.y += ft.vy;
    ft.alpha -= 0.02;
    if (ft.alpha <= 0) {
      anim.floatingTexts.splice(i, 1);
    }
  }
}

// ── 绘制飘字 ──
function drawFloatingTexts() {
  for (var ft of anim.floatingTexts) {
    sc.globalAlpha = ft.alpha;
    sc.fillStyle = ft.color;
    sc.font = 'bold 20px ' + FONT_ZK;
    sc.textAlign = 'center';
    sc.fillText(ft.text, ft.x + anim.shakeX, ft.y);
  }
  sc.globalAlpha = 1;
}

function drawMenu() {

  sc.fillRect(0, 0, W, H);
  
  // 顶部信息栏
  sc.fillStyle = CLR.orange;
  sc.fillRect(0, 0, W, 60);
  
  sc.fillStyle = '#FFF';
  sc.font = '24px ' + FONT_ZK;
  sc.textAlign = 'center';
  sc.fillText('鲤冲冲', W/2, 42);
  
  // 鱼鳞数量
  sc.font = '14px ' + FONT_ZK;
  sc.textAlign = 'left';
  sc.fillText('粮 ' + userData.fishScales, 20, 38);
  sc.textAlign = 'right';
  sc.fillText('食 ' + userData.feed, W - 20, 38);
  
  // 品牌
  sc.fillStyle = CLR.grayLight;
  sc.font = '12px ' + FONT_JH;
  sc.textAlign = 'center';

  drawWaterBg();
  
  // 菜单锦鲤游动
  anim.menuKoiY = H * 0.5 + Math.sin(Date.now() * 0.002) * 20;

  if (userData.fish.length > 0) {

  // 功能按钮
  var btnY = H * 0.65;
  var btnSize = Math.min(70, (W - 60) / 4);
  var gap = 15;
  var totalW = btnSize * 2 + gap;
  var startX = (W - totalW) / 2;
  
  var buttons = [
    { text: '赛跑', action: 'race' },
    { text: '养成', action: 'feed' },
    { text: '抽鱼', action: 'draw', badge: '10' },
    { text: '图鉴', action: 'guide' }
  ];
  
  for (var i = 0; i < 2; i++) {
    for (var j = 0; j < 2; j++) {
      var idx = i * 2 + j;
      var btn = buttons[idx];
      var bx = startX + j * (btnSize + gap);
      var by = btnY + i * (btnSize + gap + 10);
      
      // 按钮阴影
      sc.fillStyle = CLR.shadow;
      sc.beginPath();
      sc.roundRect(bx + 3, by + 3, btnSize, btnSize, 15);
      sc.fill();
      
      // 按钮背景
      var isOrange = idx === 0 || idx === 2;
      sc.fillStyle = isOrange ? CLR.orange : '#7BC4B8';
      sc.beginPath();
      sc.roundRect(bx, by, btnSize, btnSize, 15);
      sc.fill();
      
      // 按钮文字
      sc.fillStyle = '#FFF';
      sc.font = '16px ' + FONT_ZK;
      sc.textAlign = 'center';
      sc.fillText(btn.text, bx + btnSize/2, by + btnSize/2 + 5);
      
      // 抽鱼价格标签
      if (btn.badge) {
        sc.fillStyle = '#FFF';
        sc.font = '10px ' + FONT_ZK;
        sc.fillText(btn.badge + '鳞', bx + btnSize/2, by + btnSize/2 + 22);
      }
      
      // 存储按钮区域
      btn.x = bx;
      btn.y = by;
      btn.w = btnSize;
      btn.h = btnSize;
    }
  }
  
  // 底部提示
  sc.fillStyle = CLR.grayLight;
  sc.font = '12px ' + FONT_ZK;
  sc.textAlign = 'center';
  sc.fillText('点击按钮开始游戏', W/2, H - 50);
  
  drawFloatingTexts();
}

  sc.font = '20px ' + FONT_ZK;

// ── 赛跑界面 ──
function drawRace() {
  sc.fillStyle = CLR.bg;
  sc.fillRect(0, 0, W, H);
  
  // 顶部信息
  sc.fillStyle = CLR.orange;
  sc.fillRect(0, 0, W, 50);
  sc.fillStyle = '#FFF';
  sc.font = '16px ' + FONT_ZK;
  sc.textAlign = 'center';
  sc.fillText('锦鲤赛跑', W/2, 32);
  
  // 玩家名称
  sc.textAlign = 'left';
  sc.font = '14px ' + FONT_ZK;
  sc.fillText(currentFish.name, 10, 32);
  
  // 对手名称
  sc.textAlign = 'right';
  sc.fillText(opponentFish.name, W - 10, 32);
  
  // 赛道区域
  var trackY = 100;
  var trackH = 180;
  
  // 计算屏幕坐标
  var cameraX = race.cameraX;
  var playerScreenX = W * 0.3; // 玩家固定在屏幕左侧1/3处
  var opponentScreenX = playerScreenX + (race.opponentDist - race.playerDist); // 相对距离差
  // 限制对手在屏幕可见范围
  if (opponentScreenX < 30) opponentScreenX = 30;
  if (opponentScreenX > W - 30) opponentScreenX = W - 30;
  
  // 水域背景（视差滚动）
  sc.fillStyle = CLR.waterLight;
  sc.fillRect(0, trackY, W, trackH);
  
  // 远处的山/云（慢速视差）
  var bgOffset = (cameraX * 0.2) % W;
  sc.fillStyle = 'rgba(123,196,184,0.3)';
  for (var mx = -bgOffset; mx < W + 200; mx += 200) {
    sc.beginPath();
    sc.moveTo(mx, trackY + 40);
    sc.lineTo(mx + 100, trackY);
    sc.lineTo(mx + 200, trackY + 40);
    sc.fill();
  }
  
  // 中间的水草（中等视差）
  var midOffset = (cameraX * 0.5) % 150;
  sc.fillStyle = 'rgba(90,173,160,0.4)';
  for (var gx = -midOffset; gx < W + 150; gx += 150) {
    sc.beginPath();
    sc.moveTo(gx, trackY + trackH);
    sc.quadraticCurveTo(gx + 10, trackY + trackH - 40, gx + 5, trackY + trackH - 70);
    sc.quadraticCurveTo(gx + 15, trackY + trackH - 40, gx + 20, trackY + trackH);
    sc.fill();
  }
  
  // 水波纹（快速视差）
  sc.strokeStyle = 'rgba(255,255,255,0.2)';
  sc.lineWidth = 1;
  var waveOffset = (cameraX * 0.8) % 50;
  for (var wy = trackY + 20; wy < trackY + trackH; wy += 30) {
    sc.beginPath();
    for (var wx = -waveOffset; wx < W; wx += 5) {
      var waveY = wy + Math.sin((wx + Date.now() * 0.01) * 0.05) * 3;
      if (wx === -waveOffset) sc.moveTo(wx, waveY);
      else sc.lineTo(wx, waveY);
    }
    sc.stroke();
  }
  
  // 起点线（世界坐标0）
  var startLineX = 0 - cameraX;
  if (startLineX > -50 && startLineX < W + 50) {
    sc.fillStyle = '#7BC4B8';
    sc.fillRect(startLineX, trackY, 8, trackH);
    sc.fillStyle = '#FFF';
    sc.font = '12px ' + FONT_ZK;
    sc.textAlign = 'center';
    sc.fillText('起点', startLineX + 4, trackY - 5);
  }
  
  // 策略点标记（发光水门）
  var gateColors = ['#F97316', '#8B5CF6', '#FBBF24']; // 橙紫黄
  for (var gi = 0; gi < race.strategyPoints.length; gi++) {
    var gateWorldX = race.strategyPoints[gi] * race.TRACK_LEN;
    var gateScreenX = gateWorldX - cameraX;
    
    // 只绘制屏幕内可见的水门
    if (gateScreenX > -50 && gateScreenX < W + 50) {
      // 检查是否已过
      var passed = gi < race.nextStrategyIdx;
      
      // 计算亮度（接近时变亮）
      var distToGate = gateWorldX - race.playerDist;
      var glowIntensity = 0;
      if (!passed) {
        if (distToGate < W && distToGate > 0) {
          glowIntensity = 1 - (distToGate / W);
        } else if (distToGate <= 0) {
          glowIntensity = 1;
        }
      }
      
      // 水门主体
      var color = gateColors[gi % gateColors.length];
      sc.fillStyle = passed ? 'rgba(150,150,150,0.3)' : color;
      sc.fillRect(gateScreenX - 3, trackY, 6, trackH);
      
      // 发光效果
      if (!passed && glowIntensity > 0) {
        sc.save();
        sc.globalAlpha = glowIntensity * 0.5;
        sc.shadowColor = color;
        sc.shadowBlur = 20;
        sc.fillRect(gateScreenX - 3, trackY, 6, trackH);
        sc.restore();
      }
      
      // 标签
      sc.fillStyle = passed ? '#9CA3AF' : color;
      sc.font = '10px ' + FONT_ZK;
      sc.textAlign = 'center';
      sc.fillText((gi + 1) + '号策略点', gateScreenX, trackY - 5);
    }
  }
  
  // 终点线
  var endLineX = race.TRACK_LEN - cameraX;
  if (endLineX > -50 && endLineX < W + 50) {
    sc.fillStyle = CLR.gold;
    sc.fillRect(endLineX - 4, trackY, 8, trackH);
    // 终点旗子
    sc.fillStyle = '#FFF';
    sc.font = 'bold 14px ' + FONT_ZK;
    sc.textAlign = 'center';
    sc.fillText('终点', endLineX, trackY - 5);
    // 格子旗效果
    sc.fillStyle = '#1F2937';
    for (var fi = 0; fi < 5; fi++) {
      if (fi % 2 === 0) {
        sc.fillRect(endLineX - 4, trackY + fi * 10, 8, 10);
      }
    }
  }
  
  // 进度条（玩家和对手分行显示，避免遮挡）
  var progressY = trackY + trackH + 10;
  var progressW = W - 40;
  var progressX = 20;
  var progressH = 6;
  
  // 对手进度（上方，蓝色）
  sc.fillStyle = '#E5E7EB';
  sc.beginPath();
  sc.roundRect(progressX, progressY, progressW, progressH, 3);
  sc.fill();
  sc.fillStyle = '#3B82F6';
  sc.beginPath();
  sc.roundRect(progressX, progressY, progressW * Math.min(1, race.opponentProgress / 100), progressH, 3);
  sc.fill();
  sc.fillStyle = '#3B82F6';
  sc.font = '9px ' + FONT_ZK;
  sc.textAlign = 'left';
  sc.fillText('对手', progressX, progressY - 2);
  sc.textAlign = 'right';
  sc.fillText(Math.round(race.opponentProgress) + '%', progressX + progressW, progressY - 2);
  
  // 玩家进度（下方，橙色）
  sc.fillStyle = '#E5E7EB';
  sc.beginPath();
  sc.roundRect(progressX, progressY + progressH + 8, progressW, progressH, 3);
  sc.fill();
  sc.fillStyle = CLR.orange;
  sc.beginPath();
  sc.roundRect(progressX, progressY + progressH + 8, progressW * Math.min(1, race.playerProgress / 100), progressH, 3);
  sc.fill();
  sc.fillStyle = CLR.orange;
  sc.font = '9px ' + FONT_ZK;
  sc.textAlign = 'left';
  sc.fillText('你', progressX, progressY + progressH + 6);
  sc.textAlign = 'right';
  sc.fillText(Math.round(race.playerProgress) + '%', progressX + progressW, progressY + progressH + 6);
  
  // 玩家锦鲤（固定屏幕位置）
  var playerY = trackY + trackH * 0.65;
  var playerBob = Math.sin(Date.now() * 0.008) * 4;
  
  // 玩家锦鲤绘制（含冲刺/爆发视觉反馈）
  if (race.playerBoost > 0) {
    // 冲刺：橙色光晕增强 + 水花拖尾
    sc.save();
    sc.shadowColor = CLR.orange;
    sc.shadowBlur = 25;
    drawKoi(playerScreenX, playerY + playerBob, 55, currentFish, 1, Date.now() * 0.1);
    sc.restore();
    // 水花拖尾
    for (var i = 0; i < 3; i++) {
      sc.beginPath();
      var trailX = playerScreenX - 35 - i * 15;
      var trailY = playerY + playerBob + (i - 1) * 4;
      var trailR = 3 - i * 0.8;
      sc.arc(trailX, trailY, Math.max(0.5, trailR), 0, Math.PI * 2);
      sc.fillStyle = 'rgba(255,255,255,' + (0.5 - i * 0.15) + ')';
      sc.fill();
    }
  } else if (race.playerBurst > 0) {
    // 爆发：紫色光晕
    sc.save();
    sc.shadowColor = '#8B5CF6';
    sc.shadowBlur = 30;
    drawKoi(playerScreenX, playerY + playerBob, 55, currentFish, 1, Date.now() * 0.1);
    sc.restore();
  } else {
    // 正常：橙色光晕
    sc.save();
    sc.shadowColor = CLR.orange;
    sc.shadowBlur = 15;
    drawKoi(playerScreenX, playerY + playerBob, 55, currentFish, 1, Date.now() * 0.1);
    sc.restore();
  }
  
  // 玩家标签
  sc.fillStyle = CLR.orange;
  sc.beginPath();
  sc.roundRect(playerScreenX - 20, playerY - 55 + playerBob, 40, 18, 8);
  sc.fill();
  sc.fillStyle = '#FFF';
  sc.font = 'bold 12px ' + FONT_ZK;
  sc.textAlign = 'center';
  sc.fillText('你', playerScreenX, playerY - 43 + playerBob);
  
  // 对手锦鲤
  var opponentY = trackY + trackH * 0.35;
  var opponentBob = Math.sin(Date.now() * 0.008 + 1.5) * 4;
  
  // 对手锦鲤绘制（含冲刺/爆发视觉反馈）
  if (race.opponentBoost > 0) {
    sc.save();
    sc.shadowColor = '#3B82F6';
    sc.shadowBlur = 25;
    drawKoi(opponentScreenX, opponentY + opponentBob, 55, opponentFish, 1, Date.now() * 0.1);
    sc.restore();
  } else if (race.opponentBurst > 0) {
    sc.save();
    sc.shadowColor = '#8B5CF6';
    sc.shadowBlur = 25;
    drawKoi(opponentScreenX, opponentY + opponentBob, 55, opponentFish, 1, Date.now() * 0.1);
    sc.restore();
  } else {
    sc.save();
    sc.shadowColor = '#3B82F6';
    sc.shadowBlur = 12;
    drawKoi(opponentScreenX, opponentY + opponentBob, 55, opponentFish, 1, Date.now() * 0.1);
    sc.restore();
  }
  
  // 对手标签
  sc.fillStyle = '#6B7280';
  sc.beginPath();
  sc.roundRect(opponentScreenX - 28, opponentY - 55 + opponentBob, 56, 18, 8);
  sc.fill();
  sc.fillStyle = '#FFF';
  sc.font = 'bold 12px ' + FONT_ZK;
  sc.textAlign = 'center';
  sc.fillText('对手', opponentScreenX, opponentY - 43 + opponentBob);
  
  // 耐力条
  var staminaY = trackY + trackH + 52;
  var staminaW = Math.min(280, W - 40);
  var staminaX = (W - staminaW) / 2;
  
  sc.fillStyle = '#E5E7EB';
  sc.beginPath();
  sc.roundRect(staminaX, staminaY, staminaW, 18, 9);
  sc.fill();
  
  var staminaPercent = race.playerStamina / 100;
  var staminaColor = staminaPercent > 0.5 ? '#7BC4B8' : (staminaPercent > 0.25 ? '#FBBF24' : '#EF4444');
  sc.fillStyle = staminaColor;
  sc.beginPath();

    var btnStartX = (W - totalBtnW) / 2;
    
    var buttons = [
      { text: '冲', sub: '速度+40%', cost: '需30耐力', color: CLR.orange, need: 30, action: 'rush' },
      { text: '稳', sub: '恢复+10%', cost: '免费', color: '#7BC4B8', need: 0, action: 'steady' },
      { text: '爆', sub: '运%触发', cost: '需50耐力', color: '#8B5CF6', need: 50, action: 'burst' }
    ];
    
    for (var i = 0; i < 3; i++) {
      var bx = btnStartX + i * (btnW + btnGap);
      var btn = buttons[i];
      var canUse = race.playerStamina >= btn.need;
      
      sc.fillStyle = canUse ? btn.color : '#9CA3AF';

      sc.roundRect(bx, btnY, btnW, btnH, 15);

// ── 抽鱼界面 ──
function drawDrawFish() {
  sc.fillStyle = 'rgba(0,0,0,0.8)';
  sc.fillRect(0, 0, W, H);
  
  var result = anim.drawResult;
  var frame = anim.drawAnimFrame;
  
  // 抽奖动画
  if (frame < 60) {
    // 快速切换动画
    var flashType = Math.floor(frame / 5) % FISH_TYPES.length;
    var flashFish = FISH_TYPES[flashType];
    
    sc.fillStyle = '#FFF';
    sc.font = '16px ' + FONT_ZK;
    sc.textAlign = 'center';
    sc.fillText('抽奖中...', W/2, H/2);
    
    drawKoi(W/2, H/2 + 50, 80, flashFish, 1, frame * 2);
  } else {
    // 展示结果
    var scale = Math.min(1, (frame - 60) / 20);
    result.tintColor = result.tintColor || FISH_TYPES.find(function(f) { return f.name === result.name; }).tintColor;
    
    // 光芒效果
    if (frame > 60) {
      sc.save();
      sc.globalAlpha = 0.3;
      for (var i = 0; i < 8; i++) {
        var angle = (i / 8) * Math.PI * 2 + frame * 0.05;
        var rayX = W/2 + Math.cos(angle) * 100 * scale;
        var rayY = H/2 + 50 + Math.sin(angle) * 100 * scale;
        sc.beginPath();
        sc.moveTo(W/2, H/2 + 50);
        sc.lineTo(rayX, rayY);
        sc.strokeStyle = result.mainColor;
        sc.lineWidth = 3;
        sc.stroke();
      }
      sc.restore();
    }
    
    // 锦鲤
    drawKoi(W/2, H/2 + 50, 80 * scale, result, 1, Date.now() * 0.1);
    
    // 名称
    sc.fillStyle = '#FFF';
    sc.font = 'bold 28px ' + FONT_ZK;
    sc.textAlign = 'center';
    sc.fillText('获得 ' + result.name + '!', W/2, H/2 - 40);
    
    // 稀有度
    var rarityColors = { common: '#9CA3AF', rare: '#3B82F6', epic: '#8B5CF6', legend: '#F59E0B' };
    sc.fillStyle = rarityColors[result.rarity];
    sc.font = '18px ' + FONT_ZK;
    var rarityText = { common: '普通', rare: '稀有', epic: '史诗', legend: '传说' };
    sc.fillText(rarityText[result.rarity], W/2, H/2 - 10);
    
    // 属性
    sc.fillStyle = '#FFF';
    sc.font = '14px ' + FONT_ZK;
    sc.fillText('速:' + result.speed + ' 运:' + result.luck + ' 耐:' + result.stamina, W/2, H/2 + 140);
    
    // 确定按钮
    if (frame > 80) {
      var btnW = 150;
      var btnH = 50;
      var btnX = (W - btnW) / 2;
      var btnY = H - 120;
      
      sc.fillStyle = CLR.orange;
      sc.beginPath();
      sc.roundRect(btnX, btnY, btnW, btnH, 25);
      sc.fill();
      
      sc.fillStyle = '#FFF';
      sc.font = '18px ' + FONT_ZK;
      sc.fillText('太棒了！', W/2, btnY + 33);
    }
  }
  
  anim.drawAnimFrame++;
}

// ── 更新赛跑逻辑 ──
function updateRace() {
  if (race.finished) return;
  
  // 如果在策略点暂停，不更新位置
  if (race.paused) return;
  
  race.raceTime++;
  
  // 玩家基础速度
  var baseSpeed = 0.8 + currentFish.speed * 0.1;
  
  // 应用加速效果
  if (race.playerBoost > 0) {
    baseSpeed *= 1.4;
    race.playerBoost--;
    race.playerStamina -= 0.3;
  }
  if (race.playerBurst > 0) {
    baseSpeed *= 1.8;
    race.playerBurst--;
    race.playerStamina -= 0.5;
  }
  
  // 耐力恢复
  if (race.playerBoost === 0 && race.playerBurst === 0) {
    race.playerStamina = Math.min(100, race.playerStamina + 0.15);
  }
  
  race.playerSpeed = baseSpeed;
  race.playerDist += race.playerSpeed; // 用距离代替屏幕坐标
  
  // AI对手逻辑
  var aiBaseSpeed = 0.8 + opponentFish.speed * 0.1;
  
  // AI决策
  var aiDecision = Math.random();
  if (opponentFish.aiType === 'aggressive') {
    if (aiDecision < 0.4 && race.opponentStamina >= 30) {
      race.opponentBoost = 180;
      race.opponentStamina -= 30;
    }
  } else if (opponentFish.aiType === 'gambler') {
    if (aiDecision < opponentFish.luck / 50 && race.opponentStamina >= 50) {
      race.opponentBurst = 120;
      race.opponentStamina -= 50;
    }
  } else {
    if (aiDecision < 0.2 && race.opponentStamina >= 30) {
      race.opponentBoost = 180;
      race.opponentStamina -= 30;
    }
  }
  
  // AI速度计算
  if (race.opponentBoost > 0) {
    aiBaseSpeed *= 1.4;
    race.opponentBoost--;
    race.opponentStamina -= 0.3;
  }
  if (race.opponentBurst > 0) {
    aiBaseSpeed *= 1.8;
    race.opponentBurst--;
    race.opponentStamina -= 0.5;
  }
  
  // AI耐力恢复
  if (race.opponentBoost === 0 && race.opponentBurst === 0) {
    race.opponentStamina = Math.min(100, race.opponentStamina + 0.15);
  }
  
  race.opponentSpeed = aiBaseSpeed;
  race.opponentDist += race.opponentSpeed; // 用距离代替屏幕坐标
  
  // 摄像机跟随玩家
  race.cameraX = race.playerDist - W * 0.3;
  
  // 进度计算
  race.playerProgress = (race.playerDist / race.TRACK_LEN) * 100;
  race.opponentProgress = (race.opponentDist / race.TRACK_LEN) * 100;
  
  // 检查是否到达策略点
  if (race.nextStrategyIdx < race.strategyPoints.length) {
    var nextPoint = race.strategyPoints[race.nextStrategyIdx] * race.TRACK_LEN;
    if (race.playerDist >= nextPoint) {
      race.paused = true;
      race.nextStrategyIdx++;
      addFloatingText('选择策略!', W/2, H/2 - 50, CLR.orange);
      return;
    }
  }
  
  // 检查完成
  if (race.playerDist >= race.TRACK_LEN || race.opponentDist >= race.TRACK_LEN) {
    race.finished = true;
    if (race.playerDist >= race.TRACK_LEN && race.opponentDist >= race.TRACK_LEN) {
      race.winner = race.playerDist > race.opponentDist ? 'player' : 'opponent';
    } else {
      race.winner = race.playerDist >= race.TRACK_LEN ? 'player' : 'opponent';
    }
    
    // 发放奖励
    var scaleReward = race.winner === 'player' ? 30 : (Math.abs(race.playerProgress - race.opponentProgress) < 5 ? 15 : 5);
    userData.fishScales += scaleReward;
    
    // 经验
    if (selectedFishIndex >= 0) {
      userData.fish[selectedFishIndex].exp += 10;
      if (userData.fish[selectedFishIndex].exp >= userData.fish[selectedFishIndex].expToNext) {
        userData.fish[selectedFishIndex].level++;
        userData.fish[selectedFishIndex].exp = 0;
        userData.fish[selectedFishIndex].expToNext = Math.floor(userData.fish[selectedFishIndex].expToNext * 1.5);
        var p = Math.floor(Math.random() * 3);
        if (p === 0) userData.fish[selectedFishIndex].speed++;
        else if (p === 1) userData.fish[selectedFishIndex].luck++;
        else userData.fish[selectedFishIndex].stamina++;
        addFloatingText('升级了!等级' + userData.fish[selectedFishIndex].level, W/2, H/2, CLR.gold);
      }
    }
    
    saveData();
    state = STATE.RESULT;
  }
}

// ── 更新气泡 ──
function updateBubbles() {
  for (var b of anim.bubbles) {
    b.y -= b.speed;
    b.wobble += 0.02;
    b.x += Math.sin(b.wobble) * 0.5;
    if (b.y < H * 0.35) {
      b.y = H;
      b.x = Math.random() * W;
    }
  }
}

// ── 开始赛跑 ──
function startRace() {
  currentFish = userData.fish[selectedFishIndex];
  opponentFish = createOpponent();
  
  race = {
    // 滚动赛道: 4倍屏幕宽度
    playerDist: 0,
    opponentDist: 0,
    cameraX: 0,
    TRACK_LEN: W * 4,
    playerSpeed: 0,
    opponentSpeed: 0,
    playerStamina: 100,
    opponentStamina: 100,
    playerBoost: 0,
    opponentBoost: 0,
    playerBurst: 0,
    opponentBurst: 0,
    raceTime: 0,
    phase: 0,
    finished: false,
    winner: null,
    _fortune: null,
    playerProgress: 0,
    opponentProgress: 0,
    // 策略点机制
    strategyPoints: [0.25, 0.5, 0.75],
    nextStrategyIdx: 0,
    paused: false
  };
  
  state = STATE.RACE;
}

// ── 玩家操作 ──
function playerAction(action) {
  if (action === 'rush') {
    // 冲刺
    if (race.playerStamina >= 30) {
      race.playerBoost = 180; // 3秒
      addFloatingText('冲鸭!', W/2, H/2, CLR.orange);
      race.paused = false; // 继续比赛
    } else {
      addFloatingText('耐力不足!', W/2, H/2, '#EF4444');
    }
  } else if (action === 'steady') {
    // 稳健
    race.playerStamina = Math.min(100, race.playerStamina + 10);
    addFloatingText('稳住~', W/2, H/2, '#7BC4B8');
    race.paused = false; // 继续比赛
  } else if (action === 'burst') {
    // 爆发
    if (race.playerStamina >= 50) {
      var chance = currentFish.luck * 10;
      if (Math.random() * 100 < chance) {
        race.playerBurst = 120; // 2秒
        race.playerStamina -= 50;
        addFloatingText('锦鲤附体!', W/2, H/2, '#8B5CF6');
      } else {
        race.playerStamina -= 25;
        addFloatingText('差一点点...', W/2, H/2, CLR.grayLight);
      }
      race.paused = false; // 继续比赛
    } else {
      addFloatingText('耐力不足!', W/2, H/2, '#EF4444');
    }
  }
}

// ── 点击处理 ──
c.addEventListener('click', function(e) {
  var rect = c.getBoundingClientRect();
  var x = (e.clientX - rect.left);
  var y = (e.clientY - rect.top);
  
  if (state === STATE.MENU) {
    // 菜单按钮
    var buttons = [
      { text: '赛跑', action: function() { selectedFishIndex = 0; state = STATE.SELECT_FISH; } },
      { text: '养成', action: function() { selectedFishIndex = 0; state = STATE.FEED; } },
      { text: '抽鱼', action: drawFish },
      { text: '图鉴', action: function() { state = STATE.GUIDE; } }
    ];
    
    var btnY = H * 0.65;
    var btnSize = Math.min(70, (W - 60) / 4);
    var gap = 15;
    var totalW = btnSize * 2 + gap;
    var startX = (W - totalW) / 2;
    
    for (var i = 0; i < 2; i++) {
      for (var j = 0; j < 2; j++) {
        var idx = i * 2 + j;
        var bx = startX + j * (btnSize + gap);
        var by = btnY + i * (btnSize + gap + 10);
        
        if (x >= bx && x <= bx + btnSize && y >= by && y <= by + btnSize) {
          buttons[idx].action();
          return;
        }
      }
    }
  } else if (state === STATE.SELECT_FISH) {
    // 返回
    if (x < 50 && y < 50) {
      state = STATE.MENU;
      return;
    }
    
    // 选择锦鲤
    var startY = 80;
    var itemH = 90;
    for (var i = 0; i < userData.fish.length; i++) {
      if (y >= startY + i * itemH && y < startY + (i + 1) * itemH) {
        selectedFishIndex = i;
        return;
      }
    }
    
    // 开始比赛
    if (selectedFishIndex >= 0 && y > H - 100) {
      startRace();
    }
  } else if (state === STATE.RACE) {
    // 返回按钮
    if (x < 60 && y > H - 60) {
      state = STATE.MENU;
      return;
    }
    
    // 策略点暂停时的按钮点击
    if (race.paused) {
      var btnY = H/2 - 30;
      var btnW = Math.min(100, (W - 80) / 3);
      var btnH = 80;
      var btnGap = 20;
      var totalBtnW = btnW * 3 + btnGap * 2;
      var btnStartX = (W - totalBtnW) / 2;
      
      if (y >= btnY && y <= btnY + btnH) {
        for (var i = 0; i < 3; i++) {
          var bx = btnStartX + i * (btnW + btnGap);
          if (x >= bx && x <= bx + btnW) {
            var actions = ['rush', 'steady', 'burst'];
            playerAction(actions[i]);
            return;
          }
        }
      }
    }
    // 非暂停时不响应按钮点击（让游戏继续自动跑）
  } else if (state === STATE.DRAW) {
    // 抽鱼确认 - 点击确定按钮返回
    if (anim.drawAnimFrame > 80) {
      var btnW = 150;
      var btnH = 50;
      var btnX = (W - btnW) / 2;
      var btnY = H - 120;
      if (x >= btnX && x <= btnX + btnW && y >= btnY && y <= btnY + btnH) {
        state = STATE.MENU;
      }
    }
  } else if (state === STATE.RESULT) {
    // 再来一局
    if (y > H - 150 && y < H - 100) {
      startRace();
      return;
    }
    // 返回主界面
    if (y > H - 90) {
      state = STATE.MENU;
    }
  } else if (state === STATE.FEED) {
    // 返回
    if (x < 50 && y < 50) {
      state = STATE.MENU;
      return;
    }
    
    // 喂食
    if (userData.feed > 0 && y > H - 120 && y < H - 70) {
      userData.feed--;
      userData.fish[selectedFishIndex].exp += 10;
      
      if (userData.fish[selectedFishIndex].exp >= userData.fish[selectedFishIndex].expToNext) {
        userData.fish[selectedFishIndex].level++;
        userData.fish[selectedFishIndex].exp = 0;
        userData.fish[selectedFishIndex].expToNext = Math.floor(userData.fish[selectedFishIndex].expToNext * 1.5);
        var p = Math.floor(Math.random() * 3);
        if (p === 0) userData.fish[selectedFishIndex].speed++;
        else if (p === 1) userData.fish[selectedFishIndex].luck++;
        else userData.fish[selectedFishIndex].stamina++;
        addFloatingText('升级了！等级' + userData.fish[selectedFishIndex].level, W/2, H/2, CLR.gold);
      } else {
        addFloatingText('+10经验', W/2, H/2, '#7BC4B8');
      }
      saveData();
      return;
    }
    
    // 切换锦鲤
    if (userData.fish.length > 1) {
      if (x < 70 && y > H - 75) {
        selectedFishIndex = (selectedFishIndex - 1 + userData.fish.length) % userData.fish.length;
      }
      if (x > W - 70 && y > H - 75) {
        selectedFishIndex = (selectedFishIndex + 1) % userData.fish.length;
      }
    }
  } else if (state === STATE.GUIDE) {
    // 返回
    if (x < 50 && y < 50) {
      state = STATE.MENU;
    }
  }
});

// ── 触摸事件（移动端）──
c.addEventListener('touchstart', function(e) {
  e.preventDefault();
  var touch = e.touches[0];
  var rect = c.getBoundingClientRect();
  var x = (touch.clientX - rect.left);
  var y = (touch.clientY - rect.top);
  
  // 模拟点击
  c.dispatchEvent(new MouseEvent('click', { clientX: touch.clientX, clientY: touch.clientY }));
}, { passive: false });

// ── 游戏主循环 ──
var lastTime = 0;
function gameLoop(timestamp) {
  var deltaTime = timestamp - lastTime;
  lastTime = timestamp;
  
  // 更新
  anim.waveOffset += 0.5;
  updateBubbles();
  updateFloatingTexts();
  
  if (state === STATE.RACE) {
    updateRace();
  }
  
  // 震动效果衰减
  anim.shakeX *= 0.9;
  
  // 绘制
  sc.clearRect(0, 0, W, H);
  
  switch (state) {
    case STATE.MENU:
      drawMenu();
      break;
    case STATE.SELECT_FISH:
      drawSelectFish();
      break;
    case STATE.RACE:
      drawRace();
      break;
    case STATE.DRAW:
      drawDrawFish();
      break;
    case STATE.RESULT:
      drawResult();
      break;
    case STATE.FEED:
      drawFeed();
      break;
    case STATE.GUIDE:
      drawGuide();
      break;
  }
  
  requestAnimationFrame(gameLoop);
}

// ── 初始化 ──
loadData();
initBubbles();
requestAnimationFrame(gameLoop);
</script>
</body>
